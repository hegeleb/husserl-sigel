<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Зиглы Гуссерля · словарь стенографии</title>
<style>
:root{
  --bg:#faf9f7; --panel:#f3f1ec; --card:#fff; --fg:#1c2228; --mut:#6d7783; --faint:#96a0ab;
  --line:#e3e0da; --line2:#d3cfc7; --acc:#31465c; --acc-soft:#e8edf3; --hi:#ffeaa0;
  --shadow:0 1px 2px rgba(28,34,40,.05);
  --r:9px; --sidew:250px; --topw:58px;
}
:root[data-t="dark"]{
  --bg:#14171b; --panel:#1b1f25; --card:#1c2127; --fg:#e7e7e5; --mut:#98a2ad; --faint:#6e7883;
  --line:#2a3037; --line2:#39414a; --acc:#a8c0d8; --acc-soft:#232c37; --hi:#63521a;
  --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit}
button,select,input{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;height:var(--topw);display:flex;align-items:center;gap:14px;
  padding:0 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:640;letter-spacing:.005em;white-space:nowrap}
.brand span{color:var(--faint);font-weight:400;margin-left:8px;font-size:12.5px}
.tabs{display:flex;gap:2px;background:var(--panel);padding:3px;border-radius:8px}
.tabs button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:13.5px;
  color:var(--mut);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow);font-weight:560}
.grow{flex:1}
.srch{position:relative;flex:0 1 380px;min-width:150px}
.srch input{width:100%;padding:7px 30px 7px 32px;border:1px solid var(--line2);border-radius:8px;
  background:var(--card);font-size:14px}
.srch input:focus{outline:2px solid var(--acc-soft);border-color:var(--acc)}
.srch .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px}
.srch kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--faint);
  font:11px/1 ui-monospace,monospace;border:1px solid var(--line2);border-radius:4px;padding:2px 4px}
.iconbtn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:6px 10px;
  cursor:pointer;font-size:13px;color:var(--mut)}
.iconbtn:hover{color:var(--fg);border-color:var(--acc)}
.iconbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-t="dark"] .iconbtn.on{color:#12171c}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--sidew) minmax(0,1fr);gap:0;align-items:start}
.side{position:sticky;top:var(--topw);height:calc(100vh - var(--topw));overflow-y:auto;
  border-right:1px solid var(--line);padding:16px 14px 40px;background:var(--bg)}
.side h4{margin:18px 0 7px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:620}
.side h4:first-child{margin-top:0}
.side select{width:100%;padding:6px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--card);font-size:13px}
.abc{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.abc a{display:block;text-align:center;padding:4px 0;border-radius:5px;font-size:12.5px;
  text-decoration:none;color:var(--acc);border:1px solid transparent}
.abc a:hover{background:var(--panel)}
.abc a.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-t="dark"] .abc a.on{color:#12171c}
.abc a.off{color:var(--faint);opacity:.4;pointer-events:none}
.bls{display:flex;flex-wrap:wrap;gap:4px}
.bls a{font-size:12.5px;text-decoration:none;padding:3px 8px;border:1px solid var(--line);
  border-radius:20px;color:var(--mut);background:var(--card);white-space:nowrap}
.bls a:hover{border-color:var(--acc);color:var(--fg)}
.bls a.on{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-t="dark"] .bls a.on{color:#12171c}
.bls a i{font-style:normal;color:var(--faint);font-size:11px;margin-left:4px}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.sizes button{border:1px solid var(--line2);background:var(--card);border-radius:7px;padding:5px 0;
  font-size:12px;color:var(--mut);cursor:pointer}
.sizes button.on{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-t="dark"] .sizes button.on{color:#12171c}
.side .note{font-size:12px;color:var(--faint);line-height:1.5;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
main{padding:20px 26px 120px;max-width:1080px}

/* ---------- groups & cards ---------- */
.gh{position:sticky;top:var(--topw);z-index:10;margin:26px 0 10px;padding:7px 0 6px;
  background:linear-gradient(var(--bg) 70%,transparent);display:flex;align-items:baseline;gap:12px}
.gh:first-child{margin-top:0}
.gh b{font-size:19px;font-weight:640;letter-spacing:.01em}
.gh .meta{font-size:12.5px;color:var(--mut)}
.gh .meta em{font-style:normal;color:var(--faint)}
.card{display:grid;grid-template-columns:var(--cutcol,152px) minmax(0,1fr);gap:16px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-bottom:8px;
  box-shadow:var(--shadow);scroll-margin-top:110px}
.card.act{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.card.flash{animation:fl 1.4s ease}
@keyframes fl{0%,40%{background:var(--hi)}100%{background:var(--card)}}
.cuts{display:flex;flex-direction:column;gap:5px;min-width:0}
.cuts img{display:block;max-height:var(--cut,58px);width:auto;max-width:100%;object-fit:contain;
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px;cursor:zoom-in}
.nocut{width:48px;height:30px;border:1px dashed var(--line2);border-radius:6px}
.hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.w{font-size:17px;font-weight:640;letter-spacing:.005em}
.chip{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:1px 7px;white-space:nowrap}
.chip.b{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.lit{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);margin-top:4px}
.lit b{color:var(--faint);font-weight:400}
.k{margin-top:5px}
.c{margin-top:5px;color:var(--mut);font-size:13.5px;font-style:italic}
.xr{color:var(--acc);text-decoration:none;border-bottom:1px dotted var(--acc);cursor:pointer}
.xr:hover{background:var(--acc-soft)}
mark{background:var(--hi);color:inherit;padding:0 1px;border-radius:2px}
body.compact .c,body.compact .lit{display:none}
body.compact .card{padding:7px 12px;margin-bottom:5px}
.more{text-align:center;color:var(--faint);padding:26px 0;font-size:13px}
.empty{color:var(--mut);text-align:center;padding:70px 0}

/* ---------- tables (parts II–III) ---------- */
.doc{max-width:900px}
.doc h2{font-size:20px;margin:34px 0 4px;font-weight:640}
.doc h2:first-child{margin-top:0}
.doc p{color:var(--mut);margin:6px 0 14px;max-width:70ch}
table{border-collapse:collapse;width:100%;margin:8px 0 22px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top;font-size:13.5px}
th{background:var(--panel);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
tr:last-child td{border-bottom:0}
td b{font-weight:620}
td .cuts{flex-direction:row;margin-top:6px}
.rule td:first-child{color:var(--faint);font-size:12px;white-space:nowrap}

/* ---------- lightbox & preview ---------- */
#zoom{position:fixed;inset:0;background:rgba(14,16,19,.9);display:none;z-index:100;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:28px}
#zoom.on{display:flex}
#zoom img{max-width:min(96vw,1400px);max-height:74vh;background:#fff;padding:10px;border-radius:8px}
#zoom .cap{color:#e9e7e3;font-size:14px;text-align:center;max-width:70ch}
#zoom .cap b{font-size:18px;display:block;margin-bottom:3px}
#zoom .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.1);
  color:#fff;font-size:26px;width:46px;height:64px;border-radius:8px;cursor:pointer}
#zoom .nav.p{left:16px} #zoom .nav.n{right:16px}
#zoom .x{position:absolute;top:16px;right:18px;border:0;background:transparent;color:#c9c6c1;font-size:26px;cursor:pointer}
#pv{position:fixed;z-index:90;display:none;background:var(--card);border:1px solid var(--line2);
  border-radius:8px;padding:8px 10px;box-shadow:0 8px 26px rgba(0,0,0,.18);max-width:340px;pointer-events:none}
#pv.on{display:block}
#pv b{display:block;font-size:14px;margin-bottom:4px}
#pv img{display:block;height:56px;width:auto;max-width:310px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:2px;margin-bottom:4px}
#pv small{color:var(--mut);font:12px/1.4 ui-monospace,monospace}

.burger{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:var(--topw);left:0;width:280px;z-index:25;transform:translateX(-101%);
    transition:transform .18s ease;box-shadow:0 10px 40px rgba(0,0,0,.15)}
  body.nav .side{transform:none}
  .burger{display:block}
  main{padding:16px 14px 100px}
  .brand span{display:none}
  .tabs button{padding:5px 8px;font-size:12.5px}
}
@media print{.top,.side,#zoom,#pv{display:none}.shell{display:block}}

/* Corpus-aware dictionary and visual index */
[hidden]{display:none!important}
button,a,select,summary{touch-action:manipulation}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.top{height:auto;min-height:var(--topw);flex-wrap:wrap;padding:10px 18px;gap:10px}
.brand span{display:none}
main{max-width:1280px;width:100%;min-width:0}
h1{font-size:28px;line-height:1.2;letter-spacing:-.025em;margin:0 0 9px;font-weight:650}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:2px 0 10px}
.lead{color:var(--mut);max-width:74ch;margin:0 0 18px}
.overview{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.corpus-button{border:1px solid var(--line2);background:var(--card);padding:9px 13px;border-radius:8px;text-align:left;cursor:pointer}
.corpus-button.on{border-color:var(--acc);background:var(--acc-soft)}
.corpus-button small{display:block;color:var(--mut);font-size:11px}
.form-filters{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;margin:12px 0}
.facet-row{display:grid;grid-template-columns:165px minmax(0,1fr);align-items:start;gap:10px;padding:7px 0}
.facet-row h2{font-size:12px;font-weight:600;color:var(--mut);margin:6px 0}
.facet-options{display:flex;gap:6px;flex-wrap:wrap}
.form-choice{border:1px solid var(--line2);border-radius:6px;background:var(--card);padding:5px 9px;font-size:12px;line-height:1.5;cursor:pointer;text-align:left}
.form-choice span{color:var(--mut);font-size:11px;margin-left:5px}
.form-choice:hover{border-color:var(--acc)}
.form-choice.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.facet-description{font-size:12px;color:var(--mut);margin:7px 0;max-width:95ch}
.classification-note{font-size:12px;color:var(--mut);margin:10px 0 16px}
.classification-note summary{cursor:pointer}.classification-note p{max-width:90ch}
.section-nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.section-nav button,.reset{border:1px solid var(--line2);background:var(--card);border-radius:7px;padding:7px 11px;cursor:pointer;font-size:13px}
.section-nav button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.reset{margin-top:14px;width:100%;color:var(--mut)}
.extra-filters{margin-top:19px;font-size:13px}.extra-filters summary{cursor:pointer;color:var(--mut)}
.extra-filters h4{margin-top:12px!important}
.results-head{display:flex;align-items:center;gap:10px;margin:20px 0 12px;border-top:1px solid var(--line);padding-top:17px}
.results-head strong{font-size:16px}.results-head span{color:var(--mut);font-size:12px}
#active-filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
#active-filters button{cursor:pointer;border:1px solid var(--line2);background:var(--acc-soft);border-radius:20px;padding:3px 10px;font-size:12px}
.tag{display:inline-block;margin:6px 4px 0 0;font-size:11px;padding:2px 7px;border-radius:4px;background:var(--panel);color:var(--mut);border:0;cursor:pointer}
.card-link{font-size:12px;color:var(--mut);margin-left:auto;text-decoration:none;padding:2px 5px}
.notice{padding:13px 16px;background:var(--panel);border-left:3px solid var(--acc);margin:16px 0;color:var(--mut);font-size:13px}
.table-scroll{overflow-x:auto;max-width:100%;margin-bottom:16px}.table-scroll table{margin-bottom:0}
.lesson{padding-top:12px}.lesson p{max-width:80ch;color:var(--fg)}
.lesson img{max-width:100%;max-height:320px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;cursor:zoom-in}
.lesson td img{max-height:80px;max-width:170px;display:block;margin:6px 0}
.lesson h3{margin:28px 0 12px;font-size:18px}.lesson li{margin-bottom:8px}
#tutorial-nav a{display:block;text-decoration:none;color:var(--mut);padding:10px 9px;border-radius:6px;font-size:13px}
#tutorial-nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.tutorial-cover{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tutorial-cover a{display:block;padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none}
.tutorial-cover b{display:block;font-size:16px;margin-bottom:7px}.tutorial-cover span{font-size:13px;color:var(--mut)}
.doc{max-width:100%}.doc h2{scroll-margin-top:110px}
.empty{border:1px dashed var(--line2);border-radius:9px;padding:36px 22px;text-align:left}
.empty h2{margin:0 0 7px;font-size:19px}.empty p{margin:0;max-width:65ch}
@media(min-width:901px) and (max-width:1150px){.srch{flex-basis:230px}.top{gap:7px}.tabs button{font-size:12px;padding:6px 7px}}
@media(max-width:900px){:root{--topw:110px}.top{min-height:110px}.brand{flex:1}.tabs{order:4;width:100%;overflow:auto}.tabs button{flex:1}.srch{flex:0 1 240px}h1{font-size:25px}}
@media(max-width:540px){:root{--topw:144px}.top{min-height:144px;padding:8px 10px;gap:8px}.srch{order:3;flex-basis:100%}.grow{display:none}.tabs{order:4}.tabs button{font-size:11px;padding:6px 5px}.facet-row{grid-template-columns:1fr;gap:4px}.facet-row h2{margin:2px 0}.form-choice{padding:6px 9px}.card{grid-template-columns:minmax(65px,28%) minmax(0,1fr);padding:10px;gap:10px}.tutorial-cover{grid-template-columns:1fr}.w{font-size:16px}.chip{font-size:10px}.lesson td img{max-width:120px}main{padding:20px 12px 70px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

</style></head>
<body>
<div class="top">
  <button class="iconbtn burger" id="burger" aria-label="Открыть фильтры" aria-expanded="false">☰</button>
  <div class="brand">Зиглы Гуссерля<span>Рабочий словарь стенографии</span></div>
  <div class="tabs" id="tabs">
    <button data-m="abc" class="on">Словарь</button>
    <button data-m="forms">Графические формы</button>
    <button data-m="tutorial">Туториал</button>
    <button data-m="about">О словаре</button>
  </div>
  <div class="grow"></div>
  <div class="srch"><span class="ic">⌕</span><input id="q" aria-label="Поиск по карточкам" type="search" placeholder="Найти слово, каркас, описание…"><kbd>/</kbd></div>
  <button class="iconbtn" id="dense" title="компактный вид">≡</button>
  <button class="iconbtn" id="theme" title="тема">◐</button>
</div>

<div class="shell">
  <aside class="side" id="side">
    <div id="filters">
    <h4><label for="corpus">Конволют</label></h4>
    <select id="corpus"><option value="">Все конволюты</option></select>
    <h4><label for="sheet">Лист конволюта</label></h4>
    <select id="sheet"><option value="">Все листы</option></select>
    <h4><label for="layer">Слой</label></h4>
    <select id="layer"><option value="">Оба слоя</option><option>Служебный слой</option><option>Идиолект</option></select>
    <h4><label for="type">Тип знака</label></h4><select id="type"><option value="">Все типы</option></select>
    <h4>Буква слова</h4><div class="abc" id="abc"></div>
    <h4>Вырезки</h4><button class="iconbtn" id="only" aria-pressed="false" style="width:100%">Только с вырезкой</button>
    <div class="sizes" id="sizes"><button data-s="s">S</button><button data-s="m" class="on">M</button><button data-s="l">L</button><button data-s="xl">XL</button></div>
    <button class="reset" id="reset">Сбросить фильтры</button>
    <div class="note" id="stat" aria-live="polite"></div>
    </div>
    <nav id="tutorial-nav" aria-label="Разделы туториала" hidden></nav>
  </aside>
  <main>
    <div id="intro"></div>
    <div id="active-filters" aria-live="polite"></div>
    <div id="list"></div>
    <div id="doc" class="doc" hidden></div>
  </main>
</div>

<div id="zoom" role="dialog" aria-modal="true" aria-label="Просмотр вырезки"><button class="x" aria-label="Закрыть">✕</button><button class="nav p" aria-label="Предыдущая вырезка">‹</button>
  <img alt="Увеличенная вырезка"><div class="cap"></div><button class="nav n" aria-label="Следующая вырезка">›</button></div>

0440\u0430 \u2014 \u00ab\u0441\u043f\u0438\u0440\u0438\u0442\u0443\u043e\u0437\u043d\u044b\u0439, \u043e\u0436\u0438\u0432\u043b\u044f\u044e\u0449\u0438\u0439 \u043f\u0440\u0438\u043d\u0446\u0438\u043f\u00bb \u0440\u0435\u0447\u0438; \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0435 \u2014 \u0435\u0451 \u00ab\u0442\u0435\u043b\u043e\u00bb. \u041e\u0442\u0441\u044e\u0434\u0430 \u0434\u0432\u043e\u0439\u043d\u043e\u0439 \u0441\u043f\u043e\u0441\u043e\u0431 \u0437\u0430\u043f\u0438\u0441\u0438 \u0433\u043b\u0430\u0441\u043d\u043e\u0433\u043e:</p><ul><li><strong>\u044f\u0432\u043d\u044b\u0439 \u0437\u043d\u0430\u043a</strong> (ausdr\u00fcckliche Bezeichnung) \u2014 \u0441\u0442\u0430\u0432\u0438\u0442\u0441\u044f \u0432 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u043c \u0432 \u043d\u0430\u0447\u0430\u043b\u0435 \u0438 \u043a\u043e\u043d\u0446\u0435 \u0441\u043b\u043e\u0432\u0430;</li><li><strong>\u0441\u0438\u043c\u0432\u043e\u043b\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0438\u043d\u0434\u0438\u043a\u0430\u0446\u0438\u044f</strong> (symbolische Andeutung) \u2014 \u0432\u043d\u0443\u0442\u0440\u0438 \u0441\u043b\u043e\u0432\u0430 \u0433\u043b\u0430\u0441\u043d\u044b\u0439 \u00ab\u043e\u043a\u0440\u0430\u0448\u0438\u0432\u0430\u0435\u0442\u00bb \u0441\u043e\u0441\u0435\u0434\u043d\u0438\u0439 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0439, \u043a\u0430\u043a \u00abFarbenlicht\u00bb (\u0446\u0432\u0435\u0442\u043d\u043e\u0439 \u0441\u0432\u0435\u0442): \u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u043d\u0430\u0436\u0438\u043c, \u0432\u044b\u0441\u043e\u0442\u0430 \u0438\u043b\u0438 \u0444\u043e\u0440\u043c\u0430 \u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u044f, \u043d\u043e \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0437\u043d\u0430\u043a\u0430 \u043d\u0435\u0442. \u042d\u0442\u043e \u0438 \u0435\u0441\u0442\u044c <strong>Vokalsymbolik \u2014 \u0441\u0435\u0440\u0434\u0446\u0435 \u0441\u0438\u0441\u0442\u0435\u043c\u044b \u0438 \u0433\u043b\u0430\u0432\u043d\u044b\u0439 \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a \u043d\u0435\u043e\u0434\u043d\u043e\u0437\u043d\u0430\u0447\u043d\u043e\u0441\u0442\u0438 \u043f\u0440\u0438 \u0440\u0430\u0441\u0448\u0438\u0444\u0440\u043e\u0432\u043a\u0435</strong>.</li></ul><p>\u041f\u044f\u0442\u044c \u043f\u0440\u043e\u0441\u0442\u044b\u0445 \u0433\u043b\u0430\u0441\u043d\u044b\u0445 \u0432\u044b\u0432\u043e\u0434\u044f\u0442\u0441\u044f \u0438\u0437 \u0430\u0440\u0442\u0438\u043a\u0443\u043b\u044f\u0446\u0438\u0438 (\u0438\u0437\u043b\u043e\u0436\u0435\u043d\u0438\u0435 G1850 \u00a72 \u0434\u043e\u0441\u043b\u043e\u0432\u043d\u043e \u043f\u043e \u043b\u043e\u0433\u0438\u043a\u0435, \u0441\u0436\u0430\u0442\u043e):</p><div class=\"table-scroll\"><table><tr><th>\u0413\u043b\u0430\u0441\u043d\u044b\u0439</th><th>\u0418\u0437 \u0443\u0447\u0435\u0431\u043d\u0438\u043a\u0430 (\u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 1)</th><th>\u042f\u0432\u043d\u044b\u0439 \u0437\u043d\u0430\u043a</th><th>\u041b\u043e\u0433\u0438\u043a\u0430 \u0444\u043e\u0440\u043c\u044b</th><th>\u0421\u0438\u043c\u0432\u043e\u043b\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043f\u0440\u0438\u0437\u043d\u0430\u043a (\u0432\u043d\u0443\u0442\u0440\u0438 \u0441\u043b\u043e\u0432\u0430)</th></tr><tr><td><strong>a</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/vok_a.png\" alt=\"a\" tabindex=\"0\" role=\"button\"></td><td>\u0442\u043e\u0447\u043a\u0430 \u2192 \u00ab\u0432\u043b\u0438\u0442\u0430\u044f \u043f\u0435\u0442\u0435\u043b\u044c\u043a\u0430\u00bb (eingeflossene Punktschlinge, \u043a\u0430\u043a \u043f\u0435\u0442\u043b\u044f \u043a\u0443\u0440\u0440\u0435\u043d\u0442\u043d\u043e\u0433\u043e <em>r</em>); \u2116 1 \u2014 \u0442\u043e\u0447\u043a\u0430, \u2116 2 \u2014 \u043f\u0435\u0442\u0435\u043b\u044c\u043a\u0430</td><td>\u0442\u043e\u0447\u043a\u0430 = \u043d\u0430\u0447\u0430\u043b\u043e \u0432\u0441\u044f\u043a\u043e\u0433\u043e \u043f\u0438\u0441\u044c\u043c\u0430; a = \u043f\u0435\u0440\u0432\u044b\u0439, \u043f\u0440\u043e\u0441\u0442\u0435\u0439\u0448\u0438\u0439 \u0437\u0432\u0443\u043a</td><td><strong>Kraft in der Mitte</strong>: \u0443\u0441\u0438\u043b\u0435\u043d\u0438\u0435 \u043d\u0430\u0436\u0438\u043c\u0430 \u0432 \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0435 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u043e\u0433\u043e</td></tr><tr><td><strong>e</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/vok_e.png\" alt=\"e\" tabindex=\"0\" role=\"button\"></td><td>\u043f\u043b\u043e\u0441\u043a\u0438\u0439 \u0432\u043e\u043b\u043e\u0441\u044f\u043d\u043e\u0439 \u0448\u0442\u0440\u0438\u0445 (= \u043e\u0431\u044b\u0447\u043d\u044b\u0439 \u0441\u043e\u0435\u0434\u0438\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0439 \u0448\u0442\u0440\u0438\u0445 \u043a\u0443\u0440\u0440\u0435\u043d\u0442\u0430)</td><td>\u0440\u043e\u0442 \u043f\u0440\u0438 e \u0443\u043f\u043b\u043e\u0449\u0430\u0435\u0442\u0441\u044f \u043f\u043e \u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u0438</td><td><strong>\u043d\u0438\u043a\u0430\u043a\u043e\u0433\u043e</strong>: \u0437\u043d\u0430\u043a\u0438 \u00ab\u043f\u0430\u0440\u044f\u0442 \u0432 \u0440\u0430\u0432\u043d\u043e\u0432\u0435\u0441\u0438\u0438\u00bb (Schweben im Ebenmaass). e \u2014 \u0432\u0435\u0437\u0434\u0435\u0441\u0443\u0449\u0438\u0439 \u0433\u043b\u0430\u0441\u043d\u044b\u0439 \u043d\u0435\u043c\u0435\u0446\u043a\u043e\u0433\u043e, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u00ab\u043f\u0443\u0441\u0442\u043e\u0435\u00bb \u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0435 \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u043a\u0430\u043a e</td></tr><tr><td><strong>i</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/vok_i.png\" alt=\"i\" tabindex=\"0\" role=\"button\"></td><td>\u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u0430\u044f \u0447\u0451\u0440\u0442\u043e\u0447\u043a\u0430 \u0441 \u0437\u0430\u0445\u043e\u0434\u043e\u043c \u0438 \u0432\u044b\u0445\u043e\u0434\u043e\u043c = \u043a\u0443\u0440\u0440\u0435\u043d\u0442\u043d\u043e\u0435 <em>i</em> \u0431\u0435\u0437 \u0442\u043e\u0447\u043a\u0438</td><td>i \u2014 \u0432\u044b\u0441\u043e\u043a\u0438\u0439, \u043e\u0441\u0442\u0440\u044b\u0439 \u0442\u043e\u043d \u2192 \u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c</td><td><strong>H\u00f6he und Sch\u00e4rfe</strong>: \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0439 \u043f\u0438\u0448\u0435\u0442\u0441\u044f \u0432\u044b\u0448\u0435 \u0438 \u00ab\u043e\u0441\u0442\u0440\u0435\u0435\u00bb \u0441\u043e\u0441\u0435\u0434\u0435\u0439</td></tr><tr><td><strong>o</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/vok_o.png\" alt=\"o\" tabindex=\"0\" role=\"button\"></td><td>\u0432\u044b\u0433\u043d\u0443\u0442\u0430\u044f (\u043e\u043a\u0440\u0443\u0433\u043b\u0451\u043d\u043d\u0430\u044f) \u043b\u0438\u043d\u0438\u044f \u0432\u043e\u043b\u043e\u0441\u044f\u043d\u043e\u0433\u043e \u0448\u0442\u0440\u0438\u0445\u0430: \u2116 5 \u2014 \u0434\u0443\u0433\u043e\u0439 \u0432\u043d\u0438\u0437, \u2116 6 \u2014 \u0441\u0432\u043e\u0434\u043e\u043c \u0432\u0432\u0435\u0440\u0445</td><td>\u0440\u043e\u0442 \u043e\u043a\u0440\u0443\u0433\u043b\u044f\u0435\u0442\u0441\u044f</td><td><strong>hohle Rundung</strong>: \u043e\u043a\u0440\u0443\u0433\u043b\u0435\u043d\u0438\u0435, \u043f\u0440\u0438\u0434\u0430\u043d\u043d\u043e\u0435 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u043e\u043c\u0443, \u00ab\u0432\u0447\u0438\u0442\u044b\u0432\u0430\u0435\u0442\u00bb \u0432 \u043d\u0435\u0433\u043e o</td></tr><tr><td><strong>u</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/vok_u.png\" alt=\"u\" tabindex=\"0\" role=\"button\"></td><td>\u0437\u0430\u0433\u043d\u0443\u0442\u0430\u044f \u0432\u043d\u0438\u0437 \u043b\u0438\u043d\u0438\u044f, \u00ab\u043a\u0430\u043a \u043f\u0435\u0440\u0432\u0430\u044f \u0447\u0430\u0441\u0442\u044c \u0437\u043d\u0430\u0447\u043a\u0430 \u00a7\u00bb</td><td>u \u2014 \u0433\u043b\u0443\u0431\u043e\u043a\u0438\u0439 \u0442\u043e\u043d, \u0433\u0443\u0431\u044b \u0432\u044b\u0442\u044f\u043d\u0443\u0442\u044b</td><td><strong>Tiefe und Sch\u00e4rfe</strong>: \u0437\u043d\u0430\u043a \u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442\u0441\u044f \u043d\u0438\u0436\u0435 \u0441\u0442\u0440\u043e\u043a\u0438</td></tr></table></div><p>\u0414\u0438\u0444\u0442\u043e\u043d\u0433\u0438 \u0438 \u0443\u043c\u043b\u0430\u0443\u0442\u044b \u2014 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u0434\u043d\u044b\u0435 \u043e\u0442 \u044d\u0442\u0438\u0445 \u043f\u044f\u0442\u0438 (\u0442\u0430\u043c \u0436\u0435, \u043a\u043d. \u0441\u0442\u0440. 6\u20137 = PDF 35\u201336):</p><div class=\"table-scroll\"><table><tr><th>\u0417\u0432\u0443\u043a</th><th>\u0418\u0437 \u0443\u0447\u0435\u0431\u043d\u0438\u043a\u0430</th><th>\u041f\u043e\u0441\u0442\u0440\u043e\u0435\u043d\u0438\u0435 \u0437\u043d\u0430\u043a\u0430</th><th>\u0421\u0438\u043c\u0432\u043e\u043b\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043f\u0440\u0438\u0437\u043d\u0430\u043a</th></tr><tr><td><strong>au</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/vok_au.png\" alt=\"au\" tabindex=\"0\" role=\"button\"></td><td>\u0437\u043d\u0430\u043a u + \u0432\u0434\u0430\u0432\u043b\u0435\u043d\u043d\u043e\u0435 a \u043d\u0430 \u0432\u044b\u0445\u043e\u0434\u0435</td><td><strong>Kraft in der Tiefe</strong> (\u043d\u0430\u0436\u0438\u043c + \u043e\u043f\u0443\u0441\u043a\u0430\u043d\u0438\u0435); \u0447\u0430\u0441\u0442\u043e \u0437\u0430\u043c\u0435\u043d\u0438\u043c \u043f\u0440\u0438\u0437\u043d\u0430\u043a\u043e\u043c \u043f\u0440\u043e\u0441\u0442\u043e\u0433\u043e u</td></tr><tr><td><strong>\u00e4 (ae)</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/vok_ae.png\" alt=\"ae\" tabindex=\"0\" role=\"button\"></td><td>\u043f\u0435\u0442\u0435\u043b\u044c\u043a\u0430 a + \u043e\u0442\u0442\u044f\u043d\u0443\u0442\u044b\u0439 \u0432\u043e\u043b\u043e\u0441\u044f\u043d\u043e\u0439 \u0448\u0442\u0440\u0438\u0445 e</td><td>St\u00e4rke + Verflachung; \u043f\u043e\u0447\u0442\u0438 \u0432\u0441\u0435\u0433\u0434\u0430 \u043c\u043e\u0436\u0435\u0442 \u0437\u0430\u043c\u0435\u0449\u0430\u0442\u044c\u0441\u044f \u043f\u0440\u043e\u0441\u0442\u044b\u043c e</td></tr><tr><td><strong>ei</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/vok_ei.png\" alt=\"ei\" tabindex=\"0\" role=\"button\"> \u0432\u0430\u0440\u0438\u0430\u043d\u0442: <img loading=\"lazy\" src=\"tutorial_img/vok_ei_var.png\" alt=\"ei \u0432\u0430\u0440\u0438\u0430\u043d\u0442\" tabindex=\"0\" role=\"button\"></td><td>\u0448\u0442\u0440\u0438\u0445 e, \u0443\u0434\u043b\u0438\u043d\u0451\u043d\u043d\u044b\u0439 \u043a\u043e\u0441\u043e \u0432\u0432\u0435\u0440\u0445 (+ \u043d\u0435\u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0435 i); \u2116 11 \u2014 \u0431\u0435\u0433\u043b\u044b\u0439 \u0432\u0430\u0440\u0438\u0430\u043d\u0442 \u0431\u0435\u0437 i</td><td><strong>\u043a\u043e\u0441\u043e \u0432\u043e\u0441\u0445\u043e\u0434\u044f\u0449\u0430\u044f \u043b\u0438\u043d\u0438\u044f \u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u044f</strong> \u2014 \u0441\u0430\u043c\u0430 \u043f\u043e \u0441\u0435\u0431\u0435 \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u043a\u0430\u043a ei</td></tr><tr><td><strong>ie</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/vok_ie.png\" alt=\"ie\" tabindex=\"0\" role=\"button\"></td><td>i \u0441 \u0432\u044b\u0445\u043e\u0434\u043d\u044b\u043c \u0448\u0442\u0440\u0438\u0445\u043e\u043c, \u0443\u0434\u043b\u0438\u043d\u0451\u043d\u043d\u044b\u043c \u0432 e</td><td>\u043e\u0431\u044b\u0447\u043d\u043e \u0437\u0430\u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u043f\u0440\u043e\u0441\u0442\u044b\u043c i (di = die, ni = nie, wi = wie)</td></tr><tr><td><strong>\u00f6 (oe)</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/vok_oe.png\" alt=\"oe\" tabindex=\"0\" role=\"button\"></td><td>\u0443\u043f\u043b\u043e\u0449\u0451\u043d\u043d\u043e\u0435, \u0448\u0438\u0440\u0435 \u0432\u044b\u0433\u043d\u0443\u0442\u043e\u0435 o</td><td>verflachte Rundung (\u0443\u043f\u043b\u043e\u0449\u0451\u043d\u043d\u043e\u0435 \u043e\u043a\u0440\u0443\u0433\u043b\u0435\u043d\u0438\u0435)</td></tr><tr><td><strong>\u00fc (ue)</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/vok_ue.png\" alt=\"ue\" tabindex=\"0\" role=\"button\"></td><td>\u0437\u043d\u0430\u043a u, \u043f\u0435\u0440\u0435\u0441\u0435\u0447\u0451\u043d\u043d\u044b\u0439 \u0432\u043e\u0441\u0445\u043e\u0434\u044f\u0449\u0438\u043c \u0448\u0442\u0440\u0438\u0445\u043e\u043c</td><td><strong>Durchkreuzung</strong>: \u043f\u0435\u0440\u0435\u043a\u0440\u0435\u0449\u0438\u0432\u0430\u043d\u0438\u0435 \u0434\u0432\u0443\u0445 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0445 \u0432\u043e\u043a\u0440\u0443\u0433 \u00fc \u2014 \u043e\u0431\u0449\u0438\u0439 \u0441\u0438\u043c\u0432\u043e\u043b \u044d\u0442\u043e\u0433\u043e \u0443\u043c\u043b\u0430\u0443\u0442\u0430; \u0438\u043d\u043e\u0433\u0434\u0430 \u0437\u0430\u043c\u0435\u0449\u0430\u0435\u0442\u0441\u044f \u043f\u0440\u0438\u0437\u043d\u0430\u043a\u043e\u043c i</td></tr><tr><td><strong>\u00e4u</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/vok_aeu.png\" alt=\"aeu\" tabindex=\"0\" role=\"button\"></td><td>\u0437\u043d\u0430\u043a au + \u043e\u0442\u0442\u044f\u043d\u0443\u0442\u044b\u0439 \u0432\u044b\u0445\u043e\u0434\u043d\u043e\u0439 \u0448\u0442\u0440\u0438\u0445</td><td>Kraft in der Tiefe + \u043a\u043e\u0441\u043e\u0435 \u0432\u043e\u0441\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u0435</td></tr><tr><td><strong>eu</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/vok_eu.png\" alt=\"eu\" tabindex=\"0\" role=\"button\"></td><td>\u00ab\u0443\u0433\u043b\u0443\u0431\u043b\u0451\u043d\u043d\u044b\u0439 \u0432\u0430\u0440\u0438\u0430\u043d\u0442 ei\u00bb (u \u0432\u043c\u0435\u0441\u0442\u043e i)</td><td>\u0447\u0430\u0441\u0442\u043e \u043f\u0438\u0448\u0435\u0442\u0441\u044f \u043a\u0430\u043a \u043f\u0440\u043e\u0441\u0442\u043e\u0435 ei</td></tr></table></div><p><strong>\u0421\u0438\u043c\u0432\u043e\u043b\u0438\u0437\u0430\u0446\u0438\u044f \u0432 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0438: \u043c\u0438\u043d\u0438\u043c\u0430\u043b\u044c\u043d\u0430\u044f \u0441\u0435\u0440\u0438\u044f \u043d\u0430 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u043e\u043c d</strong> (\u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 4 = MDZ 00180, \u00abzu \u00a716. Regel 2\u00bb; \u043f\u0435\u0447\u0430\u0442\u043d\u044b\u0439 \u0442\u0435\u043a\u0441\u0442: \u043a\u043d. \u0441\u0442\u0440. 28\u201329 = PDF 57\u201358). \u041e\u0434\u0438\u043d \u0438 \u0442\u043e\u0442 \u0436\u0435 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0439 + \u043f\u044f\u0442\u044c \u0433\u043b\u0430\u0441\u043d\u044b\u0445 \u0432\u043d\u0443\u0442\u0440\u0438; \u0432\u043e \u0432\u0441\u0435\u0445 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430\u0445 \u043f\u0435\u0440\u0432\u044b\u0439 \u0437\u043d\u0430\u043a \u2014 \u0441\u043b\u043e\u0433 \u0441 m, \u0432\u0442\u043e\u0440\u043e\u0439 \u2014 \u0441 d:</p><div class=\"table-scroll\"><table><tr><th>\u0427\u0438\u0442\u0430\u0435\u0442\u0441\u044f</th><th>\u0418\u0437 \u0443\u0447\u0435\u0431\u043d\u0438\u043a\u0430</th><th>\u041c\u0435\u0445\u0430\u043d\u0438\u0437\u043c</th></tr><tr><td>em/me, <strong>de</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/paar_e.png\" alt=\"de\" tabindex=\"0\" role=\"button\"></td><td>\u0437\u043d\u0430\u043a \u0431\u0435\u0437 \u0432\u0441\u044f\u043a\u043e\u0439 \u043c\u043e\u0434\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438 \u2192 \u0433\u043b\u0430\u0441\u043d\u044b\u0439 e</td></tr><tr><td>am/ma, <strong>da</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/paar_a.png\" alt=\"da\" tabindex=\"0\" role=\"button\"></td><td><strong>\u043d\u0430\u0436\u0438\u043c \u0432 \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0435 \u0444\u0438\u0433\u0443\u0440\u044b</strong> \u2192 a</td></tr><tr><td>im/mi, <strong>die</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/paar_i.png\" alt=\"die\" tabindex=\"0\" role=\"button\"></td><td>\u0437\u043d\u0430\u043a \u043d\u0430 \u2153 \u0432\u044b\u0448\u0435 \u0441\u0442\u0440\u043e\u043a\u0438, \u043e\u0441\u0442\u0440\u044b\u0439 \u0448\u0442\u0440\u0438\u0445 (\u0443 die \u2014 \u0435\u0449\u0451 \u0432\u044b\u0445\u043e\u0434 d \u0432 i) \u2192 i</td></tr><tr><td>om/mo, od, <strong>do</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/paar_o.png\" alt=\"do\" tabindex=\"0\" role=\"button\"></td><td>\u0437\u0430\u043c\u0435\u0442\u043d\u043e\u0435 \u043e\u043a\u0440\u0443\u0433\u043b\u0435\u043d\u0438\u0435 \u0432 \u043d\u0430\u0447\u0430\u043b\u0435 \u0438\u043b\u0438 \u043d\u0430 \u0432\u044b\u0445\u043e\u0434\u0435 \u2192 o</td></tr><tr><td>um/mu, <strong>du</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/paar_u.png\" alt=\"du\" tabindex=\"0\" role=\"button\"></td><td>\u0437\u043d\u0430\u043a \u0443\u0442\u043e\u043f\u043b\u0435\u043d \u043d\u0438\u0436\u0435 \u0441\u0442\u0440\u043e\u043a\u0438 \u2192 u</td></tr></table></div><p>\u0422\u0440\u0438 \u043f\u0440\u0430\u0432\u0438\u043b\u0430, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u0434\u0430\u044e\u0442 ~80 % \u043f\u043e\u043d\u0438\u043c\u0430\u043d\u0438\u044f \u0432\u043e\u043a\u0430\u043b\u0438\u0437\u043c\u0430 \u043f\u0440\u0438 \u0447\u0442\u0435\u043d\u0438\u0438:</p><ul><li><strong>\u041f\u0440\u0430\u0432\u0438\u043b\u043e \u0432\u0435\u0437\u0434\u0435\u0441\u0443\u0449\u0435\u0433\u043e e:</strong> \u0432 \u0434\u0435\u0432\u044f\u0442\u0438 \u0441\u043b\u0443\u0447\u0430\u044f\u0445 \u0438\u0437 \u0434\u0435\u0441\u044f\u0442\u0438 \u0433\u043b\u0430\u0441\u043d\u044b\u0439 \u0432\u043d\u0443\u0442\u0440\u0438 \u0441\u043b\u043e\u0432\u0430 \u0432\u043e\u043e\u0431\u0449\u0435 \u043d\u0435 \u043e\u0431\u043e\u0437\u043d\u0430\u0447\u0435\u043d; \u0433\u043e\u043b\u043e\u0435 \u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0435 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0445 \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u0441\u043f\u0435\u0440\u0432\u0430 \u0441 e, \u043f\u043e\u0442\u043e\u043c \u0441\u043b\u0443\u0445 \u043a\u043e\u0440\u0440\u0435\u043a\u0442\u0438\u0440\u0443\u0435\u0442 (\u00aber est hete Mergens ze spet efgestenden\u00bb \u2014 \u0437\u043d\u0430\u043c\u0435\u043d\u0438\u0442\u044b\u0439 \u043f\u0440\u0438\u043c\u0435\u0440 \u0438\u0437 \u00a72: \u043d\u0435\u043c\u0435\u0446\u043a\u043e\u0435 \u0443\u0445\u043e \u0432\u043e\u0441\u0441\u0442\u0430\u043d\u0430\u0432\u043b\u0438\u0432\u0430\u0435\u0442 \u00aber ist heute Morgens zu sp\u00e4t aufgestanden\u00bb).</li><li><strong>\u0412\u0437\u0430\u0438\u043c\u043e\u0437\u0430\u043c\u0435\u043d\u044f\u0435\u043c\u043e\u0441\u0442\u044c:</strong> \u00e4\u2192e, ie\u2192i, eu\u2192ei, au\u2192u \u2014 \u0443\u0447\u0435\u0431\u043d\u0438\u043a \u0441\u0430\u043c \u0440\u0430\u0437\u0440\u0435\u0448\u0430\u0435\u0442 \u043f\u0438\u0441\u0430\u0442\u044c \u0443\u043f\u0440\u043e\u0449\u0451\u043d\u043d\u043e; \u0413\u0443\u0441\u0441\u0435\u0440\u043b\u044c \u044d\u0442\u0438\u043c \u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u043f\u043e\u0441\u0442\u043e\u044f\u043d\u043d\u043e.</li><li><strong>\u0427\u0438\u0442\u0430\u044f \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0439, \u0441\u043b\u0435\u0434\u0438 \u0437\u0430 \u0442\u0440\u0435\u043c\u044f \u043f\u0430\u0440\u0430\u043c\u0435\u0442\u0440\u0430\u043c\u0438</strong> (\u043d\u0430\u0436\u0438\u043c / \u0432\u044b\u0441\u043e\u0442\u0430 / \u043e\u043a\u0440\u0443\u0433\u043b\u0435\u043d\u0438\u0435-\u043f\u0435\u0440\u0435\u043a\u0440\u0435\u0449\u0438\u0432\u0430\u043d\u0438\u0435): \u0436\u0438\u0440\u043d\u044b\u0439 = a(+au), \u0432\u044b\u0441\u043e\u043a\u0438\u0439 = i(+\u00fc), \u043d\u0438\u0437\u043a\u0438\u0439 = u, \u043e\u043a\u0440\u0443\u0433\u043b\u044b\u0439 = o. \u041f\u0443\u0441\u0442\u043e\u0435 \u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0435 = e.</li></ul><h3>2.2. \u0421\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0435: \u0442\u0440\u0438 \u043a\u043b\u0430\u0441\u0441\u0430</h3><p>\u041f\u0440\u0438\u043d\u0446\u0438\u043f \u043a\u043b\u0430\u0441\u0441\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438 (\u00a73, \u043a\u043d. \u0441\u0442\u0440. 7\u20138 = PDF 36\u201337): \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0435 \u2014 \u00ab\u0442\u0435\u043b\u0435\u0441\u043d\u0430\u044f\u00bb, \u043e\u0431\u044a\u0435\u043a\u0442\u0438\u0432\u043d\u0430\u044f \u0447\u0430\u0441\u0442\u044c \u0440\u0435\u0447\u0438 (\u0433\u043b\u0430\u0441\u043d\u044b\u0435 \u2014 \u00ab\u0441\u043f\u0438\u0440\u0438\u0442\u0443\u043e\u0437\u043d\u0430\u044f\u00bb, \u0441\u0443\u0431\u044a\u0435\u043a\u0442\u0438\u0432\u043d\u0430\u044f); \u0438\u043c\u0435\u043d\u043d\u043e \u043d\u0430 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0445 \u043b\u0435\u0436\u0438\u0442 \u0432\u0441\u044f \u043c\u0430\u0441\u0441\u0430 \u043f\u0438\u0441\u044c\u043c\u0435\u043d\u043d\u043e\u0433\u043e \u043e\u0431\u043e\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u044f. \u0422\u0440\u0438 \u043a\u043b\u0430\u0441\u0441\u0430 \u2014 \u043f\u043e \u0442\u0440\u0451\u043c \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u044f\u043c \u0432\u044b\u0434\u044b\u0445\u0430\u0435\u043c\u043e\u0433\u043e \u0432\u043e\u0437\u0434\u0443\u0445\u0430: <strong>I. Hauch</strong> (\u0434\u044b\u0445\u0430\u043d\u0438\u0435), <strong>II. Wind/Blaser</strong> (\u0434\u0443\u043d\u043e\u0432\u0435\u043d\u0438\u0435), <strong>III. Sauser/Zischer</strong> (\u0448\u0438\u043f\u0435\u043d\u0438\u0435). \u0418\u043c \u043e\u0442\u0432\u0435\u0447\u0430\u044e\u0442 \u0442\u0440\u0438 \u0433\u043b\u0430\u0432\u043d\u044b\u0445 \u0434\u0432\u0438\u0436\u0435\u043d\u0438\u044f \u043f\u0435\u0440\u0430: \u0432\u044
