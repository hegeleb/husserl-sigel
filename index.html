ividuell = ndwdll \u043d\u0430 3a \u0438 \u043d\u0430 10a; denkbar = dnk+bar \u043d\u0430 10a \u0438 \u043d\u0430 49b. \u0412\u043e\u0441\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u0435 \u2014 \u0438\u0437 \u0444\u0438\u043b\u043e\u0441\u043e\u0444\u0441\u043a\u043e\u0433\u043e \u043b\u0435\u043a\u0441\u0438\u043a\u043e\u043d\u0430, \u0430 \u043d\u0435 \u0438\u0437 \u0433\u0440\u0430\u0444\u0438\u043a\u0438."], ["A. \u041a\u0430\u043a \u0443\u0441\u0442\u0440\u043e\u0435\u043d\u043e \u0441\u043b\u043e\u0432\u043e", "\u041a\u0430\u0440\u043a\u0430\u0441 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0445", "\u0428\u043a\u043e\u043b\u044c\u043d\u0430\u044f \u0441\u0438\u043c\u0432\u043e\u043b\u0438\u0437\u0430\u0446\u0438\u044f \u0433\u043b\u0430\u0441\u043d\u044b\u0445 (\u043d\u0430\u0436\u0438\u043c, \u0432\u044b\u0441\u043e\u0442\u0430) \u0443 \u0413\u0443\u0441\u0441\u0435\u0440\u043b\u044f \u0447\u0430\u0449\u0435 \u0437\u0430\u043c\u0435\u043d\u0435\u043d\u0430 \u043f\u0440\u043e\u0441\u0442\u044b\u043c \u043f\u0440\u043e\u043f\u0443\u0441\u043a\u043e\u043c; r \u0432\u044b\u043f\u0430\u0434\u0430\u0435\u0442 \u0440\u0435\u0433\u0443\u043b\u044f\u0440\u043d\u043e (griechisch = giechsch, nat\u00fcrlichen = nat\u00fclchn) \u2014 \u043b\u0438\u0431\u043e r-Lage, \u043b\u0438\u0431\u043e \u043e\u0442\u0431\u0440\u043e\u0441."], ["A. \u041a\u0430\u043a \u0443\u0441\u0442\u0440\u043e\u0435\u043d\u043e \u0441\u043b\u043e\u0432\u043e", "\u0421\u0440\u0435\u0437\u0430\u043d\u043d\u044b\u0439 \u0430\u043d\u043b\u0430\u0443\u0442", "\u041d\u0430\u0447\u0430\u043b\u043e \u0441\u043b\u043e\u0432\u0430 \u043e\u0442\u043f\u0430\u0434\u0430\u0435\u0442 \u0432\u0441\u044e\u0434\u0443, \u0433\u0434\u0435 \u043a\u043e\u0440\u0435\u043d\u044c \u043e\u043f\u043e\u0437\u043d\u0430\u0451\u0442\u0441\u044f: muss = ss, m\u00fcssen = ssn, M\u00f6glichkeiten = \u00f6ltn, individuell = ndwdll, unterscheiden = ntrschdn, enth\u00fcllen = nhlln, elterliche = ltrl, andere = ndr, Anlass = nlss. \u041f\u0440\u0430\u0432\u0438\u043b\u043e \u0447\u0442\u0435\u043d\u0438\u044f: \u0435\u0441\u043b\u0438 \u0440\u0430\u043c\u043a\u0430 \u043d\u0430\u0447\u0438\u043d\u0430\u0435\u0442\u0441\u044f \u00ab\u043d\u0435 \u0441 \u0442\u043e\u0439\u00bb \u0431\u0443\u043a\u0432\u044b \u2014 \u043f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c, \u043d\u0435 \u0441\u0440\u0435\u0437\u0430\u043d \u043b\u0438 \u0430\u043d\u043b\u0430\u0443\u0442."], ["A. \u041a\u0430\u043a \u0443\u0441\u0442\u0440\u043e\u0435\u043d\u043e \u0441\u043b\u043e\u0432\u043e", "\u0410\u0444\u0444\u0438\u043a\u0441 \u2014 \u0441\u0430\u043c\u043e\u0441\u0442\u043e\u044f\u0442\u0435\u043b\u044c\u043d\u044b\u0439 \u0437\u043d\u0430\u043a, \u0432\u043f\u043b\u043e\u0442\u044c \u0434\u043e \u0437\u0430\u043c\u0435\u043d\u044b \u0441\u043b\u043e\u0432\u0430 \u0446\u0435\u043b\u0438\u043a\u043e\u043c", "\u0420\u0430\u0431\u043e\u0442\u0430\u044e\u0442 \u0448\u043a\u043e\u043b\u044c\u043d\u044b\u0435 Nachsylben (-ung, -ion, -bar, -lich, \u00a7\u00a736\u201337); bedarf = \u043e\u0434\u0438\u043d \u0437\u0438\u0433\u043b be-, zulassen = zu + lassen. \u041c\u043e\u0440\u0444\u043e\u043b\u043e\u0433\u0438\u044f \u0432\u0438\u0434\u043d\u0430 \u0432 \u043f\u0438\u0441\u044c\u043c\u0435 \u0442\u043e\u0447\u043d\u0435\u0435, \u0447\u0435\u043c \u0432 \u043f\u0435\u0447\u0430\u0442\u0438: ankn\u00fcpft = an+kn\u00fcpft (2 \u0437\u043d\u0430\u043a\u0430) \u043f\u0440\u043e\u0442\u0438\u0432 angekn\u00fcpft = an+ge+kn\u00fcpft (3 \u0437\u043d\u0430\u043a\u0430). \u0413\u0443\u0441\u0441\u0435\u0440\u043b\u044c \u043f\u0438\u0448\u0435\u0442 \u043d\u0435 \u0441\u043b\u043e\u0432\u0430, \u0430 \u043c\u043e\u0440\u0444\u0435\u043c\u043d\u044b\u0435 \u0441\u0431\u043e\u0440\u043a\u0438."], ["A. \u041a\u0430\u043a \u0443\u0441\u0442\u0440\u043e\u0435\u043d\u043e \u0441\u043b\u043e\u0432\u043e", "\u041a\u043e\u043c\u043f\u043e\u0437\u0438\u0442\u044b \u0438 \u0433\u043b\u0430\u0433\u043e\u043b\u044c\u043d\u044b\u0435 \u043f\u0440\u0438\u0441\u0442\u0430\u0432\u043a\u0438 \u0440\u0430\u0437\u044a\u044f\u0442\u044b", "Bewusstseins|entwicklung, Ab|l\u00f6sung, Dahin|lebendes; preis-zu-gebender (zu-\u0438\u043d\u0444\u0438\u043a\u0441 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u043c \u0437\u043d\u0430\u043a\u043e\u043c), an-ge-messen. \u0413\u0440\u0430\u043d\u0438\u0446\u044b \u0441\u043b\u043e\u0432 \u043d\u0435 \u0441\u043e\u0432\u043f\u0430\u0434\u0430\u044e\u0442 \u0441 \u0433\u0440\u0430\u043d\u0438\u0446\u0430\u043c\u0438 \u0437\u043d\u0430\u043a\u043e\u0432 \u0432 \u043e\u0431\u0435 \u0441\u0442\u043e\u0440\u043e\u043d\u044b."], ["A. \u041a\u0430\u043a \u0443\u0441\u0442\u0440\u043e\u0435\u043d\u043e \u0441\u043b\u043e\u0432\u043e", "\u041f\u0440\u0435\u0434\u043b\u043e\u0433 \u0441\u0440\u0430\u0441\u0442\u0430\u0435\u0442\u0441\u044f \u0441 \u0430\u0440\u0442\u0438\u043a\u043b\u0435\u043c", "in der (3a \u00d73, 49b), nach der (49b/10) \u2014 \u043e\u0434\u0438\u043d \u0437\u043d\u0430\u043a (\u0448\u043a\u043e\u043b\u044c\u043d\u044b\u0435 Satzk\u00fcrzungen \u00a739, \u043f\u0435\u0440\u0435\u043d\u0435\u0441\u0451\u043d\u043d\u044b\u0435 \u043d\u0430 \u043f\u0438\u0441\u044c\u043c\u043e \u0434\u043b\u044f \u0441\u0435\u0431\u044f)."], ["B. \u0421\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0439 \u0441\u043b\u043e\u0439", "\u0421\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0439 \u0441\u043b\u043e\u0439 = \u0442\u0430\u0431\u043b\u0438\u0446\u0430 \u0437\u0438\u0433\u043b\u043e\u0432 G1850 \u0431\u0443\u043a\u0432\u0430 \u0432 \u0431\u0443\u043a\u0432\u0443", "\u0422\u043e\u043b\u044c\u043a\u043e \u0441\u0436\u0430\u0442\u0430\u044f \u0434\u043e \u043f\u0440\u0435\u0434\u0435\u043b\u0430 \u0438 \u043f\u043e\u0447\u0442\u0438 \u0431\u0435\u0437 \u043d\u0430\u0436\u0438\u043c\u0430. \u041e\u043f\u043e\u0437\u043d\u0430\u043d\u044b \u0431\u0435\u0437 \u0438\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0439: nun, be-, es, des, eine, er, nicht = t, und, ur, -ion, Quelle = qu, zu, lassen = l, an. \u041d\u0435\u043e\u043f\u043e\u0437\u043d\u0430\u043d\u043d\u044b\u0439 \u043c\u0435\u043b\u043a\u0438\u0439 \u0437\u043d\u0430\u043a \u0441\u043f\u0435\u0440\u0432\u0430 \u0438\u0441\u043a\u0430\u0442\u044c \u0432 \u0448\u043a\u043e\u043b\u044c\u043d\u043e\u0439 \u0442\u0430\u0431\u043b\u0438\u0446\u0435 (\u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 3 = MDZ 00179), \u0438 \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u043e\u0442\u043e\u043c \u0433\u0430\u0434\u0430\u0442\u044c \u043f\u043e \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442\u0443. \u041b\u0438\u0447\u043d\u043e\u0435 \u0443 \u0413\u0443\u0441\u0441\u0435\u0440\u043b\u044f \u2014 \u043d\u0435 \u0441\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0435 \u0441\u043b\u043e\u0432\u0430, \u0430 \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0435 \u0440\u0430\u043c\u043a\u0438."], ["B. \u0421\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0439 \u0441\u043b\u043e\u0439", "\u0421\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0439 \u0441\u043b\u043e\u0439 \u043d\u0435 \u0437\u0430\u0432\u0438\u0441\u0438\u0442 \u043e\u0442 \u044d\u043f\u043e\u0445\u0438 \u043f\u043e\u0447\u0435\u0440\u043a\u0430", "\u041d\u0430 49a/49b (~1915) von, und, des, eine, zu, sich, das, die, aber, es, an, durch \u043d\u0430\u0447\u0435\u0440\u0442\u0430\u043d\u044b \u043a\u0430\u043a \u043d\u0430 \u043b\u0438\u0441\u0442\u0430\u0445 1924 \u0433.; \u0440\u0430\u043d\u043d\u0438\u0439 \u043f\u043e\u0447\u0435\u0440\u043a \u043a\u0440\u0443\u043f\u043d\u0435\u0435 \u0438 \u043f\u0440\u043e\u0441\u0442\u043e\u0440\u043d\u0435\u0435 \u2014 \u044d\u0442\u043e \u043c\u0435\u0442\u0440\u0438\u043a\u0430, \u043d\u0435 \u0441\u0438\u0441\u0442\u0435\u043c\u0430."], ["B. \u0421\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0439 \u0441\u043b\u043e\u0439", "\u0413\u0440\u043e\u0437\u0434\u044c \u043e\u0434\u0438\u043d\u0430\u043a\u043e\u0432\u044b\u0445 \u0441\u0443\u0444\u0444\u0438\u043a\u0441\u043e\u0432 \u0434\u0435\u0440\u0436\u0438\u0442 \u0441\u0442\u0440\u043e\u043a\u0443", "\u0422\u0440\u0438 -ung \u043f\u043e\u0434\u0440\u044f\u0434 (Abl\u00f6sung, Verschmelzung, \u00dcbertragung) \u043d\u0430\u0447\u0435\u0440\u0442\u0430\u043d\u044b \u043e\u0434\u0438\u043d\u0430\u043a\u043e\u0432\u043e: \u0434\u0430\u0436\u0435 \u043f\u0440\u0438 \u043d\u0435\u0447\u0438\u0442\u0430\u0435\u043c\u043e\u043c \u043a\u043e\u0440\u043d\u0435 \u043f\u043e\u0432\u0442\u043e\u0440\u044f\u044e\u0449\u0430\u044f\u0441\u044f \u043f\u0435\u0442\u043b\u044f \u0434\u0430\u0451\u0442 \u0432\u0435\u0440\u043d\u0443\u044e \u0441\u0435\u0433\u043c\u0435\u043d\u0442\u0430\u0446\u0438\u044e \u0438 \u043f\u043e\u0434\u0441\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u0447\u0430\u0441\u0442\u044c \u0440\u0435\u0447\u0438."], ["B. \u0421\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0439 \u0441\u043b\u043e\u0439", "\u0422\u0435\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u044f\u043a\u043e\u0440\u044c \u0438\u0449\u0435\u0442\u0441\u044f \u043d\u0430 \u0430\u0431\u0437\u0430\u0446\u0435, \u0430 \u043d\u0435 \u043d\u0430 \u043b\u0438\u0441\u0442\u0435", "\u041d\u0430 49b \u0441\u0442\u043a. 1\u20135 \u0441\u0430\u043c\u044b\u0439 \u0447\u0430\u0441\u0442\u044b\u0439 \u0443\u0437\u0435\u043b \u2014 bwstn(s) (5\u00d7), \u0432 \u0441\u0442\u043a. 6\u20138 \u0435\u0433\u043e \u0441\u043c\u0435\u043d\u044f\u0435\u0442 ~ll = Leiber (5\u00d7). \u0410\u0431\u0437\u0430\u0446 \u043c\u0435\u043d\u044f\u0435\u0442 \u043f\u0440\u0435\u0434\u043c\u0435\u0442 \u2014 \u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0438 \u044f\u043a\u043e\u0440\u044c; \u043e\u043f\u043e\u0437\u043d\u0430\u0432\u0430\u0442\u044c \u0435\u0433\u043e \u043f\u0435\u0440\u0432\u044b\u043c."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u0421\u0442\u0435\u043d\u043e / \u043a\u0443\u0440\u0440\u0435\u043d\u0442 / \u043b\u0430\u0442\u0438\u043d\u0438\u0446\u0430; \u043a\u043e\u0434 \u0432\u044b\u0431\u0438\u0440\u0430\u0435\u0442\u0441\u044f \u043f\u043e \u0444\u0443\u043d\u043a\u0446\u0438\u0438 \u0441\u043b\u043e\u0432\u0430 \u0432\u043e \u0444\u0440\u0430\u0437\u0435, \u043d\u0435 \u043f\u043e \u044f\u0437\u044b\u043a\u0443", "Theologie \u0432 \u043f\u043e\u0442\u043e\u043a\u0435 \u2014 \u0441\u0442\u0435\u043d\u043e\u0433\u0440\u0430\u043c\u043c\u0430, \u043f\u043e\u0434 \u0440\u0430\u0437\u0440\u044f\u0434\u043a\u043e\u0439 \u2014 \u043a\u0443\u0440\u0440\u0435\u043d\u0442; \u043d\u0430 49b/14 au\u00dferkommunikativ \u043d\u0430\u043f\u0438\u0441\u0430\u043d\u043e \u043b\u0430\u0442\u0438\u043d\u0438\u0446\u0435\u0439 \u0438 \u043f\u043e\u0434\u0447\u0451\u0440\u043a\u043d\u0443\u0442\u043e, \u0430 Kommunikation \u0442\u0440\u0435\u043c\u044f \u0437\u043d\u0430\u043a\u0430\u043c\u0438 \u043f\u0440\u0430\u0432\u0435\u0435 \u2014 \u0441\u0442\u0435\u043d\u043e\u0433\u0440\u0430\u0444\u0438\u0435\u0439. \u041b\u0430\u0442\u0438\u043d\u0438\u0446\u0430 \u043f\u0440\u043e\u043d\u0438\u043a\u0430\u0435\u0442 \u0432\u043d\u0443\u0442\u0440\u044c \u043d\u0435\u043c\u0435\u0446\u043a\u043e\u0433\u043e \u0441\u043b\u043e\u0432\u0430: a-rationaler = \u00aba rat.\u00bb. \u0412\u0435\u0441\u044c \u0438\u043d\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043c\u0430\u0442\u0435\u0440\u0438\u0430\u043b \u0441\u043e\u0431\u0440\u0430\u043d \u043d\u0430 \u043b\u0438\u0441\u0442\u0435 \u00ab\u0418\u0434\u0438\u043e\u043b\u0435\u043a\u0442\u00bb \u043f\u043e\u0434 \u0442\u0438\u043f\u043e\u043c \u00ab\u0438\u043d\u043e\u0439 \u043a\u043e\u0434\u00bb."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u041b\u0430\u0442\u0438\u043d\u0441\u043a\u0438\u0435 \u0430\u0431\u0431\u0440\u0435\u0432\u0438\u0430\u0442\u0443\u0440\u044b \u043f\u0438\u0448\u0443\u0442\u0441\u044f \u0441 \u0442\u043e\u0447\u043a\u0430\u043c\u0438", "\u041a\u0430\u043a \u0432 \u043e\u0431\u044b\u0447\u043d\u043e\u043c \u043f\u0438\u0441\u044c\u043c\u0435: d.h., ev., apr., etc., d. i., a priori, eo ipso. \u041e\u0434\u0438\u043d \u0438 \u0442\u043e\u0442 \u0436\u0435 \u043e\u0431\u043e\u0440\u043e\u0442 \u0431\u044b\u0432\u0430\u0435\u0442 \u0437\u0430\u043f\u0438\u0441\u0430\u043d \u0434\u0432\u0443\u043c\u044f \u0441\u043f\u043e\u0441\u043e\u0431\u0430\u043c\u0438 \u043d\u0430 \u0441\u043e\u0441\u0435\u0434\u043d\u0438\u0445 \u043b\u0438\u0441\u0442\u0430\u0445 (apr. \u043d\u0430 49a \u2194 a priori \u043d\u0430 49b)."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u041a\u0440\u0443\u0433\u043b\u0430\u044f \u0441\u043a\u043e\u0431\u043a\u0430 = \u0432\u0441\u0442\u0430\u0432\u043d\u0430\u044f \u0440\u0435\u043f\u043b\u0438\u043a\u0430", "\u0418\u043d\u043e\u0433\u0434\u0430 \u044d\u0442\u043e \u043f\u0435\u0440\u0435\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435 \u0432 \u0447\u0443\u0436\u043e\u0439 \u044f\u0437\u044b\u043a ((faith) \u0430\u043d\u0433\u043b., (blo\u00df doxa) \u0433\u0440\u0435\u0447. \u2014 \u043b\u0430\u0442\u0438\u043d\u0438\u0446\u0435\u0439), \u043d\u043e \u043d\u0435 \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u043e: (Animalien) \u043d\u0430 49b \u2014 \u0442\u0435\u0440\u043c\u0438\u043d\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0435 \u0443\u0442\u043e\u0447\u043d\u0435\u043d\u0438\u0435 \u043f\u043e-\u043d\u0435\u043c\u0435\u0446\u043a\u0438."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u041a\u0430\u0432\u044b\u0447\u043a\u0438 \u201e\u2026\u201c = \u0442\u0435\u0440\u043c-\u0446\u0438\u0442\u0430\u0442\u0430, \u0434\u0438\u0441\u0442\u0430\u043d\u0446\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435", "\u201eSeligkeit\u201c, \u201etheoretisch\u201c, \u201eLeib\u201c. \u041e\u0442\u043b\u0438\u0447\u0430\u0442\u044c \u043e\u0442 \u0441\u043a\u043e\u0431\u043a\u0438-\u0433\u043b\u043e\u0441\u0441\u044b: \u043a\u0430\u0432\u044b\u0447\u043a\u0438 \u2014 \u0441\u0432\u043e\u0439 \u0442\u0435\u0440\u043c\u0438\u043d \u043f\u043e\u0434 \u0432\u043e\u043f\u0440\u043e\u0441\u043e\u043c, \u0441\u043a\u043e\u0431\u043a\u0430 \u2014 \u0432\u0441\u0442\u0430\u0432\u043a\u0430."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u041f\u043e\u0434\u0447\u0451\u0440\u043a\u0438\u0432\u0430\u043d\u0438\u0435 MS \u2283 \u0440\u0430\u0437\u0440\u044f\u0434\u043a\u0430 Hua", "\u0412\u0441\u044f\u043a\u0430\u044f \u0440\u0430\u0437\u0440\u044f\u0434\u043a\u0430 \u0438\u0437\u0434\u0430\u043d\u0438\u044f \u0441\u0442\u043e\u0438\u0442 \u043d\u0430 \u043f\u043e\u0434\u0447\u0451\u0440\u043a\u0438\u0432\u0430\u043d\u0438\u0438 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438, \u043d\u043e \u043d\u0435 \u043d\u0430\u043e\u0431\u043e\u0440\u043e\u0442: denkbar (49b) \u043f\u043e\u0434\u0447\u0451\u0440\u043a\u043d\u0443\u0442\u043e \u0434\u0432\u043e\u0439\u043d\u043e\u0439 \u0447\u0435\u0440\u0442\u043e\u0439, \u0432 Hua \u0440\u0430\u0437\u0440\u044f\u0434\u043a\u0438 \u043d\u0435\u0442."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u041a\u0443\u0440\u0440\u0435\u043d\u0442 \u2014 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u0439 \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a \u043e\u0448\u0438\u0431\u043e\u043a", "todten Leib (\u0441\u0442\u0430\u0440\u0430\u044f \u043e\u0440\u0444\u043e\u0433\u0440\u0430\u0444\u0438\u044f -dt-, Hua \u043d\u043e\u0440\u043c\u0430\u043b\u0438\u0437\u0443\u0435\u0442). \u0420\u0430\u043d\u043d\u0438\u0439 \u043f\u043e\u0447\u0435\u0440\u043a \u043f\u0435\u0440\u0435\u0443\u0447\u0438\u0432\u0430\u043d\u0438\u044f \u043d\u0435 \u0442\u0440\u0435\u0431\u0443\u0435\u0442, \u043d\u043e \u0434\u043e\u043b\u044f \u043b\u043e\u043d\u0433\u0445\u0435\u043d\u0434-\u0432\u0441\u0442\u0430\u0432\u043e\u043a \u0441\u0430\u043c\u0430 \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u043a\u0430\u043a \u0434\u0430\u0442\u0438\u0440\u0443\u044e\u0449\u0438\u0439 \u043f\u0440\u0438\u0437\u043d\u0430\u043a."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u041f\u0443\u043d\u043a\u0442\u0443\u0430\u0446\u0438\u0438 \u043f\u043e\u0447\u0442\u0438 \u043d\u0435\u0442; \u0435\u0451 \u0437\u0430\u043c\u0435\u043d\u044f\u044e\u0442 \u0434\u0432\u0430 \u0430\u0432\u0442\u043e\u0440\u0441\u043a\u0438\u0445 \u0437\u043d\u0430\u043a\u0430", "Fragezeichen (\u043d\u0430\u0434\u0441\u0442\u0440\u043e\u0447\u043d\u044b\u0439 2-\u0437\u0430\u0432\u0438\u0442\u043e\u043a + \u0442\u043e\u0447\u043a\u0430) \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0438\u0440\u0443\u0435\u0442 \u043f\u0435\u0440\u0438\u043e\u0434 \u043b\u0443\u0447\u0448\u0435 \u0442\u043e\u0447\u0435\u043a. Absatzzeichen (\u0434\u043b\u0438\u043d\u043d\u044b\u0439 \u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u044c\u043d\u044b\u0439 \u0440\u043e\u0441\u0447\u0435\u0440\u043a-\u043f\u0435\u0442\u043b\u044f \u0432 \u043a\u043e\u043d\u0446\u0435 \u0441\u0442\u0440\u043e\u043a\u0438) \u0432 \u043f\u0435\u0447\u0430\u0442\u0438 \u043f\u0440\u0435\u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044f \u0432 \u0430\u0431\u0437\u0430\u0446\u043d\u044b\u0439 \u043e\u0442\u0441\u0442\u0443\u043f. \u041a\u0440\u043e\u043c\u0435 \u043d\u0438\u0445 \u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u043f\u0440\u0438\u0437\u043d\u0430\u043a\u043e\u0432 \u0433\u0440\u0430\u043d\u0438\u0446\u044b \u043c\u044b\u0441\u043b\u0438 \u043d\u0435\u0442."], ["D. \u0421\u043b\u043e\u0438 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438", "\u0422\u0438\u043f\u043e\u043b\u043e\u0433\u0438\u044f \u0441\u043b\u043e\u0451\u0432 \u0437\u0430\u043a\u0440\u044b\u0442\u0430 \u2014 \u0447\u0435\u0442\u044b\u0440\u0435 \u0442\u0438\u043f\u0430", "\u0417\u0430\u043c\u0435\u043d\u0430 V., \u0432\u0441\u0442\u0430\u0432\u043a\u0430 \u043d\u0430\u0434 \u0441\u0442\u0440\u043e\u043a\u043e\u0439 Einf. (\u0447\u0435\u0440\u043d\u0438\u043b\u0430\u043c\u0438 \u0438\u043b\u0438 \u043a\u0430\u0440\u0430\u043d\u0434\u0430\u0448\u043e\u043c), \u0432\u044b\u0447\u0435\u0440\u043a gestr., Randmarkierung mit Bleist. \u041f\u043b\u044e\u0441 \u0430\u0432\u0442\u043e\u0440\u0441\u043a\u0438\u0439 Absatzzeichen. \u041e\u0441\u0442\u0430\u0451\u0442\u0441\u044f \u043d\u0435 \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u0442\u044c \u043d\u043e\u0432\u044b\u0435 \u0442\u0438\u043f\u044b, \u0430 \u0441\u0438\u0441\u0442\u0435\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0438\u0441\u043a\u0430\u0442\u044c \u0438\u0437\u0432\u0435\u0441\u0442\u043d\u044b\u0435: \u0447\u0438\u0442\u0430\u0442\u044c \u043b\u0438\u0441\u0442 = \u0447\u0438\u0442\u0430\u0442\u044c \u0435\u0433\u043e \u0441\u043b\u043e\u0438."], ["D. \u0421\u043b\u043e\u0438 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438", "\u0413\u0440\u0430\u0444\u0438\u043a\u0430 \u0432\u044b\u0447\u0435\u0440\u043a\u0430 \u0434\u0432\u043e\u044f\u043a\u0430\u044f", "\u0427\u0430\u0441\u0442\u0430\u044f \u043a\u043e\u0441\u0430\u044f \u0448\u0442\u0440\u0438\u0445\u043e\u0432\u043a\u0430 \u00ab\u0440\u0435\u0448\u0451\u0442\u043a\u043e\u0439\u00bb (\u0437\u043d\u0430\u043a \u043f\u043e\u0434 \u043d\u0435\u0439 \u043d\u0435\u0447\u0438\u0442\u0430\u0435\u043c \u043f\u0440\u0438\u043d\u0446\u0438\u043f\u0438\u0430\u043b\u044c\u043d\u043e \u2014 \u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u27e6gestr.\u27e7) \u0438 \u043e\u0434\u0438\u043d\u043e\u0447\u043d\u044b\u0439 \u043f\u0435\u0440\u0435\u0447\u0451\u0440\u043a (3a)."], ["D. \u0421\u043b\u043e\u0438 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438", "\u0427\u0435\u0440\u043d\u0438\u043b\u0430 \u0438 \u043a\u0430\u0440\u0430\u043d\u0434\u0430\u0448 \u0440\u0430\u0437\u043b\u0438\u0447\u0430\u044e\u0442\u0441\u044f \u0438\u0437\u043c\u0435\u0440\u0438\u043c\u043e", "\u041f\u043b\u043e\u0442\u043d\u043e\u0441\u0442\u044c \u043f\u043e \u0441\u043a\u0430\u043d\u0443: \u0447\u0435\u0440\u043d\u0438\u043b\u0430 ~1\u201334, \u043a\u0430\u0440\u0430\u043d\u0434\u0430\u0448 ~86\u2013200, \u0431\u0443\u043c\u0430\u0433\u0430 ~250; \u0433\u0440\u0430\u043d\u0438\u0446\u0430 \u0440\u0435\u0437\u043a\u0430\u044f. \u041a\u0430\u0440\u0430\u043d\u0434\u0430\u0448 = \u0431\u043e\u043b\u0435\u0435 \u043f\u043e\u0437\u0434\u043d\u0438\u0439 \u0441\u043b\u043e\u0439. \u041d\u0430 \u044d\u0442\u043e\u043c \u0436\u0435 \u0440\u0430\u0437\u043b\u0438\u0447\u0438\u0438 \u0441\u0442\u043e\u0438\u0442 \u0438\u0437\u0434\u0430\u0442\u0435\u043b\u044c\u0441\u043a\u043e\u0435 \u00abEinf.\u00bb / \u00abEinf. mit Bleist.\u00bb."], ["D. \u0421\u043b\u043e\u0438 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438", "\u041a\u0430\u0440\u0430\u043d\u0434\u0430\u0448 \u0431\u044b\u0432\u0430\u0435\u0442 \u043d\u0435 \u043f\u0440\u0430\u0432\u043a\u043e\u0439, \u0430 \u0447\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u0441\u043a\u043e\u0439 \u043f\u043e\u043c\u0435\u0442\u043e\u0439", "\u0412\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u0439 \u0448\u0442\u0440\u0438\u0445 \u043d\u0430 \u043f\u043e\u043b\u044f\u0445 (49b, \u0441\u0442\u043a. 6\u20138, \u043f\u043b\u043e\u0442\u043d\u043e\u0441\u0442\u044c 142 \u043f\u0440\u043e\u0442\u0438\u0432 1\u20137 \u0443 \u0447\u0435\u0440\u043d\u0438\u043b \u0442\u043e\u0439 \u0436\u0435 \u0441\u0442\u0440\u043e\u043a\u0438) = \u043e\u0442\u0447\u0451\u0440\u043a\u043d\u0443\u0442\u043e\u0435 \u043f\u0440\u0438 \u043f\u0435\u0440\u0435\u0447\u0438\u0442\u044b\u0432\u0430\u043d\u0438\u0438. \u041a\u0430\u0440\u0430\u043d\u0434\u0430\u0448\u043d\u044b\u0439 \u0441\u043b\u043e\u0439 \u0434\u0435\u043b\u0438\u0442\u044c \u043d\u0430 \u0432\u043f\u0438\u0441\u0430\u043d\u043d\u043e\u0435 (\u0431\u043e\u043b\u0435\u0435 \u043f\u043e\u0437\u0434\u043d\u044f\u044f \u043c\u044b\u0441\u043b\u044c) \u0438 \u043e\u0442\u0447\u0451\u0440\u043a\u043d\u0443\u0442\u043e\u0435 (\u0431\u043e\u043b\u0435\u0435 \u043f\u043e\u0437\u0434\u043d\u0435\u0435 \u0447\u0442\u0435\u043d\u0438\u0435): \u043c\u0435\u0440\u044f\u044e\u0442\u0441\u044f \u043e\u0434\u0438\u043d\u0430\u043a\u043e\u0432\u043e, \u0437\u043d\u0430\u0447\u0430\u0442 \u0440\u0430\u0437\u043d\u043e\u0435."], ["E. \u0420\u0443\u043a\u043e\u043f\u0438\u0441\u044c \u043f\u0440\u043e\u0442\u0438\u0432 \u043f\u0435\u0447\u0430\u0442\u0438", "Hua \u2014 \u0432\u0442\u043e\u0440\u043e\u0439 \u0441\u0432\u0438\u0434\u0435\u0442\u0435\u043b\u044c, \u0430 \u043d\u0435 \u044d\u0442\u0430\u043b\u043e\u043d", "\u0412\u0441\u0435 \u043d\u0430\u043a\u043e\u043f\u043b\u0435\u043d\u043d\u044b\u0435 \u0440\u0430\u0441\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u044f \u2014 \u0432 \u043f\u043e\u043b\u044c\u0437\u0443 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438: mindest \u2260 mindestens (4b); \u0442\u0438\u0440\u0435 \u0432\u043c\u0435\u0441\u0442\u043e \u043a\u0440\u0443\u0433\u043b\u044b\u0445 \u0441\u043a\u043e\u0431\u043e\u043a (49a); \u043e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u044f -es \u0432\u043c\u0435\u0441\u0442\u043e -en (49a); Fragezeichen \u0432\u043c\u0435\u0441\u0442\u043e \u0442\u043e\u0447\u043a\u0438 (49b/8); \u0434\u0438\u0442\u0442\u043e\u0433\u0440\u0430\u0444\u0438\u044f das \u27e6sie gestr.\u27e7 das \u043f\u0440\u0438 \u043e\u0434\u043d\u043e\u043c \u043f\u0435\u0447\u0430\u0442\u043d\u043e\u043c das (26a/8); \u0442\u0440\u0438 \u0441\u043b\u0443\u0447\u0430\u044f \u043d\u043e\u0440\u043c\u0430\u043b\u0438\u0437\u0430\u0446\u0438\u0438 \u043f\u0443\u043d\u043a\u0442\u0443\u0430\u0446\u0438\u0438 (26a, \u0441\u0442\u043a. 10\u201312); Seiendes \u0432\u043c\u0435\u0441\u0442\u043e Seiende (26a/7); es \u0432\u043c\u0435\u0441\u0442\u043e er (26b/2); in dem \u0432\u043c\u0435\u0441\u0442\u043e in der (26b/18); \u043b\u0438\u0448\u043d\u0435\u0435 und \u043f\u043e\u0441\u043b\u0435 Weise (26b/20\u201321)."], ["E. \u0420\u0443\u043a\u043e\u043f\u0438\u0441\u044c \u043f\u0440\u043e\u0442\u0438\u0432 \u043f\u0435\u0447\u0430\u0442\u0438", "\u0424\u043e\u0440\u043c\u0443\u043b\u0430 \u043a\u043e\u043d\u044a\u0435\u043a\u0442\u0443\u0440", "\u27e8X\u27e9 \u0431\u0435\u0437 \u0430\u043f\u043f\u0430\u0440\u0430\u0442\u043d\u043e\u0439 \u043f\u043e\u043c\u0435\u0442\u044b = \u0434\u043e\u0431\u0430\u0432\u043a\u0430 \u0438\u0437\u0434\u0430\u0442\u0435\u043b\u0435\u0439, \u0432 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438 \u0435\u0451 \u043d\u0435\u0442 \u2014 \u043d\u0435 \u0438\u0441\u043a\u0430\u0442\u044c. \u00abX Einf.\u00bb = \u0440\u0443\u043a\u0430 \u0413\u0443\u0441\u0441\u0435\u0440\u043b\u044f \u043d\u0430\u0434 \u0441\u0442\u0440\u043e\u043a\u043e\u0439 \u2014 \u0438\u0441\u043a\u0430\u0442\u044c. \u041f\u0440\u043e\u0432\u0435\u0440\u0435\u043d\u043e \u043d\u0430 \u0441\u0435\u043c\u0438 \u0441\u043b\u0443\u0447\u0430\u044f\u0445 (\u27e8wahren\u27e9, \u27e8wahre\u27e9, \u27e8werden\u27e9, \u27e8gibt\u27e9, \u27e8dazu\u27e9, \u27e8eine\u27e9, \u27e8den\u27e9). \u0417\u0430\u0433\u043e\u043b\u043e\u0432\u043a\u0438 \u00a7\u00a7 \u0432 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438 \u043e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0443\u044e\u0442 \u2014 \u043e\u043d\u0438 \u0441\u043a\u043e\u043d\u0441\u0442\u0440\u0443\u0438\u0440\u043e\u0432\u0430\u043d\u044b \u0438\u0437\u0434\u0430\u0442\u0435\u043b\u044f\u043c\u0438."], ["E. \u0420\u0443\u043a\u043e\u043f\u0438\u0441\u044c \u043f\u0440\u043e\u0442\u0438\u0432 \u043f\u0435\u0447\u0430\u0442\u0438", "\u041e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u044f \u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u0431\u0443\u043a\u0432\u0430\u043b\u044c\u043d\u043e, \u043d\u0435 \u00ab\u043f\u043e\u043f\u0440\u0430\u0432\u043b\u044f\u044f\u00bb \u043f\u043e\u0434 \u0433\u0440\u0430\u043c\u043c\u0430\u0442\u0438\u043a\u0443 \u0438\u0437\u0434\u0430\u043d\u0438\u044f", "\u00abschlafendes \u2026 Dahinlebendes\u00bb \u043f\u0440\u043e\u0442\u0438\u0432 \u043f\u0435\u0447\u0430\u0442\u043d\u044b\u0445 -en. \u0418\u043c\u0435\u043d\u043d\u043e \u043e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u044f \u0434\u0430\u044e\u0442 \u0440\u0430\u0437\u043d\u043e\u0447\u0442\u0435\u043d\u0438\u044f."], ["E. \u0420\u0443\u043a\u043e\u043f\u0438\u0441\u044c \u043f\u0440\u043e\u0442\u0438\u0432 \u043f\u0435\u0447\u0430\u0442\u0438", "\u041f\u0443\u043d\u043a\u0442\u0443\u0430\u0446\u0438\u044f \u2014 \u0441\u0430\u043c\u044b\u0439 \u0443\u044f\u0437\u0432\u0438\u043c\u044b\u0439 \u0441\u043b\u043e\u0439 \u0438\u0437\u0434\u0430\u043d\u0438\u044f: \u0430\u043f\u043f\u0430\u0440\u0430\u0442 \u0435\u0451 \u043d\u0435 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0438\u0440\u0443\u0435\u0442", "\u041d\u043e\u0440\u043c\u0430\u043b\u0438\u0437\u0430\u0446\u0438\u044f \u0438\u0434\u0451\u0442 \u0432 \u043e\u0431\u0435 \u0441\u0442\u043e\u0440\u043e\u043d\u044b (26a): MS \u0437\u0430\u043f\u044f\u0442\u0430\u044f \u2192 \u043f\u0435\u0447\u0430\u0442\u043d\u043e\u0435 \u00ab?\u00bb, MS \u0442\u043e\u0447\u043a\u0430 \u2192 \u00ab?\u00bb, MS \u0442\u0438\u0440\u0435 \u2192 \u00ab,\u00bb; \u0438 \u043d\u0430\u043e\u0431\u043e\u0440\u043e\u0442 \u2014 MS Fragezeichen \u2192 \u043f\u0435\u0447\u0430\u0442\u043d\u0430\u044f \u0442\u043e\u0447\u043a\u0430 (49b/8). \u041f\u0435\u0447\u0430\u0442\u043d\u0430\u044f \u043f\u0443\u043d\u043a\u0442\u0443\u0430\u0446\u0438\u044f \u043d\u0435 \u0441\u0432\u0438\u0434\u0435\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0443\u0435\u0442 \u043e \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438 \u043d\u0438 \u0432 \u043e\u0434\u043d\u0443 \u0441\u0442\u043e\u0440\u043e\u043d\u0443; \u043f\u0440\u0438\u0437\u043d\u0430\u043a \u0432\u043e\u043f\u0440\u043e\u0441\u0430 \u0432 MS \u2014 \u0442\u043e\u043b\u044c\u043a\u043e \u043d\u0430\u0434\u0441\u0442\u0440\u043e\u0447\u043d\u044b\u0439 2-\u0437\u0430\u0432\u0438\u0442\u043e\u043a \u0441 \u0442\u043e\u0447\u043a\u043e\u0439."], ["E. \u0420\u04 function rich(text,terms=[],corpus=S.corpus){
 let h=esc(text).replace(/\ue000([^\ue001]*)\ue001/g,(_,w)=>xref(w,corpus));
 terms=terms.filter(t=>t.length>1);if(!terms.length)return h;
 return h.split(/(<[^>]*>)/).map(s=>s.startsWith('<')?s:s.replace(new RegExp('('+terms.filter(t=>t.length>1).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'),m=>m?'<mark>'+m+'</mark>':'')).join('');
}
function xref(w,corpus){
 const indices=XREF.get(keyOf(strip(w)))||[];const scoped=indices.filter(i=>DB.items[i].corpus===corpus);const candidates=scoped.length?scoped:indices;
 if(candidates.length===1)return '<a class="xr" href="#card='+DB.items[candidates[0]].id+'" data-i="'+candidates[0]+'">'+w+'</a>';
 if(candidates.length>1)return '<a class="xr" href="#q='+encodeURIComponent(strip(w))+'" data-query="'+esc(strip(w))+'">'+w+'</a>';
 return '<em>'+w+'</em>';
}

function fromURL(){
 clearTimeout(searchTimer);S=defaults();let raw=location.hash.slice(1);try{raw=decodeURIComponent(raw);}catch{}
 if(['about','abc','bl','parts'].includes(raw)){S.mode=({bl:'abc',parts:'tutorial'})[raw]||raw;if(raw==='parts')S.lesson='rules';}
 else{
 const p=new URLSearchParams(location.hash.slice(1));Object.keys(S).forEach(k=>{if(p.has(k))S[k]=k==='cuts'?p.get(k)==='1':p.get(k);});
 if(p.has('w')){const indices=XREF.get(keyOf(p.get('w')));if(indices?.length){goto(indices[0],false);return;}}
 if(p.has('bl')){S.corpus='AV21';S.sheet='AV21:'+p.get('bl');}
 }
 if(!['abc','forms','tutorial','about'].includes(S.mode))S.mode='abc';
 if(S.corpus&&!CORPORA[S.corpus])S.corpus='';
 ['shape','family','morph'].forEach(k=>{if(S[k]&&AXES[GROUPS[S[k]]?.axis]!==k)S[k]='';});
 if(!LESSONS.some(l=>l.id===S.lesson))S.lesson='start';
 if(!['groups','pairs'].includes(S.forms))S.forms='groups';
 if(S.sheet&&!DB.items.some(it=>(!S.corpus||it.corpus===S.corpus)&&it.occ.some(o=>sheetKey(it.corpus,o[0])===S.sheet)))S.sheet='';
 if(S.layer&&!DB.items.some(it=>it.l===S.layer))S.layer='';
 if(S.type&&!DB.items.some(it=>it.t===S.type))S.type='';
 if(S.letter&&!['#',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].includes(S.letter))S.letter='';
 if(S.card){const i=DB.items.findIndex(it=>it.id===S.card);if(i>=0){goto(i,false);return;}S.card='';}
 render();
}
addEventListener('hashchange',fromURL);addEventListener('popstate',fromURL);fromURL();

function ABOUT() {
  return `<h2>Указатель гуссерлевских зиглов и сокращений</h2>
<p>Рабочий указатель сокращений, которыми Эдмунд Гуссерль пользовался в габельсбергеровской стенографии.
Первый корпус — конволют <b>A V 21</b> «Ethisches Leben. Theologie — Wissenschaft» (1924–1927) из Husserl-Archiv, KU Leuven.
Каждая карточка — вырезка из скана в полном разрешении, буквальное чтение знака, адрес листа и строки
и, где лист издан, немецкий контекст с адресом по Hua XLII.</p>
<p>Словарь поддерживает несколько конволютов. Материал B I 13 добавляется отдельно; его номера листов и карточки не смешиваются с A V 21. Наблюдения о графике и идиолекте, перенесённые из A V 21, требуют проверки на новом материале.</p><h2>Как устроена карточка</h2>
<table><tr><th>Поле</th><th>Что означает</th></tr>
<tr><td><b>Слово</b></td><td>Полное восстановленное слово. Алфавит — по нему; умляуты приравнены к базовой гласной, ß = s.</td></tr>
<tr><td><b>букв.</b></td><td>Буквальное чтение: только реально видимые элементы знака. Символизация — в скобках, <code>+</code> — раздельно написанные части, <code>~</code> — волнообразный минимальный штрих.</td></tr>
<tr><td><b>Конволют</b></td><td>Архивный шифр — обязательная часть адреса. У каждой карточки есть постоянная ссылка.</td></tr><tr><td><b>Bl. / стк.</b></td><td>Лист конволюта и строка. Нумерация архивная (Blatt, не страница).</td></tr>
<tr><td><b>G1850</b></td><td>Параграф школьной таблицы зиглов по изданию Gabelsberger 1850 — там, где знак совпадает с ней буква в букву.</td></tr>
<tr><td><b>Комментарий</b></td><td>Чем знак отличается от соседей по семье; ссылки на пары и правила.</td></tr>
<tr><td><b>Контекст</b></td><td>Немецкая фраза и адрес в Hua XLII (страница, строка).</td></tr></table>
<h2>Условные знаки</h2>
<table><tr><th>Знак</th><th>Значение</th></tr>
<tr><td><code>⟨X⟩</code></td><td>Конъектура издателей: в рукописи слова нет</td></tr>
<tr><td><code>⟦gestr.⟧</code></td><td>Вычерк в рукописи</td></tr>
<tr><td><code>Einf.</code></td><td>Вставка над строкой рукой Гуссерля</td></tr>
<tr><td><code>V. für</code></td><td>Замена: слово написано вместо другого</td></tr>
<tr><td><code>„…“</code></td><td>Терм-цитата, дистанцирование — авторские кавычки</td></tr>
<tr><td><code>⚠</code></td><td>Ловушка чтения</td></tr></table>
<h2>Источники и права</h2>
<p>Сканы и вырезки: <b>Husserl-Archiv, KU Leuven</b>, конволют A V 21, IIIF-манифест

При использовании вырезок сохраняйте атрибуцию архива.<br>
Печатный источник: <i>Husserliana XLII. Grenzprobleme der Phänomenologie</i>, hrsg. R. Sowa / T. Vongehr, Springer 2014.<br>
Система письма: F. X. Gabelsberger, <i>Anleitung zur deutschen Redezeichenkunst</i>, изд. 1834 и 1850.<br>

<tr><td><code>Enter</code></td><td>Открыть вырезку</td></tr><tr><td><code>← →</code></td><td>Соседняя вырезка в просмотре</td></tr>
<tr><td><code>Esc</code></td><td>Закрыть / сбросить поиск</td></tr></table>
<p>В поиске работают уточнения: <code>corpus:BI13</code> — конволют, <code>bl:26b</code> — только этот лист, <code>тип:аффикс</code> — только этот тип знака.</p>`;
