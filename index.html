0431\u043d\u0438\u043a\u0430</th><th>\u0424\u043e\u0440\u043c\u0430 \u0438 \u043b\u043e\u0433\u0438\u043a\u0430</th><th>\u0414\u043b\u044f \u0447\u0442\u0435\u043d\u0438\u044f</th></tr><tr><td><strong>l</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_l.png\" alt=\"l\" tabindex=\"0\" role=\"button\"></td><td><strong>\u0432\u043e\u0441\u0445\u043e\u0434\u044f\u0449\u0430\u044f</strong> \u0442\u043e\u0447\u0435\u0447\u043d\u0430\u044f \u043f\u0435\u0442\u043b\u044f (\u043a\u0430\u043a \u0432 \u043a\u0443\u0440\u0440\u0435\u043d\u0442\u043d\u043e\u043c e)</td><td>\u043a\u043b\u044e\u0447\u0435\u0432\u0430\u044f \u043e\u043f\u043f\u043e\u0437\u0438\u0446\u0438\u044f: \u043f\u0435\u0442\u043b\u044f <strong>\u0432\u0432\u0435\u0440\u0445 = l</strong>, \u043f\u0435\u0442\u043b\u044f <strong>\u0432\u043d\u0438\u0437 = a</strong>! l \u2014 \u00ab\u0441\u0440\u0435\u0434\u043e\u0442\u043e\u0447\u0438\u0435 \u043a\u043e\u043d\u0441\u043e\u043d\u0430\u043d\u0442\u0438\u0437\u043c\u0430\u00bb, \u043a\u0430\u043a a \u0443 \u0433\u043b\u0430\u0441\u043d\u044b\u0445</td></tr><tr><td><strong>r</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_r.png\" alt=\"r\" tabindex=\"0\" role=\"button\"></td><td>\u00ab\u0437\u0443\u0431 \u043a\u043e\u043b\u0435\u0441\u0430\u00bb: \u043e\u0441\u0442\u0440\u044b\u0439 \u0448\u0442\u0440\u0438\u0445 \u0441 \u0432\u044b\u0433\u0438\u0431\u043e\u043c \u0441\u043b\u0435\u0432\u0430 \u043d\u0430\u043f\u0440\u0430\u0432\u043e</td><td>\u043f\u0440\u0430\u0432\u0438\u043b\u043e \u043d\u0430 \u043f\u043e\u0442\u043e\u043c: \u0432\u0441\u044f\u043a\u0438\u0439 \u0437\u043d\u0430\u043a, \u043f\u043e\u0432\u0451\u0440\u043d\u0443\u0442\u044b\u0439 \u0432 \u044d\u0442\u0443 \u043f\u043e\u0437\u0438\u0446\u0438\u044e, \u043d\u0435\u0441\u0451\u0442 \u043f\u0440\u0438 \u0441\u0435\u0431\u0435 r</td></tr></table></div><p><strong>\u041d\u043e\u0441\u043e\u0432\u044b\u0435 (n, ng, m):</strong></p><div class=\"table-scroll\"><table><tr><th>\u0411\u0443\u043a\u0432\u0430</th><th>\u0418\u0437 \u0443\u0447\u0435\u0431\u043d\u0438\u043a\u0430</th><th>\u0424\u043e\u0440\u043c\u0430 \u0438 \u043b\u043e\u0433\u0438\u043a\u0430</th><th>\u0414\u043b\u044f \u0447\u0442\u0435\u043d\u0438\u044f</th></tr><tr><td><strong>n</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_n.png\" alt=\"n\" tabindex=\"0\" role=\"button\"></td><td>\u043b\u0451\u0433\u043a\u0430\u044f \u0440\u043e\u0432\u043d\u0430\u044f \u0432\u043e\u043b\u043d\u0430 (\u0440\u043e\u0434\u0441\u0442\u0432\u043e \u0441 e \u2014 \u00ab\u043f\u043b\u043e\u0441\u043a\u0438\u043c\u00bb \u0433\u043b\u0430\u0441\u043d\u044b\u043c)</td><td>\u043b\u0435\u0433\u043a\u043e \u0441\u043f\u0443\u0442\u0430\u0442\u044c \u0441 e-\u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0435\u043c; \u0441\u043c\u043e\u0442\u0440\u0438 \u043d\u0430 \u0434\u043b\u0438\u043d\u0443</td></tr><tr><td><strong>ng</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_ng.png\" alt=\"ng\" tabindex=\"0\" role=\"button\"></td><td>\u0432\u043e\u043b\u043d\u0430, \u0432\u044b\u0432\u0435\u0434\u0435\u043d\u043d\u0430\u044f <strong>\u0441\u0432\u0435\u0440\u0445\u0443 \u0432\u043d\u0438\u0437, \u0441 \u0432\u044b\u0441\u043e\u0442\u044b g</strong></td><td>\u043e\u0434\u0438\u043d \u0437\u0432\u0443\u043a \u2014 \u043e\u0434\u0438\u043d \u0437\u043d\u0430\u043a (singen, Ding)</td></tr><tr><td><strong>m</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_m.png\" alt=\"m\" tabindex=\"0\" role=\"button\"></td><td>\u0441\u0442\u043e\u044f\u0447\u0430\u044f \u0432\u043e\u043b\u043d\u0430, \u0437\u0430\u043c\u043a\u043d\u0443\u0442\u0430\u044f \u0441\u0432\u0435\u0440\u0445\u0443 \u0438 \u0441\u043d\u0438\u0437\u0443 \u2014 \u00ab\u0435\u0433\u0438\u043f\u0435\u0442\u0441\u043a\u0438\u0439 \u0438\u0435\u0440\u043e\u0433\u043b\u0438\u0444 \u0437\u0430\u043a\u0440\u044b\u0442\u043e\u0433\u043e \u0440\u0442\u0430\u00bb</td><td>\u043f\u043b\u043e\u0442\u043d\u044b\u0439 \u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u0439 \u0437\u0438\u0433\u0437\u0430\u0433</td></tr></table></div><p>\u041c\u043d\u0435\u043c\u043e\u043d\u0438\u043a\u0430 \u043a\u043b\u0430\u0441\u0441\u0430: <em>\u043c\u044f\u0433\u043a\u0438\u0439 \u043a\u0440\u044e\u0447\u043e\u043a (h) \u0442\u0432\u0435\u0440\u0434\u0435\u0435\u0442 (g), \u0442\u044f\u043d\u0435\u0442\u0441\u044f \u0432\u0432\u0435\u0440\u0445 (ch), \u0432\u044b\u0433\u0438\u0431\u0430\u0435\u0442\u0441\u044f \u043c\u043e\u0441\u0442\u043e\u043c (k); \u0442\u043e\u043d\u043a\u0430\u044f \u0441\u0442\u0440\u0435\u043b\u0430 (t) \u043e\u0431\u0440\u0430\u0441\u0442\u0430\u0435\u0442 \u043a\u0440\u044e\u0447\u043a\u043e\u043c (th) \u0438 \u0441\u0432\u043e\u0440\u0430\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u0432 \u043f\u0435\u0442\u0435\u043b\u044c\u043a\u0443 (d); \u043f\u0435\u0442\u043b\u044f \u0432\u0432\u0435\u0440\u0445 \u2014 l, \u0437\u0443\u0431 \u043a\u043e\u043b\u0435\u0441\u0430 \u2014 r; \u0432\u043e\u043b\u043d\u0430 \u0440\u043e\u0432\u043d\u0430\u044f (n), \u0432\u043e\u043b\u043d\u0430 \u0441 \u0432\u044b\u0441\u043e\u0442\u044b (ng), \u0432\u043e\u043b\u043d\u0430 \u0441\u0442\u043e\u044f\u0447\u0430\u044f (m).</em></p><h3>2.2.2. II \u043a\u043b\u0430\u0441\u0441: Blaselaute (\u00a75, \u043a\u043d. \u0441\u0442\u0440. 12\u201313 = PDF 41\u201342; \u0442\u0430\u0431\u043b\u0438\u0446\u0430: \u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 1 = PDF 176 = MDZ 00177)</h3><p><img loading=\"lazy\" src=\"tutorial_img/blaselaute_1850_S1_mdz.png\" alt=\"Blaselaute, G1850, \u0441\u0442\u0435\u043d\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0441\u0442\u0440. 1\" tabindex=\"0\" role=\"button\"></p><p>\u042d\u043b\u0435\u043c\u0435\u043d\u0442\u0430\u0440\u043d\u044b\u0439 \u0448\u0442\u0440\u0438\u0445 \u043a\u043b\u0430\u0441\u0441\u0430 \u2014 <strong>\u0432\u044b\u0433\u0438\u0431 \u0441\u043b\u0435\u0432\u0430 \u043d\u0430\u043f\u0440\u0430\u0432\u043e</strong> (spiritus asper), \u0437\u0435\u0440\u043a\u0430\u043b\u044c\u043d\u044b\u0439 \u043a \u0432\u044b\u0433\u0438\u0431\u0443 Hauchlaute \u0441\u043f\u0440\u0430\u0432\u0430 \u043d\u0430\u043b\u0435\u0432\u043e (spiritus lenis). \u0428\u0435\u0441\u0442\u044c \u0437\u043d\u0430\u043a\u043e\u0432, \u043e\u0434\u043d\u0430 \u043b\u043e\u0433\u0438\u043a\u0430 \u00ab\u043b\u0435\u0441\u0442\u043d\u0438\u0446\u044b\u00bb h\u2192g\u2192ch, \u043d\u043e \u0432 \u0437\u0435\u0440\u043a\u0430\u043b\u0435:</p><div class=\"table-scroll\"><table><tr><th>\u0411\u0443\u043a\u0432\u0430</th><th>\u0418\u0437 \u0443\u0447\u0435\u0431\u043d\u0438\u043a\u0430</th><th>\u0424\u043e\u0440\u043c\u0430 \u0438 \u043b\u043e\u0433\u0438\u043a\u0430</th><th>\u0414\u043b\u044f \u0447\u0442\u0435\u043d\u0438\u044f</th></tr><tr><td><strong>w</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_w.png\" alt=\"w\" tabindex=\"0\" role=\"button\"></td><td>\u043c\u044f\u0433\u043a\u0438\u0439 \u043a\u0440\u044e\u0447\u043e\u043a \u0441\u043b\u0435\u0432\u0430 \u043d\u0430\u043f\u0440\u0430\u0432\u043e \u2014 \u00ab\u043e\u0431\u043b\u0430\u0447\u043a\u043e, \u043e\u0442\u0445\u043e\u0434\u044f\u0449\u0435\u0435 \u043e\u0442 \u0433\u0443\u0431\u00bb</td><td>\u0437\u0435\u0440\u043a\u0430\u043b\u044c\u043d\u044b\u0439 \u0431\u043b\u0438\u0437\u043d\u0435\u0446 h; \u043f\u0443\u0442\u0430\u0442\u044c \u0438\u0445 \u2014 \u0442\u0438\u043f\u043e\u0432\u0430\u044f \u043e\u0448\u0438\u0431\u043a\u0430 \u043d\u043e\u0432\u0438\u0447\u043a\u0430</td></tr><tr><td><strong>b</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_b.png\" alt=\"b\" tabindex=\"0\" role=\"button\"></td><td>w \u0441 \u043b\u0451\u0433\u043a\u0438\u043c \u0442\u043e\u043b\u0447\u043a\u043e\u043c \u0441\u0432\u0435\u0440\u0445\u0443 \u0438 \u043c\u044f\u0433\u043a\u0438\u043c \u043e\u043a\u0440\u0443\u0433\u043b\u0435\u043d\u0438\u0435\u043c</td><td>\u00abb \u043e\u0442\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u043a w, \u043a\u0430\u043a g \u043a h\u00bb; \u0437\u0435\u0440\u043a\u0430\u043b\u044c\u043d\u043e\u0435 \u043e\u0442\u0440\u0430\u0436\u0435\u043d\u0438\u0435 g</td></tr><tr><td><strong>p</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_p.png\" alt=\"p\" tabindex=\"0\" role=\"button\"></td><td>\u044d\u043b\u043b\u0438\u043f\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0432\u044b\u0442\u044f\u043d\u0443\u0442\u043e\u0435 w \u2014 \u0440\u0435\u0437\u043a\u0438\u0439 \u0432\u044b\u0431\u0440\u043e\u0441</td><td>\u0432\u043d\u0438\u0437 \u043e\u0442 \u0441\u0442\u0440\u043e\u043a\u0438 \u0438\u043b\u0438 \u0441\u043d\u0438\u0437\u0443 \u043a \u0441\u0442\u0440\u043e\u043a\u0435</td></tr><tr><td><strong>f</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_f.png\" alt=\"f\" tabindex=\"0\" role=\"button\"></td><td>\u043f\u0440\u044f\u043c\u0430\u044f \u0442\u043e\u043d\u043a\u0430\u044f \u043b\u0438\u043d\u0438\u044f \u2014 \u00ab\u0441\u0442\u0435\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439\u00bb (\u0440\u043e\u0432\u043d\u044b\u0439) \u0432\u044b\u0434\u0443\u0432</td><td>\u0434\u0432\u043e\u0439\u043d\u0438\u043a t! \u0420\u0430\u0437\u043b\u0438\u0447\u0438\u0435 \u043f\u043e \u044f\u0440\u0443\u0441\u0443: <strong>t \u0441\u0442\u043e\u0438\u0442 \u043d\u0430 \u0441\u0442\u0440\u043e\u043a\u0435 \u0432\u0432\u0435\u0440\u0445, f \u0441\u0432\u0438\u0441\u0430\u0435\u0442 \u0432\u043d\u0438\u0437</strong> (\u0432 \u043d\u0430\u0447\u0430\u043b\u0435 \u0441\u043b\u043e\u0432\u0430 \u2014 \u0441\u043d\u0438\u0437\u0443 \u0432\u0432\u0435\u0440\u0445 \u043a \u0441\u0442\u0440\u043e\u043a\u0435)</td></tr><tr><td><strong>pf</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_pf.png\" alt=\"pf\" tabindex=\"0\" role=\"button\"></td><td>p \u0438 f, \u0441\u043b\u0438\u0442\u044b\u0435 \u0432 \u043e\u0434\u0438\u043d \u0440\u043e\u0441\u0447\u0435\u0440\u043a</td><td><strong>\u043d\u0430\u0436\u0438\u043c \u0432\u0441\u0435\u0433\u0434\u0430 \u043d\u0430 \u043b\u0435\u0432\u043e\u0439 \u0441\u0442\u043e\u0440\u043e\u043d\u0435</strong> \u0437\u043d\u0430\u043a\u0430</td></tr><tr><td><strong>v</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_v.png\" alt=\"v\" tabindex=\"0\" role=\"button\"></td><td>f \u0441 \u043b\u0451\u0433\u043a\u0438\u043c \u0438\u0437\u0432\u0438\u0432\u043e\u043c-\u043e\u043a\u0440\u0443\u0433\u043b\u0435\u043d\u0438\u0435\u043c</td><td>\u043f\u043e \u0437\u0432\u0443\u043a\u0443 \u0438 \u0444\u043e\u0440\u043c\u0435 \u0442\u044f\u0433\u043e\u0442\u0435\u0435\u0442 \u043a w</td></tr></table></div><p>\u041c\u043d\u0435\u043c\u043e\u043d\u0438\u043a\u0430: <em>\u043e\u0431\u043b\u0430\u0447\u043a\u043e (w) \u0442\u0432\u0435\u0440\u0434\u0435\u0435\u0442 (b), \u0432\u044b\u0442\u044f\u0433\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u044d\u043b\u043b\u0438\u043f\u0441\u043e\u043c (p); \u0440\u043e\u0432\u043d\u0430\u044f \u0441\u0442\u0440\u0443\u044f \u2014 \u043f\u0440\u044f\u043c\u0430\u044f \u043b\u0438\u043d\u0438\u044f (f), \u0441 \u0440\u043e\u0441\u0447\u0435\u0440\u043a\u043e\u043c p \u2014 pf; \u0438\u0437\u0432\u0438\u0432 \u043d\u0430 f \u2014 v.</em></p><p>\u0420\u043e\u0434\u0441\u0442\u0432\u043e \u043a\u043b\u0430\u0441\u0441\u043e\u0432 I \u0438 II (\u0432\u0430\u0436\u043d\u043e \u0434\u043b\u044f \u0447\u0442\u0435\u043d\u0438\u044f): \u043f\u0430\u0440\u044b-\u0437\u0435\u0440\u043a\u0430\u043b\u0430 h\u2194w, g\u2194b, ch\u2194p, t\u2194f. \u041f\u0440\u0438 \u0431\u0435\u0433\u043b\u043e\u043c \u043f\u0438\u0441\u044c\u043c\u0435 \u0413\u0443\u0441\u0441\u0435\u0440\u043b\u044f \u043f\u0443\u0442\u0430\u043d\u0438\u0446\u0430 \u0438\u043c\u0435\u043d\u043d\u043e \u0432 \u044d\u0442\u0438\u0445 \u043f\u0430\u0440\u0430\u0445 \u2014 \u043f\u0435\u0440\u0432\u043e\u0435, \u0447\u0442\u043e \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442\u0441\u044f \u043f\u043e \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442\u0443.</p><h3>2.2.3. III \u043a\u043b\u0430\u0441\u0441: Zischlaute (\u00a76, \u043a\u043d. \u0441\u0442\u0440. 13\u201314 = PDF 42\u201343; \u0442\u0430\u0431\u043b\u0438\u0446\u0430: \u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 1 = PDF 176 = MDZ 00177)</h3><p><img loading=\"lazy\" src=\"tutorial_img/zischlaute_1850_S1_mdz.png\" alt=\"Zischlaute, G1850, \u0441\u0442\u0435\u043d\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0441\u0442\u0440. 1\" tabindex=\"0\" role=\"button\"></p><p>\u042d\u043b\u0435\u043c\u0435\u043d\u0442\u0430\u0440\u043d\u044b\u0439 \u0448\u0442\u0440\u0438\u0445 \u043a\u043b\u0430\u0441\u0441\u0430 \u2014 <strong>\u043f\u0435\u0442\u043b\u044f (Schlinge), \u0437\u0430\u043a\u0440\u0443\u0447\u0435\u043d\u043d\u0430\u044f \u0441\u043b\u0435\u0432\u0430 \u043d\u0430\u043f\u0440\u0430\u0432\u043e</strong>: \u0434\u0432\u0430 \u043a\u0440\u044e\u0447\u043a\u0430 \u043f\u0435\u0440\u0432\u044b\u0445 \u043a\u043b\u0430\u0441\u0441\u043e\u0432 (h + w) \u0441\u043e\u043c\u043a\u043d\u0443\u0442\u044b \u0432 \u043a\u0440\u0443\u0433, \u0430 \u043a\u0440\u0443\u0433, \u0447\u0442\u043e\u0431\u044b \u0431\u044b\u0442\u044c \u0441\u043e\u0435\u0434\u0438\u043d\u0438\u043c\u044b\u043c \u0432 \u043f\u0438\u0441\u044c\u043c\u0435, \u043f\u0440\u0435\u0432\u0440\u0430\u0449\u0451\u043d \u0432 \u043f\u0435\u0442\u043b\u044e. \u00ab\u0427\u0442\u043e \u0441\u0432\u0438\u0441\u0442\u0438\u0442 \u0438 \u0448\u0438\u043f\u0438\u0442 \u2014 \u0442\u043e \u043f\u0438\u0448\u0435\u0442\u0441\u044f \u043f\u0435\u0442\u043b\u0451\u0439\u00bb.</p><div class=\"table-scroll\"><table><tr><th>\u0411\u0443\u043a\u0432\u0430</th><th>\u0418\u0437 \u0443\u0447\u0435\u0431\u043d\u0438\u043a\u0430</th><th>\u0424\u043e\u0440\u043c\u0430 \u0438 \u043b\u043e\u0433\u0438\u043a\u0430</th><th>\u0414\u043b\u044f \u0447\u0442\u0435\u043d\u0438\u044f</th></tr><tr><td><strong>s</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_s.png\" alt=\"s\" tabindex=\"0\" role=\"button\"></td><td>\u043c\u0430\u043b\u0430\u044f \u043f\u0435\u0442\u043b\u044f-\u00ab\u043f\u0443\u0437\u044b\u0440\u0451\u043a\u00bb (Kreisel)</td><td>\u0434\u043b\u0438\u043d\u043d\u043e\u0435 \u0438 \u043a\u043e\u0440\u043e\u0442\u043a\u043e\u0435 \u043a\u0443\u0440\u0440\u0435\u043d\u0442\u043d\u043e\u0435 s \u043d\u0435 \u0440\u0430\u0437\u043b\u0438\u0447\u0430\u044e\u0442\u0441\u044f</td></tr><tr><td><strong>\u00df (ss)</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_ss.png\" alt=\"ss\" tabindex=\"0\" role=\"button\"></td><td>\u0442\u043e \u0436\u0435 s, \u043d\u043e \u0443\u0441\u0438\u043b\u0435\u043d\u043d\u043e\u0435 \u0438 \u043a\u0440\u0443\u043f\u043d\u0435\u0435</td><td>\u0432 \u0441\u0443\u0444\u0444\u0438\u043a\u0441\u0430\u0445 -niss/-miss \u0443\u0441\u0438\u043b\u0435\u043d\u0438\u0435 \u043c\u043e\u0436\u043d\u043e \u0438\u0433\u043d\u043e\u0440\u0438\u0440\u043e\u0432\u0430\u0442\u044c</td></tr><tr><td><strong>sch</strong></td><td><img loading=\"lazy\" src=\"tutorial_img/kons_sch.png\" alt=\"sch\" tabindex=\"0\" role=\"button\"></td><td>\u044d\u043b\u043b\u0438\u043f\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0432\u044b\u0442\u044f\u043d\u0443\u0442\u0430\u044f \u043f\u0435\u0442\u043b\u044f</td><td>\u0442\u0430 \u0436\u0435 \u043b\u043e\u0433\u0438\u043a\u0430 \u0443\u0434\u043b\u0438\u043d\u0435\u043d\u0438\u044f, \u0447\u0442\u043e h\u2192ch, w\u2192p</td></tr><tr><td><strong>z</strong> \u043d\u0430\u0447\u0430\u043b\u044c\u043d\u043e\u0435</td><td><img loading=\"lazy\" src=\"tutorial_img/kons_z_anfang.png\" alt=\"z \u043d\u0430\u0447.\" tabindex=\"0\" role=\"button\"></td><td>t (\u043f\u0440\u044f\u043c\u043e\u0439 \u0432\u044b\u0431\u0440\u043e\u0441) + s-\u043f\u0435\u0442\u043b\u044f \u0432 \u043e\u0434\u043d\u043e\u043c \u0440\u043e\u0441\u0447\u0435\u0440\u043a\u0435</td><td>\u00ab\u0434\u043b\u0438\u043d\u043d\u043e\u0435\u00bb z: \u0432 \u043d\u0430\u0447\u0430\u043b\u0435 \u0441\u043b\u043e\u0432\u0430</td></tr><tr><td><strong>z</strong> \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u043d\u043e\u0435</td><td><img loading=\"lazy\" src=\"tutorial_img/kons_z_kurz.png\" alt=\"z \u0441\u0440\u0435\u0434.\" tabindex=\"0\" role=\"button\"></td><td>\u0443\u043a\u043e\u0440\u043e\u0447\u0435\u043d\u043d\u043e\u0435/\u00ab\u043e\u043f\u0440\u043e\u043a\u0438\u043d\u0443\u0442\u043e\u0435\u00bb \u043d\u0430\u0447\u0430\u043b\u044c\u043d\u043e\u0435 z</td><td>\u0434\u043b\u044f \u0431\u0435\u0433\u043b\u043e\u0433\u043e \u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u044f \u0432 \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0435 \u0441\u043b\u043e\u0432\u0430</td></tr><tr><td><strong>z</strong> \u043a\u043e\u043d\u0435\u0447\u043d\u043e\u0435</td><td><img loading=\"lazy\" src=\"tutorial_img/kons_z_ende.png\" alt=\"z \u043a\u043e\u043d.\" tabindex=\"0\" role=\"button\"></td><td>\u043f\u0440\u043e\u0441\u0442\u043e <strong>ts</strong> (t + s)</td><td>\u0444\u043e\u043d\u0435\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0447\u0435\u0441\u0442\u043d\u043e\u0441\u0442\u044c: z = t+s</td></tr></table></div><p>\u041c\u043d\u0435\u043c\u043e\u043d\u0438\u043a\u0430: <em>\u043f\u0443\u0437\u044b\u0440\u0451\u043a (s) \u0440\u0430\u0437\u0434\u0443\u0432\u0430\u0435\u0442\u0441\u044f (\u00df), \u0432\u044b\u0442\u044f\u0433\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u044d\u043b\u043b\u0438\u043f\u0441\u043e\u043c (sch); z \u2014 \u0441\u0442\u0440\u0435\u043b\u0430 t, \u0432\u043e\u0442\u043a\u043d\u0443\u0442\u0430\u044f \u0432 \u043f\u0435\u0442\u043b\u044e s, \u0438 \u0443 \u043d\u0435\u0433\u043e \u0442\u0440\u0438 \u043f\u043e\u0437\u0438\u0446\u0438\u043e\u043d\u043d\u044b\u0435 \u0444\u043e\u0440\u043c\u044b: \u0434\u043b\u0438\u043d\u043d\u0430\u044f \u0432 \u043d\u0430\u0447\u0430\u043b\u0435, \u043a\u043e\u0440\u043e\u0442\u043a\u0430\u044f \u0432 \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0435, ts \u0432 \u043a\u043e\u043d\u0446\u0435.</em></p><p><strong>\u0421\u0432\u043e\u0434\u043d\u044b\u0439 \u043f\u0440\u0438\u043d\u0446\u0438\u043f \u0442\u0440\u0451\u0445 \u043a\u043b\u0430\u0441\u0441\u043e\u0432</strong> (\u0413\u0430\u0431\u0435\u043b\u044c\u0441\u0431\u0435\u0440\u0433\u0435\u0440, \u043a\u043d. \u0441\u0442\u0440. 14 = PDF 43 \u2014 \u043f\u0440\u044f\u043c\u043e\u0439 \u043e\u0442\u0432\u0435\u0442 \u043d\u0430 \u0432\u043e\u043f\u0440\u043e\u0441, \u043a\u0430\u043a \u044d\u0442\u043e \u0447\u0438\u0442\u0430\u0442\u044c \u043f\u0440\u0438 \u043d\u0435\u0431\u0440\u0435\u0436\u043d\u043e\u043c \u043f\u0438\u0441\u044c\u043c\u0435): \u043e\u0441\u043d\u043e\u0432\u043d\u044b\u0435 \u0444\u043e\u0440\u043c\u044b Hauchlaute \u0432\u0441\u0435 \u0442\u044f\u043d\u0443\u0442\u0441\u044f <strong>\u0441\u043f\u0440\u0430\u0432\u0430 \u043d\u0430\u043b\u0435\u0432\u043e</strong>, Blaselaute \u2014 <strong>\u0441\u043b\u0435\u0432\u0430 \u043d\u0430\u043f\u0440\u0430\u0432\u043e</strong>, Zischlaute \u043d\u0435\u0441\u0443\u0442 <strong>\u043f\u0435\u0442\u043b\u044e</strong>. \u041a\u043b\u0430\u0441\u0441\u043e\u0432\u0430\u044f \u043f\u0440\u0438\u043d\u0430\u0434\u043b\u0435\u0436\u043d\u043e\u0441\u0442\u044c \u0448\u0442\u0440\u0438\u0445\u0430 \u0440\u0430\u0441\u043f\u043e\u0437\u043d\u0430\u0451\u0442\u0441\u044f \u0434\u0430\u0436\u0435 \u0432 \u0438\u0441\u043f\u043e\u0440\u0447\u0435\u043d\u043d\u043e\u043c \u043d\u0430\u0447\u0435\u0440\u0442\u0430\u043d\u0438\u0438; \u0443\u0447\u0438\u0442\u044c \u043d\u0430\u0434\u043e \u043d\u0435 \u043d\u0430\u0447\u0435\u0440\u0442\u0430\u043d\u0438\u044f, \u0430 \u0438\u0445 \u043e\u0441\u043d\u043e\u0432\u0430\u043d\u0438\u044f (\u00ab\u2026es gew\u00e4hrt beim Lesen der Schrift unglaubliche Erleichterung, wenn man best\u00e4ndig des Grundes bewusst ist, auf welchen die Form des Zeichens sich st\u00fctzt\u00bb).</p><h3>2.2.4. \u0421\u0432\u043e\u0434\u043d\u0430\u044f \u0441\u0435\u0442\u043a\u0430 \u0430\u043b\u0444\u0430\u0432\u0438\u0442\u0430 (\u00abzu \u00a76 am Schlu\u00dfe\u00bb, \u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 2 = PDF 177 = MDZ 00178)</h3><p><img loading=\"lazy\" src=\"tutorial_img/systemtabelle_1850_S2_mdz.png\" alt=\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0442\u0430\u0431\u043b\u0438\u0446\u0430 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u0430\u0440\u043d\u044b\u0445 \u0448\u0442\u0440\u0438\u0445\u043e\u0432\" tabindex=\"0\" role=\"button\"></p><p>\u0412\u0435\u0441\u044c \u043a\u043e\u043d\u0441\u043e\u043d\u0430\u043d\u0442\u0438\u0437\u043c \u2014 \u043c\u0430\u0442\u0440\u0438\u0446\u0430 3\u00d75: \u0441\u0442\u0440\u043e\u043a\u0430 = \u043a\u043b\u0430\u0441\u0441 (\u044d\u043b\u0435\u043c\u0435\u043d\u0442\u0430\u0440\u043d\u044b\u0439 \u0448\u0442\u0440\u0438\u0445), \u0441\u0442\u043e\u043b\u0431\u0435\u0446 = \u043e\u043f\u0435\u0440\u0430\u0446\u0438\u044f \u043d\u0430\u0434 \u0448\u0442\u0440\u0438\u0445\u043e\u043c.</p><div class=\"table-scroll\"><table><tr><th>\u041a\u043b\u0430\u0441\u0441 \\ \u043e\u043f\u0435\u0440\u0430\u0446\u0438\u044f</th><th>weich (\u043c\u044f\u0433\u043a\u0438\u0439)</th><th>erh\u00e4rtet (\u043e\u0442\u0432\u0435\u0440\u0434\u0435\u0432\u0448\u0438\u0439)</th><th>elliptisch verl\u00e4ngert</th><th>gerade Richtung (\u043f\u0440\u044f\u043c\u0430\u044f)</th><th>anreihbare Fl\u00fcssige (\u0436\u0438\u0434\u043a\u0438\u0435)</th></tr><tr><td><strong>I. Haucher</strong> (\u0432\u044b\u0433\u0438\u0431 \u0441\u043f\u0440\u0430\u0432\u0430 \u043d\u0430\u043b\u0435\u0432\u043e)</td><td>h</td><td>g (+ ge-, j)</td><td>ch</td><td>t (th, d)</td><td>l, n, ng</td></tr><tr><td><strong>II. Blaser</strong> (\u0432\u044b\u0433\u0438\u0431 \u0441\u043b\u0435\u0432\u0430 \u043d\u0430\u043f\u0440\u0430\u0432\u043e)</td><td>w</td><td>b</td><td>p, pf</td><td>f, v</td><td>m</td></tr><tr><td><strong>III. Zischer</strong> (\u043f\u0435\u0442\u043b\u044f)</td><td>s</td><td>\u00df</td><td>sch</td><td>z / ts</td><td>r</td></tr></table></div><p>\u0414\u0432\u0430 \u0441\u0438\u0441\u0442\u0435\u043c\u043d\u044b\u0445 \u0441\u044e\u0440\u043f\u0440\u0438\u0437\u0430 \u0441\u0435\u0442\u043a\u0438 (\u0432 \u00a74 \u0442\u0435\u043a\u0441\u0442\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438 \u0438\u043d\u0430\u0447\u0435!): <strong>m</strong> \u043f\u0440\u0438\u043f\u0438\u0441\u0430\u043d \u043a\u0430\u043a \u00ab\u0436\u0438\u0434\u043a\u0438\u0439\u00bb \u043a Blasern (\u0433\u0443\u0431\u043d\u043e\u0439 \u0440\u0435\u0437\u043e\u043d\u0430\u043d\u0441), <strong>r</strong> \u2014 \u043a Zischern (\u043e\u0441\u0442\u0440\u044b\u0439, \u00ab\u043f\u0435\u0440\u0435\u043a\u0430\u0442\u044b\u0432\u0430\u044e\u0449\u0438\u0439\u0441\u044f\u00bb \u0437\u0432\u0443\u043a; \u0448\u0442\u0440\u0438\u0445 r \u2014 \u0442\u0430 \u0436\u0435 \u043f\u0440\u0430\u0432\u0430\u044f \u043e\u0440\u0438\u0435\u043d\u0442\u0430\u0446\u0438\u044f). \u0421\u0435\u0442\u043a\u0430 \u2014 \u0433\u043b\u0430\u0432\u043d\u0430\u044f \u0448\u043f\u0430\u0440\u0433\u0430\u043b\u043a\u0430 \u0447\u0442\u0435\u043d\u0438\u044f: \u043b\u044e\u0431\u043e\u0439 \u0438\u0441\u043f\u043e\u0440\u0447\u0435\u043d\u043d\u044b\u0439 \u0437\u043d\u0430\u043a \u0441\u043d\u0430\u0447\u0430\u043b\u0430 \u043e\u0442\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u043a \u0441\u0442\u0440\u043e\u043a\u0435 (\u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435/\u043f\u0435\u0442\u043b\u044f), \u0437\u0430\u0442\u0435\u043c \u043a \u0441\u0442\u043e\u043b\u0431\u0446\u0443 (\u0441\u0442\u0435\u043f\u0435\u043d\u044c \u043c\u043e\u0434\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438).</p><h3>2.2.5. \u041e\u0440\u0444\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0438 \u0441\u043e\u0441\u0442\u0430\u0432\u043d\u044b\u0435 \u0431\u0443\u043a\u0432\u044b (\u00a77, \u043a\u043d. \u0441\u0442\u0440. 14\u201316 = PDF 43\u201345; \u0442\u0430\u0431\u043b\u0438\u0446\u0430: \u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 2)</h3><p><img loading=\"lazy\" src=\"tutorial_img/ortho_buchstaben_S2_mdz.png\" alt=\"\u041e\u0440\u0444\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0438 \u0441\u043e\u0441\u0442\u0430\u0432\u043d\u044b\u0435 \u0431\u0443\u043a\u0432\u044b\" tabindex=\"0\" role=\"button\"></p><p>\u041f\u043e\u0440\u044f\u0434\u043e\u043a \u0432 \u0441\u0442\u0440\u043e\u043a\u0435: c, ph, ps (2 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430), sp, st (2 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430), x, y, qu.</p><ul><li><strong>c</strong> = \u0443\u043a\u043e\u0440\u043e\u0447\u0435\u043d\u043d\u043e\u0435 z (\u0434\u043e \u043b\u0438\u043d\u0438\u0438 \u0441\u0442\u0440\u043e\u043a\u0438) \u2014 \u043c\u0430\u0440\u043a\u0435\u0440 \u0438\u043d\u043e\u0441\u0442\u0440\u0430\u043d\u043d\u043e\u0433\u043e \u0441\u043b\u043e\u0432\u0430;</li><li><strong>ph</strong> = p+h \u043e\u0434\u043d\u0438\u043c \u0440\u043e\u0441\u0447\u0435\u0440\u043a\u043e\u043c (\u0434\u043b\u044f \u0440\u0435\u0434\u043a\u0438\u0445 \u0433\u0440\u0435\u0446\u0438\u0437\u043c\u043e\u0432; \u043e\u0431\u0436\u0438\u0432\u0448\u0438\u0435\u0441\u044f \u0441\u043b\u043e\u0432\u0430 \u043f\u0438\u0448\u0443\u0442\u0441\u044f \u0447\u0435\u0440\u0435\u0437 f);</li><li><strong>ps</strong> = p \u0441 \u0432\u043f\u043b\u0435\u0442\u0451\u043d\u043d\u044b\u043c s (\u0432 \u043d\u0430\u0447\u0430\u043b\u0435 \u0433\u0440\u0435\u0447\u0435\u0441\u043a\u0438\u0445 \u0441\u043b\u043e\u0432 \u2014 \u0441\u043d\u0438\u0437\u0443 \u0432\u0432\u0435\u0440\u0445);</li><li><strong>sp</strong> = sch \u0431\u0435\u0437 \u0432\u0435\u0440\u0445\u043d\u0435\u0433\u043e \u043e\u043a\u0440\u0443\u0433\u043b\u0435\u043d\u0438\u044f + p (\u0444\u043e\u043d\u0435\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0447\u0435\u0441\u0442\u043d\u043e: \u00abschp\u00bb);</li><li><strong>st</strong> = s + t \u0432\u0432\u0435\u0440\u0445; \u043f\u0440\u0438 \u043d\u0438\u0441\u0445\u043e\u0434\u044f\u0449\u0435\u043c \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0435\u043d\u0438\u0438 \u2014 \u043f\u0435\u0440\u0435\u0432\u0451\u0440\u043d\u0443\u0442\u043e\u0435. <strong>\u0420\u0430\u0437\u043b\u0438\u0447\u0435\u043d\u0438\u0435 \u0441 \u043a\u043e\u043d\u0435\u0447\u043d\u044b\u043c z: \u0443 st \u043d\u0430\u0436\u0438\u043c \u0441\u043b\u0435\u0432\u0430, \u0443 z \u2014 \u0441\u043f\u0440\u0430\u0432\u0430\u00bb</strong> (\u043a\u043d. \u0441\u0442\u0440. 15);</li><li><strong>x</strong> = k+s (\u0443\u043c\u0435\u043d\u044c\u0448\u0435\u043d\u043d\u043e\u0435), \u0437\u0430\u043e\u0434\u043d\u043e \u0434\u043b\u044f ks \u0438 chs;</li><li><strong>y</strong> = \u0443\u0432\u0435\u043b\u0438\u0447\u0435\u043d\u043d\u043e\u0435 \u0443\u0441\u0438\u043b\u0435\u043d\u043d\u043e\u0435 i;</li><li><strong>qu</strong> = g + \u043a\u0440\u044e\u0447\u043e\u043a w (\u0432\u044b\u0432\u043e\u0434\u0438\u0442\u0441\u044f \u0438\u0437 gu, \u043d\u0435 ku!).</li></ul><p>\u041f\u0440\u0438\u043d\u0446\u0438\u043f: <strong>\u00abSchreibe wie du h\u00f6rst!\u00bb</strong> \u2014 \u043e\u0431\u0436\u0438\u0432\u0448\u0438\u0435\u0441\u044f \u0441\u043b\u043e\u0432\u0430 \u043f\u0438\u0448\u0443\u0442\u0441\u044f \u0444\u043e\u043d\u0435\u0442\u0438\u0447\u0435\u0441\u043a\u0438 (Zentrum \u0447\u0435\u0440\u0435\u0437 z, Alphabet \u0447\u0435\u0440\u0435\u0437 f), \u043d\u043e \u0434\u043b\u044f \u044f\u0432\u043d\u043e \u0447\u0443\u0436\u0438\u0445 \u0441\u043b\u043e\u0432 \u043e\u0440\u0444\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0437\u043d\u0430\u043a\u0438 \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u044e\u0442\u0441\u044f \u043a\u0430\u043a \u0441\u0438\u0433\u043d\u0430\u043b \u0447\u0443\u0436\u0435\u0440\u043e\u0434\u043d\u043e\u0441\u0442\u0438: \u0447\u0438\u0442\u0430\u0442\u0435\u043b\u044c \u0441\u0440\u0430\u0437\u0443 \u0432\u0438\u0434\u0438\u0442 \u0432\u0441\u0442\u0430\u0432\u043a\u0443. \u0413\u0430\u0431\u0435\u043b\u044c\u0441\u0431\u0435\u0440\u0433\u0435\u0440 \u0446\u0438\u0442\u0438\u0440\u0443\u0435\u0442 \u0413\u043e\u0440\u0430\u0446\u0438\u044f: \u00abbrevis esse laboro, obscurus fio\u00bb (\u0441\u0442\u0430\u0440\u0430\u044e\u0441\u044c \u0431\u044b\u0442\u044c \u043a\u0440\u0430\u0442\u043a\u0438\u043c \u2014 \u0434\u0435\u043b\u0430\u044e\u0441\u044c \u0442\u0451\u043c\u043d\u044b\u043c) \u2014 \u0447\u0442\u0435\u043d\u0438\u0435 \u0435\u0441\u0442\u044c \u0446\u0435\u043b\u044c, \u043f\u0438\u0441\u044c\u043c\u043e \u043b\u0438\u0448\u044c \u0441\u0440\u0435\u0434\u0441\u0442\u0432\u043e. <em>\u0414\u043b\u044f \u0413\u0443\u0441\u0441\u0435\u0440\u043b\u044f \u044d\u0442\u043e \u043a\u0440\u0438\u0442\u0438\u0447\u043d\u043e: \u0433\u0440\u0435\u043a\u043e-\u043b\u0430\u0442\u0438\u043d\u0441\u043a\u0430\u044f \u0442\u0435\u0440\u043c\u0438\u043d\u043e\u043b\u043e\u0433\u0438\u044f (Psychologie, Ph\u00e4nomen, Philosophie\u2026) \u2014 \u0441\u043f\u043b\u043e\u0448\u043d\u0430\u044f \u0437\u043e\u043d\u0430 ps/ph-\u0440\u0435\u0448\u0435\u043d\u0438\u0439.</em></p><h3>2.2.6. \u0423\u0434\u0432\u043e\u0435\u043d\u0438\u0435 \u0431\u0443\u043a\u0432 (\u00a78) \u0438 \u0430\u043b\u0444\u0430\u0432\u0438\u0442\u043d\u0430\u044f \u0448\u043f\u0430\u0440\u0433\u0430\u043b\u043a\u0430 (\u00a79)</h3><p><img loading=\"lazy\" src=\"tutorial_img/verdopplung_S2_mdz.png\" alt=\"\u0423\u0434\u0432\u043e\u0435\u043d\u0438\u0435 \u0431\u0443\u043a\u0432\" tabindex=\"0\" role=\"button\"></p><p>\u0423\u0434\u0432\u043e\u0435\u043d\u043d\u044b\u0439 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0439 = \u043f\u0440\u043e\u0441\u0442\u043e\u0435 <strong>\u0441\u043e\u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0434\u0432\u0443\u0445 \u0437\u043d\u0430\u043a\u043e\u0432 \u0431\u0435\u0437 \u0433\u043b\u0430\u0441\u043d\u043e\u0433\u043e \u043c\u0435\u0436\u0434\u0443 \u043d\u0438\u043c\u0438</strong> (bb, dd, ff\u2026). \u0414\u043e\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0435 \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u0438: w \u0438 m \u2014 \u0441\u043b\u0438\u0442\u043d\u044b\u0439 \u0440\u043e\u0441\u0447\u0435\u0440\u043a \u0441 \u043f\u0435\u0442\u043b\u0451\u0439; n \u0438 m \u2014 \u043f\u043e\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0430 \u043e\u0434\u043d\u043e\u0433\u043e \u0437\u043d\u0430\u043a\u0430 <strong>\u043d\u0430\u0434</strong> \u0434\u0440\u0443\u0433\u0438\u043c. \u041d\u0430 \u043f\u0440\u0430\u043a\u0442\u0438\u043a\u0435 \u0443\u0434\u0432\u043e\u0435\u043d\u0438\u0435 \u0447\u0430\u0441\u0442\u043e \u0432\u043e\u0432\u0441\u0435 \u043d\u0435 \u043f\u0438\u0448\u0435\u0442\u0441\u044f (\u0438\u043c\u044f \u0431\u0443\u043a\u0432\u044b \u00ab\u0437\u0432\u0443\u0447\u0438\u0442 \u0434\u043e\u0441\u0442\u0430\u0442\u043e\u0447\u043d\u043e \u0440\u0435\u0437\u043a\u043e\u00bb): kp = Kappe, wt = Wette.</p><p><img loading=\"lazy\" src=\"tutorial_img/alphabet_ordnung_S2_mdz.png\" alt=\"\u0412\u0441\u0435 \u0437\u043d\u0430\u043a\u0438 \u0432 \u0430\u043b\u0444\u0430\u0432\u0438\u0442\u043d\u043e\u043c \u043f\u043e\u0440\u044f\u0434\u043a\u0435\" tabindex=\"0\" role=\"button\"></p><p>\u0410\u043b\u0444\u0430\u0432\u0438\u0442\u043d\u044b\u0439 \u0441\u0432\u043e\u0434 (\u00a79 F) \u2014 \u0440\u0430\u0431\u043e\u0447\u0430\u044f \u0448\u043f\u0430\u0440\u0433\u0430\u043b\u043a\u0430 \u0434\u043b\u044f \u0431\u044b\u0441\u0442\u0440\u044b\u0445 \u0441\u043f\u0440\u0430\u0432\u043e\u043a \u043f\u0440\u0438 \u0447\u0442\u0435\u043d\u0438\u0438: \u0432\u0441\u0435 \u0437\u043d\u0430\u043a\u0438 \u043e\u0442 a \u0434\u043e z \u0432 \u0447\u0435\u0442\u044b\u0440\u0435 \u0441\u0442\u0440\u043e\u043a\u0438.</p>"}, {"id": "connections", "title": "\u041a\u0430\u043a \u0441\u043e\u0435\u0434\u0438\u043d\u044f\u044e\u0442\u0441\u044f \u0437\u043d\u0430\u043a\u0438", "html": "<h3>2.3. \u0421\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0435 \u0437\u043d\u0430\u043a\u043e\u0432 I: \u0433\u043b\u0430\u0441\u043d\u044b\u0439 \u043c\u0435\u0436\u0434\u0443 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u043c\u0438 (\u00a7\u00a713\u201319, \u043a\u043d. \u0441\u0442\u0440. 24\u201331 = PDF 53\u201360; \u0442\u0430\u0431\u043b\u0438\u0446\u044b: \u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 4\u20135 = MDZ 00180\u201300181)</h3><p>\u041f\u0440\u0438\u043d\u0446\u0438\u043f \u00a713: \u0441\u0442\u0435\u043d\u043e\u0433\u0440\u0430\u0444\u0438\u044f \u2014 <strong>\u043d\u0435</strong> \u00ab\u0430\u043b\u0444\u0430\u0432\u0438\u0442 + \u043f\u0440\u0438\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u0431\u0443\u043a\u0432 \u0434\u0440\u0443\u0433 \u043a \u0434\u0440\u0443\u0433\u0443\u00bb; \u043a\u0442\u043e \u043f\u0438\u0448\u0435\u0442 \u0437\u043d\u0430\u043a\u0438 \u043f\u043e\u0434\u0440\u044f\u0434, \u043a\u0430\u043a \u0432 \u043a\u0443\u0440\u0435\u043d\u0442\u0435, \u043f\u043e\u043b\u0443\u0447\u0430\u0435\u0442 \u043b\u0438\u0448\u044c \u00ab\u0438\u0437\u043c\u0435\u043d\u0451\u043d\u043d\u0443\u044e \u0431\u0443\u043a\u0432\u0435\u043d\u043d\u0443\u044e \u0441\u043a\u043e\u0440\u043e\u043f\u0438\u0441\u044c\u00bb. \u0417\u043d\u0430\u043a\u0438 \u0440\u0430\u0441\u0441\u0447\u0438\u0442\u0430\u043d\u044b \u043d\u0430 \u0441\u043b\u0438\u044f\u043d\u0438\u0435 \u0432 \u0446\u0435\u043b\u044c\u043d\u044b\u0439 \u0440\u043e\u0441\u0447\u0435\u0440\u043a \u0441\u043b\u043e\u0432\u0430. \u00a714: \u0433\u043b\u0430\u0432\u043d\u0430\u044f \u0437\u0430\u043f\u043e\u0432\u0435\u0434\u044c \u2014 \u0433\u043b\u0430\u0441\u043d\u044b\u0439 \u043f\u043e \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u0438 <strong>\u043d\u0435 \u043f\u0438\u0441\u0430\u0442\u044c \u044f\u0432\u043d\u043e \u0432\u043e\u043e\u0431\u0449\u0435</strong>. \u0414\u043b\u044f \u044d\u0442\u043e\u0433\u043e \u043f\u044f\u0442\u044c \u043f\u0440\u0430\u0432\u0438\u043b (\u043f\u043e\u043b\u043d\u0430\u044f \u0441\u0438\u0441\u0442\u0435\u043c\u0430 \u0432\u043e\u043a\u0430\u043b\u0438\u0437\u0430\u0446\u0438\u0438):</p><p><strong>\u041f\u0440\u0430\u0432\u0438\u043b\u043e 1 (\u00a715). \u0418\u043c\u044f \u0431\u0443\u043a\u0432\u044b.</strong> \u0413\u043b\u0430\u0441\u043d\u044b\u0439, \u0437\u0432\u0443\u0447\u0430\u0449\u0438\u0439 \u0432 \u043d\u0430\u0437\u0432\u0430\u043d\u0438\u0438 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u043e\u0433\u043e (be, ge, ha, ka, el, em, en, er, es, te, we\u2026), \u0441\u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u0443\u0436\u0435 \u043e\u0431\u043e\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044b\u043c: bgn = begehen, hb = Habe, kp = Kappe, ng = eng, ztl = Zettel. \u0413\u043e\u043b\u0430\u044f \u0440\u0430\u043c\u0430 \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u00ab\u043f\u043e \u0438\u043c\u0435\u043d\u0430\u043c \u0431\u0443\u043a\u0432\u00bb, \u0441\u043b\u0443\u0445 \u043a\u043e\u0440\u0440\u0435\u043a\u0442\u0438\u0440\u0443\u0435\u0442.</p><p><strong>\u041f\u0440\u0430\u0432\u0438\u043b\u043e 2 (\u00a716). \u041c\u043e\u0434\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u044f \u0437\u043d\u0430\u043a\u0430.</strong> \u0421\u0438\u043c\u0432\u043e\u043b\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u043f\u0440\u0438\u0437\u043d\u0430\u043a\u0438 \u0443\u0440\u043e\u043a\u0430 1 \u043f\u0440\u0438\u043b\u0430\u0433\u0430\u044e\u0442\u0441\u044f \u043a \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u043e\u043c\u0443: \u043d\u0430\u0436\u0438\u043c \u0432 \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0435 = a, \u043f\u043e\u0434\u044a\u0451\u043c \u0438 \u0437\u0430\u043e\u0441\u0442\u0440\u0435\u043d\u0438\u0435 = i, \u043e\u043a\u0440\u0443\u0433\u043b\u0435\u043d\u0438\u0435 = o, \u0443\u0442\u0430\u043f\u043b\u0438\u0432\u0430\u043d\u0438\u0435 = u, \u043f\u0435\u0440\u0435\u043a\u0440\u0435\u0449\u0438\u0432\u0430\u043d\u0438\u0435 = \u00fc, \u043d\u0430\u0436\u0438\u043c \u0432\u043d\u0438\u0437\u0443 = au, \u043a\u043e\u0441\u043e\u0435 \u0440\u0430\u0441\u0442\u044f\u0436\u0435\u043d\u0438\u0435 = ei. \u041a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 de\u2013da\u2013die\u2013do\u2013du \u2014 \u0432 \u0440\u0430\u0437\u0434\u0435\u043b\u0435 2.1.</p><p><strong>\u041f\u0440\u0430\u0432\u0438\u043b\u043e 3 (\u00a717). \u0428\u043a\u0430\u043b\u0430 \u043f\u0440\u0438\u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u044f.</strong> \u0415\u0441\u043b\u0438 \u0437\u043d\u0430\u043a \u043d\u0435 \u043f\u043e\u0434\u0434\u0430\u0451\u0442\u0441\u044f \u043c\u043e\u0434\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438, \u0433\u043b\u0430\u0441\u043d\u044b\u0439 \u043a\u043e\u0434\u0438\u0440\u0443\u0435\u0442\u0441\u044f <strong>\u043c\u0435\u0441\u0442\u043e\u043c, \u0433\u0434\u0435 \u043f\u0435\u0440\u0432\u044b\u0439 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0439 \u043f\u0440\u0438\u0447\u0430\u043b\u0438\u0432\u0430\u0435\u0442 \u043a\u043e \u0432\u0442\u043e\u0440\u043e\u043c\u0443</strong> (\u0433\u043b\u0430\u0441\u043d\u044b\u0439 \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u043c\u0435\u0436\u0434\u0443 \u043d\u0438\u043c\u0438). \u0413\u043e\u0434\u044f\u0442\u0441\u044f \u00ab\u0433\u0438\u0431\u043a\u0438\u0435\u00bb l, n, r, s:</p><div class=\"table-scroll\"><table><tr><th>\u0413\u043b\u0430\u0441\u043d\u044b\u0439</th><th>\u041f\u0440\u0438\u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0435 1-\u0433\u043e \u0437\u043d\u0430\u043a\u0430 \u043a\u043e 2-\u043c\u0443</th></tr><tr><td>e</td><td>\u043d\u0430 \u0440\u043e\u0432\u043d\u043e\u0439 \u043b\u0438\u043d\u0438\u0438</td></tr><tr><td>a</td><td>\u043a \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0435</td></tr><tr><td>i</td><td>\u043a \u0432\u0435\u0440\u0445\u0443</td></tr><tr><td>o, \u00f6</td><td>\u0447\u0435\u0440\u0435\u0437 \u043e\u043a\u0440\u0443\u0433\u043b\u0435\u043d\u0438\u0435</td></tr><tr><td>u</td><td>\u043f\u043e\u0434 \u0441\u0442\u0440\u043e\u043a\u043e\u0439</td></tr><tr><td>\u00fc</td><td>\u043f\u043e\u0434 \u0441\u0442\u0440\u043e\u043a\u043e\u0439 + \u043f\u0435\u0440\u0435\u0447\u0451\u0440\u043a\u0438\u0432\u0430\u043d\u0438\u0435 \u0441\u043e\u0435\u0434\u0438\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u043c \u0448\u0442\u0440\u0438\u0445\u043e\u043c</td></tr><tr><td>au</td><td>\u043f\u043e\u0434 \u0441\u0442\u0440\u043e\u043a\u043e\u0439 + \u0441\u0438\u043b\u044c\u043d\u044b\u0439 \u043d\u0430\u0436\u0438\u043c</td></tr><tr><td>ei</td><td>\u043e\u0442 \u0440\u043e\u0432\u043d\u043e\u0439 \u043b\u0438\u043d\u0438\u0438, \u0440\u0430\u0441\u0442\u044f\u043d\u0443\u0442\u043e \u0432\u0432\u0435\u0440\u0445</td></tr></table></div><p><img loading=\"lazy\" src=\"tutorial_img/regel3_beispiele_S4_mdz.png\" alt=\"\u041f\u0440\u0430\u0432\u0438\u043b\u043e 3: \u043f\u0440\u0438\u043c\u0435\u0440\u044b leb\u2013lab\u2013lib\u2013lob\u2013lub\u2026 wel\u2013weil\" tabindex=\"0\" role=\"button\"></p><p>\u0421\u0435\u0440\u0438\u0438 \u043f\u0440\u0438\u043c\u0435\u0440\u043e\u0432 (\u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 4 \u043d\u0438\u0437): leb/lab/lib/lob/l\u00f6b/lub/l\u00fcb/laub/leib/laib/l\u00e4ub; bel/bal/bil/bol/bul/beil/beul; led/lad/lid/lod/lud/laud/leid; ben/ban/bin/Biene/B\u00fchne/bon/Bein/bannen; nem/nam/nim/nom/num; men/man/min/mon/mun/mein; wel/wal/wil/wol/w\u00f6l/wul/w\u00fcl/weil.</p><p><strong>\u041f\u0440\u0430\u0432\u0438\u043b\u043e 4 (\u00a718). \u041d\u0430\u0436\u0438\u043c = \u0443\u0434\u0430\u0440\u0435\u043d\u0438\u0435.</strong> \u0423\u0441\u0438\u043b\u0435\u043d\u0438\u0435 \u0442\u043e\u0433\u043e \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u043e\u0433\u043e, \u043d\u0430 \u0447\u044c\u0451\u043c \u0441\u043b\u043e\u0433\u0435 \u043b\u0435\u0436\u0438\u0442 \u0430\u043a\u0446\u0435\u043d\u0442: m\u00f3dern \u2194 mod\u00e9rn, M\u00f3del \u2194 Mod\u00e9ll, Kap\u00edtel \u2194 Kapit\u00e1l \u2194 Kapit\u00f3l, g\u00e9bet \u2194 Geb\u00e9t \u2194 Geb\u00edet \u2194 Geb\u00f3t, \u00c1them \u2194 At\u00f3m, d\u00e9r/d\u00e1r/d\u00edr. \u0421\u0442\u0435\u043d\u043e\u0433\u0440\u0430\u0444\u0438\u044f \u0437\u0434\u0435\u0441\u044c <strong>\u0442\u043e\u0447\u043d\u0435\u0435 \u043e\u0431\u044b\u0447\u043d\u043e\u0433\u043e \u043f\u0438\u0441\u044c\u043c\u0430</strong> \u2014 \u043e\u043d\u0430 \u043c\u0430\u0440\u043a\u0438\u0440\u0443\u0435\u0442 \u0443\u0434\u0430\u0440\u0435\u043d\u0438\u0435.</p><p><img loading=\"lazy\" src=\"tutorial_img/regel4_beispiele_S5_mdz.png\" alt=\"\u041f\u0440\u0430\u0432\u0438\u043b\u043e 4: \u043f\u0440\u0438\u043c\u0435\u0440\u044b modern\u2013mod\u00e9rn\u2026 der\u2013dar\u2013dir\" tabindex=\"0\" role=\"button\"></p><p>\u041f\u0440\u0438\u043c\u0435\u0447\u0430\u043d\u0438\u0435 \u043a \u00a718 \u2014 \u0441\u0443\u0444\u0444\u0438\u043a\u0441\u044b <strong>-ieren/-aren</strong>: \u0437\u0430\u043e\u0441\u0442\u0440\u0451\u043d\u043d\u043e-\u0443\u0434\u043b\u0438\u043d\u0451\u043d\u043d\u044b\u0439 \u0440\u043e\u0441\u0447\u0435\u0440\u043a \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u043f\u0440\u0435\u0434\u0432\u0430\u0440\u0438\u0442\u0435\u043b\u044c\u043d\u043e \u043a\u0430\u043a \u00aberen\u00bb, \u0443\u0445\u043e \u0434\u043e\u0432\u043e\u0434\u0438\u0442: datiren, studieren, referiren (\u043d\u043e: Adern, Cedern \u2014 \u0431\u0435\u0437 \u0437\u0430\u043e\u0441\u0442\u0440\u0435\u043d\u0438\u044f!).</p><p><img loading=\"lazy\" src=\"tutorial_img/regel4_anm_ieren_S5_mdz.png\" alt=\"\u041f\u0440\u0430\u0432\u0438\u043b\u043e 4, \u043f\u0440\u0438\u043c.: -ieren\" tabindex=\"0\" role=\"button\"></p><p><strong>\u041f\u0440\u0430\u0432\u0438\u043b\u043e 5 (\u00a719). Vokal-Vorderstrichchen.</strong> \u041d\u0430\u0447\u0430\u043b\u044c\u043d\u044b\u0439 \u0433\u043b\u0430\u0441\u043d\u044b\u0439 \u043e\u0431\u043e\u0437\u043d\u0430\u0447\u0430\u0435\u0442\u0441\u044f \u043c\u0430\u043b\u044b\u043c \u043f\u0435\u0440\u0435\u0434\u043d\u0438\u043c \u0448\u0442\u0440\u0438\u0448\u043a\u043e\u043c; \u043a\u0430\u043a\u043e\u0439 \u0438\u043c\u0435\u043d\u043d\u043e \u0433\u043b\u0430\u0441\u043d\u044b\u0439 \u2014 \u0434\u043e\u0441\u043a\u0430\u0436\u0443\u0442 \u043f\u0440\u0430\u0432\u0438\u043b\u0430 1\u20134 \u043d\u0430 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u043c \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u043e\u043c. \u0412\u0438\u0440\u0442\u0443\u043e\u0437\u043d\u044b\u0435 \u043c\u0438\u043d\u0438\u043c\u0430\u043b\u044c\u043d\u044b\u0435 \u043f\u0430\u0440\u044b: Alter\u2194Altar, altern\u2194Eltern, Ernte\u2194Rente, Ebbe\u2194bebe, L\u00e4rm\u2194Alarm, Sieg\u2194Essig, als\u2194lass, allen\u2194lallen, Laune\u2194Alaun, argen\u2194ragen, real\u2194Areal.</p><p><img loading=\"lazy\" src=\"tutorial_img/regel5_beispiele_S5_mdz.png\" alt=\"\u041f\u0440\u0430\u0432\u0438\u043b\u043e 5: \u043f\u0440\u0438\u043c\u0435\u0440\u044b Alter\u2013Altar\u2026 Sieg\u2013Essig\" tabindex=\"0\" role=\"button\"></p><p>\u0421\u043e\u0432\u0435\u0442 \u0413\u0430\u0431\u0435\u043b\u044c\u0441\u0431\u0435\u0440\u0433\u0435\u0440\u0430 \u0447\u0438\u0442\u0430\u0442\u0435\u043b\u044e (\u043a\u043d. \u0441\u0442\u0440. 31): \u0433\u043b\u0430\u0437 \u0434\u043e\u043b\u0436\u0435\u043d \u043f\u0440\u0438\u0443\u0447\u0438\u0442\u044c\u0441\u044f \u00ab\u043d\u0435 \u043f\u0440\u043e\u0441\u043a\u0430\u043b\u044c\u0437\u044b\u0432\u0430\u0442\u044c\u00bb \u043c\u0438\u043c\u043e \u043c\u0435\u043b\u043a\u0438\u0445 \u043f\u0440\u0438\u0437\u043d\u0430\u043a\u043e\u0432 \u2014 \u043d\u0430\u0436\u0438\u043c\u0430, \u0442\u043e\u043d\u043a\u043e\u0439 \u0447\u0430\u0441\u0442\u0438 \u0448\u0442\u0440\u0438\u0445\u0430, \u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u044f, \u043f\u0435\u0440\u0435\u0434\u043d\u0435\u0433\u043e \u0448\u0442\u0440\u0438\u0448\u043a\u0430; \u0432 \u043e\u0442\u043b\u0438\u0447\u0438\u0435 \u043e\u0442 \u043a\u0443\u0440\u0440\u0435\u043d\u0442\u0430, \u0433\u0434\u0435 \u043c\u044b \u0441\u0445\u0432\u0430\u0442\u044b\u0432\u0430\u0435\u043c \u043b\u0438\u0448\u044c \u043e\u0431\u0449\u0438\u0439 \u043e\u0431\u0440\u0430\u0437 \u0441\u043b\u043e\u0432\u0430, \u0441\u0442\u0435\u043d\u043e\u0433\u0440\u0430\u0444\u0438\u044f \u043f\u0435\u0440\u0432\u043e\u0435 \u0432\u0440\u0435\u043c\u044f \u0442\u0440\u0435\u0431\u0443\u0435\u0442 \u0441\u043b\u0435\u0434\u0438\u0442\u044c \u0437\u0430 \u043a\u0430\u0436\u0434\u044b\u043c \u0434\u0432\u0438\u0436\u0435\u043d\u0438\u0435\u043c \u043f\u0435\u0440\u0430. <em>\u042f\u0432\u043d\u0430\u044f \u0437\u0430\u043f\u0438\u0441\u044c \u0433\u043b\u0430\u0441\u043d\u043e\u0433\u043e \u043d\u0443\u0436\u043d\u0430 \u043b\u0438\u0448\u044c \u0442\u0430\u043c, \u0433\u0434\u0435 \u0431\u0435\u0437 \u043d\u0435\u0451 \u0441\u043b\u043e\u0432\u043e \u043e\u0441\u0442\u0430\u0451\u0442\u0441\u044f \u0442\u0451\u043c\u043d\u044b\u043c.</em></p><p><strong>\u041f\u0440\u0430\u0432\u0438\u043b\u043e 6 (\u00a720) \u2014 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0435\u0435 \u043f\u0440\u0430\u0432\u0438\u043b\u043e \u0432\u043e\u043a\u0430\u043b\u0438\u0437\u0430\u0446\u0438\u0438 \u0438 \u0441\u0442\u0435\u0440\u0436\u0435\u043d\u044c \u0432\u0441\u0435\u0433\u043e \u0447\u0442\u0435\u043d\u0438\u044f:</strong></p><p>\u0421\u043b\u0438\u0442\u044b \u0438\u043b\u0438 \u0432\u043f\u043b\u043e\u0442\u043d\u0443\u044e \u0441\u043e\u043c\u043a\u043d\u0443\u0442\u044b \u0434\u0432\u0430 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0445 \u0437\u043d\u0430\u043a\u0430 \u2014 <strong>\u043c\u0435\u0436\u0434\u0443 \u043d\u0438\u043c\u0438 \u043d\u0438\u0447\u0435\u0433\u043e \u043d\u0435 \u0437\u0432\u0443\u0447\u0438\u0442</strong> (\u0441\u043e\u0441\u0442\u0430\u0432\u043d\u043e\u0439 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0439: rd \u0432 Erde, st, schr\u2026). \u0420\u0430\u0437\u0434\u0435\u043b\u0435\u043d\u044b \u0432\u043e\u043b\u043e\u0441\u044f\u043d\u044b\u043c \u0448\u0442\u0440\u0438\u0445\u043e\u043c \u2014 <strong>\u043c\u0435\u0436\u0434\u0443 \u043d\u0438\u043c\u0438 \u0433\u043b\u0430\u0441\u043d\u044b\u0439</strong> (\u0434\u043b\u044f \u043d\u0430\u0447\u0430\u043b\u0430 \u0447\u0438\u0442\u0430\u0439 e, \u0441\u043b\u0443\u0445 \u0434\u043e\u043f\u0440\u0430\u0432\u0438\u0442).</p><p>\u0412\u043e\u043b\u043e\u0441\u044f\u043d\u043e\u0439 \u0448\u0442\u0440\u0438\u0445 \u2014 \u00ab\u043d\u0430\u0448 \u0432\u0441\u0435\u043e\u0431\u0449\u0438\u0439 \u0433\u043b\u0430\u0441\u043d\u044b\u0439\u00bb, \u0437\u043d\u0430\u043a \u043f\u0430\u0440\u044f\u0449\u0435\u0433\u043e \u0442\u043e\u043d\u0430. \u041e\u043f\u043f\u043e\u0437\u0438\u0446\u0438\u044f \u043f\u0440\u0438\u043c\u0435\u0440\u0430 \u00a715: <strong>rd (\u0441\u043b\u0438\u0442\u043d\u043e, \u0441 \u043f\u0440\u043e\u0434\u0451\u0440\u0433\u0438\u0432\u0430\u043d\u0438\u0435\u043c) = Erde</strong> \u2194 <strong>r\u2011e\u2011d (\u0447\u0435\u0440\u0435\u0437 \u0448\u0442\u0440\u0438\u0445) = rede</strong>. \u0412\u0441\u0435 \u0448\u0435\u0441\u0442\u044c \u043f\u0440\u0430\u0432\u0438\u043b \u2014 \u0432\u0437\u0430\u0438\u043c\u043e\u043f\u043e\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u044e\u0449\u0430\u044f \u0441\u0438\u0441\u0442\u0435\u043c\u0430: \u00abman ben\u00fctzt die eine oder die andere, je nachdem\u2026\u00bb (\u00a721).</p><h3>2.4. \u0421\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0435 \u0437\u043d\u0430\u043a\u043e\u0432 II: \u0441\u043b\u0438\u044f\u043d\u0438\u044f \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0445 (\u00a7\u00a720\u201323, \u043a\u043d. \u0441\u0442\u0440. 32\u201338 = PDF 61\u201367; \u043b\u0435\u043a\u0441\u0438\u043a\u043e\u043d: \u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 7\u201326 = MDZ 00183\u201300202)</h3><p><strong>\u041a\u0443\u0434\u0430 \u0432\u0435\u0448\u0430\u0442\u044c \u0433\u043b\u0430\u0441\u043d\u044b\u0439 (\u00a721):</strong> \u043f\u0440\u0435\u0434\u043f\u043e\u0447\u0442\u0438\u0442\u0435\u043b\u044c\u043d\u043e <strong>\u043d\u0430 \u043f\u043e\u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0439</strong> (Auslaut) \u2014 \u0433\u043b\u0430\u0437 \u0443\u0441\u043f\u0435\u0432\u0430\u0435\u0442 \u043f\u043e\u0434\u0433\u043e\u0442\u043e\u0432\u0438\u0442\u044c\u0441\u044f; \u0435\u0441\u043b\u0438 \u0442\u043e\u0442 \u043d\u0435 \u043f\u043e\u0434\u0434\u0430\u0451\u0442\u0441\u044f \u043c\u043e\u0434\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438 \u2014 \u043d\u0430 \u043f\u0440\u0435\u0434\u044b\u0434\u0443\u0449\u0438\u0439 (Anlaut); \u0435\u0441\u043b\u0438 \u043e\u0431\u0430 \u043d\u0435\u0433\u0438\u0431\u043a\u0438 \u2014 \u0448\u043a\u0430\u043b\u043e\u0439 \u043f\u0440\u0438\u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u044f (\u043f\u0440\u0430\u0432\u0438\u043b\u043e 3). \u042d\u0442\u043e \u0440\u0435\u0448\u0430\u0435\u0442 \u0438 \u043d\u0430\u0448 \u0434\u0430\u0432\u043d\u0438\u0439 \u0432\u043e\u043f\u0440\u043e\u0441 \u043e <em>Tag</em>: \u043f\u0440\u0438\u0437\u043d\u0430\u043a a \u043d\u0435\u0441\u0451\u0442 <strong>g</strong>, \u0430 \u043d\u0435 t.</p><p><strong>\u041f\u0440\u0438\u043d\u0446\u0438\u043f \u0441\u043b\u0438\u044f\u043d\u0438\u044f (\u00a722):</strong> \u00ab\u0447\u0442\u043e \u0440\u043e\u0442 \u043f\u0440\u043e\u0438\u0437\u043d\u043e\u0441\u0438\u0442 \u043e\u0434\u043d\u0438\u043c \u0440\u0430\u0437\u043e\u043c, \u0442\u043e \u0438 \u043f\u0435\u0440\u043e \u0434\u043e\u043b\u0436\u043d\u043e \u0437\u0430\u0432\u0435\u0440\u0448\u0430\u0442\u044c \u043e\u0434\u043d\u0438\u043c \u043e\u0431\u0449\u0438\u043c \u0440\u043e\u0441\u0447\u0435\u0440\u043a\u043e\u043c\u00bb. \u041f\u0440\u043e\u0441\u0442\u043e\u0435 \u043f\u0440\u0438\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u0437\u043d\u0430\u043a\u043e\u0432 \u0447\u0435\u0440\u0435\u0437 \u043f\u0443\u0441\u0442\u044b\u0435 \u0441\u043e\u0435\u0434\u0438\u043d\u0438\u0442\u0435\u043b\u0438 \u2014 \u00ab\u043d\u0435 \u0441\u0442\u0435\u043d\u043e\u0433\u0440\u0430\u0444\u0438\u044f, \u0430 \u0438\u0437\u043c\u0435\u043d\u0451\u043d\u043d\u0430\u044f \u0431\u0443\u043a\u0432\u0435\u043d\u043d\u0430\u044f \u0441\u043a\u043e\u0440\u043e\u043f\u0438\u0441\u044c\u00bb: \u0433\u0438\u0431\u043d\u0435\u0442 \u0441\u0430\u043c\u0430 \u0446\u0435\u043b\u044c, \u044d\u043a\u043e\u043d\u043e\u043c\u0438\u044f \u0432\u0440\u0435\u043c\u0435\u043d\u0438 \u0438 \u043f\u0440\u043e\u0441\u0442\u0440\u0430\u043d\u0441\u0442\u0432\u0430.</p><p><strong>\u041b\u0435\u043a\u0441\u0438\u043a\u043e\u043d \u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0439 (\u00a723, \u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 7\u201326).</strong> \u0421\u0432\u043e\u0434\u043d\u0430\u044f Combinations-Tafel (Lit. I) \u0430\u0432\u0442\u043e\u0440\u0443 \u043c\u0430\u043b\u043e\u0301: \u0440\u0435\u0430\u043b\u044c\u043d\u044b\u0435 \u043f\u043e\u0442\u0440\u0435\u0431\u043d\u043e\u0441\u0442\u0438 \u0434\u0438\u043a\u0442\u0443\u0435\u0442 \u044f\u0437\u044b\u043a, \u0433\u0434\u0435 \u0432 \u0441\u043b\u043e\u0433\u0435 \u0441\u0445\u043e\u0434\u044f\u0442\u0441\u044f \u0438 5\u20136 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0445. \u041f\u043e\u044d\u0442\u043e\u043c\u0443 \u2014 \u00ab\u0441\u0432\u043e\u0435\u0433\u043e \u0440\u043e\u0434\u0430 \u043b\u0435\u043a\u0441\u0438\u043a\u043e\u043d\u00bb \u0432\u0441\u0435\u0445 \u0437\u043d\u0430\u0447\u0438\u043c\u044b\u0445 \u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0439, \u043f\u0440\u043e\u0433\u043d\u0430\u043d\u043d\u044b\u0439 <strong>\u0447\u0435\u0440\u0435\u0437 \u0432\u0435\u0441\u044c \u0430\u043b\u0444\u0430\u0432\u0438\u0442</strong>, \u0441 \u0435\u0434\u0438\u043d\u043e\u0439 \u0441\u0445\u0435\u043c\u043e\u0439 \u0441\u0442\u0430\u0442\u044c\u0438:</p><ul><li><strong>I.</strong> \u0437\u043d\u0430\u043a \u0431\u0443\u043a\u0432\u044b + \u0435\u0433\u043e \u0437\u0438\u0433\u043b-\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u044f;</li><li><strong>II.</strong> \u0431\u0443\u043a\u0432\u0430 \u0441 \u0433\u043b\u0430\u0441\u043d\u044b\u043c\u0438 (\u0432\u043f\u0435\u0440\u0451\u0434 \u0438 \u043d\u0430\u0437\u0430\u0434, \u044f\u0432\u043d\u043e \u0438 \u0441\u0438\u043c\u0432\u043e\u043b\u0438\u0447\u0435\u0441\u043a\u0438);</li><li><strong>III.</strong> \u0431\u0443\u043a\u0432\u0430 \u0441 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u043c\u0438: 1) \u0432 \u0430\u043d\u043b\u0430\u0443\u0442\u0435, 2) \u0432 \u043a\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0432\u0442\u043e\u0440\u043e\u0433\u043e, \u2014 \u0438 \u0432\u0441\u044e\u0434\u0443 \u043f\u0430\u0440\u0430\u043c\u0438: (a) \u043d\u0435\u043f\u043e\u0441\u0440\u0435\u0434\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0439 \u0441\u043e\u0441\u0442\u0430\u0432\u043d\u043e\u0439 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0439 (Zsg. K.) \u2194 (b) \u043e\u043f\u043e\u0441\u0440\u0435\u0434\u043e\u0432\u0430\u043d\u043d\u044b\u0439, \u0441 \u0433\u043b\u0430\u0441\u043d\u044b\u043c \u0432\u043d\u0443\u0442\u0440\u0438 (S. K.).</li></ul><p>\u041f\u0435\u0440\u0432\u043e\u0439 \u0440\u0430\u0437\u043e\u0431\u0440\u0430\u043d\u0430 <strong>R</strong> \u2014 \u00ab\u0441\u0430\u043c\u0430\u044f \u0441\u043e\u0435\u0434\u0438\u043d\u0438\u043c\u0430\u044f \u0438\u0437 \u0432\u0441\u0435\u0445 \u0431\u0443\u043a\u0432\u00bb (\u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 7\u20138):</p><p><img loading=\"lazy\" src=\"tutorial_img/r_lexikon_kopf_S7_mdz.png\" alt=\"\u041b\u0435\u043a\u0441\u0438\u043a\u043e\u043d, \u0431\u0443\u043a\u0432\u0430 R: \u0437\u043d\u0430\u043a, \u0437\u0438\u0433\u043b\u044b, R \u0441 \u0433\u043b\u0430\u0441\u043d\u044b\u043c\u0438\" tabindex=\"0\" role=\"button\"></p><p><img loading=\"lazy\" src=\"tutorial_img/r_lexikon_rb_br_S7_mdz.png\" alt=\"\u041b\u0435\u043a\u0441\u0438\u043a\u043e\u043d, \u0431\u0443\u043a\u0432\u0430 R: \u0441\u0435\u0440\u0438\u0438 rb \u0438 br\" tabindex=\"0\" role=\"button\"></p><p>\u041f\u0435\u0447\u0430\u0442\u043d\u044b\u0439 \u043a\u043e\u043c\u043c\u0435\u043d\u0442\u0430\u0440\u0438\u0439 (\u043a\u043d. \u0441\u0442\u0440. 38 \u0441\u043b.) \u0438\u0434\u0451\u0442 <strong>\u043d\u043e\u043c\u0435\u0440 \u0432 \u043d\u043e\u043c\u0435\u0440</strong> \u0441 \u043f\u0440\u0438\u043c\u0435\u0440\u0430\u043c\u0438 \u0442\u0430\u0431\u043b\u0438\u0446 \u2014 \u043a\u0430\u043a \u00a7-\u0441\u0438\u0441\u0442\u0435\u043c\u0430 \u00ab\u043f\u0435\u0447\u0430\u0442\u044c \u2194 \u043b\u0438\u0442\u043e\u0433\u0440\u0430\u0444\u0438\u044f\u00bb, \u0442\u043e\u043b\u044c\u043a\u043e \u043c\u0435\u043b\u044c\u0447\u0435. \u0421\u043e\u043a\u0440\u0430\u0449\u0435\u043d\u0438\u044f \u043a\u043e\u043c\u043c\u0435\u043d\u0442\u0430\u0440\u0438\u044f: Zsg. K. = \u0441\u043e\u0441\u0442\u0430\u0432\u043d\u043e\u0439 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0439; S. K. = \u0441\u043b\u043e\u0433\u043e\u0432\u043e\u0439 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0439 (\u0441 \u0433\u043b\u0430\u0441\u043d\u044b\u043c \u0432\u043d\u0443\u0442\u0440\u0438); vokls. = \u0432\u043e\u043a\u0430\u043b\u0438\u0437\u043e\u0432\u0430\u043d\u043e; V.S./N.S. = \u043f\u0440\u0438\u0441\u0442\u0430\u0432\u043a\u0430/\u0441\u0443\u0444\u0444\u0438\u043a\u0441; Sg. = \u0437\u0438\u0433\u043b; Mg. = \u043c\u043e\u043d\u043e\u0433\u0440\u0430\u043c\u043c\u0430; Untersch. = \u0440\u0430\u0437\u043b\u0438\u0447\u0435\u043d\u0438\u0435; dgg. = dagegen.</p><p><strong>\u041a\u0430\u043a \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u044c\u0441\u044f:</strong> \u043b\u0435\u043a\u0441\u0438\u043a\u043e\u043d \u043d\u0435 \u0437\u0430\u0443\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u2014 \u044d\u0442\u043e \u0441\u043f\u0440\u0430\u0432\u043e\u0447\u043d\u0438\u043a. \u041f\u0440\u0438 \u0447\u0442\u0435\u043d\u0438\u0438 \u0442\u0451\u043c\u043d\u043e\u0433\u043e \u043c\u0435\u0441\u0442\u0430 \u0432 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438: \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u044c \u043a\u043b\u0430\u0441\u0441\u044b \u0448\u0442\u0440\u0438\u0445\u043e\u0432 \u2192 \u043d\u0430\u0439\u0442\u0438 \u0441\u0442\u0430\u0442\u044c\u044e \u043f\u0435\u0440\u0432\u043e\u0439 \u0431\u0443\u043a\u0432\u044b \u2192 \u043f\u0440\u043e\u0441\u043c\u043e\u0442\u0440\u0435\u0442\u044c \u0441\u0435\u0440\u0438\u044e \u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0439. \u0414\u0438\u0430\u043f\u0430\u0437\u043e\u043d (\u0443\u0442\u043e\u0447\u043d\u0435\u043d\u043e 15.07): \u0441\u0442\u0430\u0442\u044c\u0438 \u0438\u0434\u0443\u0442 \u0432 \u043f\u043e\u0440\u044f\u0434\u043a\u0435 R, B, D\u2026 (N \u2014 \u043d\u0430 \u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 27, W \u2014 \u043e\u043a. \u0441\u0442\u0440. 34) \u2014 \u0438\u0442\u043e\u0433\u043e <strong>\u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 7\u2013~35 = MDZ 00183\u2013~00211</strong>; K \u0441\u043e \u00abSchema\u00bb \u0441\u043e\u0441\u0442\u0430\u0432\u043d\u044b\u0445 \u0441 r \u2014 \u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 22\u201323 (MDZ 198\u2013199).</p><h3>2.5. \u0413\u0440\u0430\u0444\u0438\u043a\u0430 \u0441\u0442\u0440\u043e\u043a\u0438: \u0441\u0438\u0441\u0442\u0435\u043c\u0430 \u043a\u043e\u043e\u0440\u0434\u0438\u043d\u0430\u0442 \u043f\u0438\u0441\u044c\u043c\u0430 (\u0441\u0438\u043d\u0442\u0435\u0437 \u0443\u0440\u043e\u043a\u043e\u0432 1\u20138)</h3><p>\u0423 \u0413\u0430\u0431\u0435\u043b\u044c\u0441\u0431\u0435\u0440\u0433\u0435\u0440\u0430 \u043d\u0435\u0442 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u0439 \u0433\u043b\u0430\u0432\u044b \u00ab\u043e \u0441\u0442\u0440\u043e\u043a\u0435\u00bb \u2014 \u043d\u043e \u0432\u0441\u044f \u0441\u0438\u0441\u0442\u0435\u043c\u0430 \u043c\u043e\u043b\u0447\u0430\u043b\u0438\u0432\u043e \u043e\u043f\u0438\u0440\u0430\u0435\u0442\u0441\u044f \u043d\u0430 \u0447\u0435\u0442\u044b\u0440\u0435 \u043e\u0441\u0438, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u043c\u044b \u0441\u043e\u0431\u0440\u0430\u043b\u0438 \u043f\u043e \u0447\u0430\u0441\u0442\u044f\u043c. \u0421\u0432\u043e\u0434\u043a\u0430 \u0434\u043b\u044f \u0447\u0442\u0435\u043d\u0438\u044f \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438:</p><p><strong>1. \u0412\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c (\u044f\u0440\u0443\u0441\u044b).</strong> \u0411\u0430\u0437\u043e\u0432\u0430\u044f \u0435\u0434\u0438\u043d\u0438\u0446\u0430 \u0432\u044b\u0441\u043e\u0442\u044b \u2014 \u00abm-\u0448\u0442\u0440\u0438\u0445\u00bb (\u0433\u0440\u0435\u0431\u0435\u043d\u044c \u0432\u043e\u043b\u043d\u044b n/m). \u0427\u0435\u0442\u044b\u0440\u0435 \u0437\u043e\u043d\u044b:</p><div class=\"table-scroll\"><table><tr><th>\u0417\u043e\u043d\u0430</th><th>\u0427\u0442\u043e \u0442\u0430\u043c \u0436\u0438\u0432\u0451\u0442</th></tr><tr><td><strong>\u043d\u0430\u0434 \u0441\u0442\u0440\u043e\u043a\u043e\u0439</strong> (\u0441\u0432\u043e\u0431\u043e\u0434\u043d\u043e \u043f\u0430\u0440\u0438\u0442)</td><td>\u0433\u0440\u0430\u043c\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0437\u0438\u0433\u043b\u044b: war, ist, worden, wurde, w\u00fcrde, bin, sind, sein, werden, w\u00e4re, des, dem, den, einen\u2026</td></tr><tr><td><strong>\u0432\u0435\u0440\u0445\u043d\u0438\u0439 \u044f\u0440\u0443\u0441</strong> (+\u2153 \u0432\u044b\u0441\u043e\u0442\u044b)</td><td>\u043f\u0440\u0438\u0437\u043d\u0430\u043a i/ie (\u043f\u0440\u0430\u0432\u0438\u043b\u0430 2\u20133); \u0443\u0434\u043b\u0438\u043d\u0435\u043d\u0438\u044f ch, th; \u0432\u0435\u0440\u0445\u043d\u0438\u0435 \u0432\u044b\u0445\u043e\u0434\u044b</td></tr><tr><td><strong>\u0441\u0442\u0440\u043e\u043a\u0430</strong> (\u0431\u0430\u0437\u043e\u0432\u0430\u044f \u043b\u0438\u043d\u0438\u044f)</td><td>\u043d\u0435\u0439\u0442\u0440\u0430\u043b\u044c\u043d\u043e\u0435 \u043f\u0438\u0441\u044c\u043c\u043e = \u0432\u043e\u043a\u0430\u043b\u0438\u0437\u0430\u0446\u0438\u044f e; \u0431\u043e\u043b\u044c\u0448\u0438\u043d\u0441\u0442\u0432\u043e \u0437\u043d\u0430\u043a\u043e\u0432</td></tr><tr><td><strong>\u043f\u043e\u0434 \u0441\u0442\u0440\u043e\u043a\u043e\u0439</strong></td><td>\u043f\u0440\u0438\u0437\u043d\u0430\u043a u/\u00fc/au; \u0445\u0432\u043e\u0441\u0442\u044b f, p, sch, \u043d\u0430\u0447\u0430\u043b\u044c\u043d\u043e\u0433\u043e z</td></tr></table></div><p><strong>2. \u041d\u0430\u0436\u0438\u043c (Schattenlage).</strong> \u0416\u0438\u0440\u043d\u043e\u0435 \u043f\u0440\u043e\u0442\u0438\u0432 \u0432\u043e\u043b\u043e\u0441\u044f\u043d\u043e\u0433\u043e: a (\u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0430 \u0444\u0438\u0433\u0443\u0440\u044b), au (\u043d\u0438\u0437), \u0443\u0434\u0430\u0440\u043d\u044b\u0439 \u0441\u043b\u043e\u0433 (\u043f\u0440\u0430\u0432\u0438\u043b\u043e 4), \u0443\u0441\u0438\u043b\u0435\u043d\u0438\u0435 \u00df \u043f\u0440\u043e\u0442\u0438\u0432 s, y \u043f\u0440\u043e\u0442\u0438\u0432 i, ge- \u043f\u0440\u043e\u0442\u0438\u0432 t. \u041f\u043b\u044e\u0441 <em>\u0441\u0442\u043e\u0440\u043e\u043d\u0430</em> \u043d\u0430\u0436\u0438\u043c\u0430: pf \u0438 st \u2014 \u0442\u0435\u043d\u044c \u0441\u043b\u0435\u0432\u0430, \u043a\u043e\u043d\u0435\u0447\u043d\u043e\u0435 z \u2014 \u0441\u043f\u0440\u0430\u0432\u0430.</p><p><strong>3. \u0424\u043e\u0440\u043c\u0430 \u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u044f.</strong> \u041f\u0443\u0441\u0442\u043e\u0439 \u0432\u043e\u043b\u043e\u0441\u044f\u043d\u043e\u0439 \u0448\u0442\u0440\u0438\u0445 = e (\u0438\u043b\u0438 \u00ab\u0437\u0434\u0435\u0441\u044c \u0433\u043b\u0430\u0441\u043d\u044b\u0439\u00bb, \u043f\u0440\u0430\u0432\u0438\u043b\u043e 6); \u043a\u043e\u0441\u043e\u0435 \u0432\u043e\u0441\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u0435 = ei; \u043e\u043a\u0440\u0443\u0433\u043b\u0435\u043d\u0438\u0435 = o; \u043f\u0435\u0440\u0435\u043a\u0440\u0435\u0449\u0438\u0432\u0430\u043d\u0438\u0435 = \u00fc; \u0441\u043b\u0438\u0442\u043d\u043e\u0441\u0442\u044c \u0431\u0435\u0437 \u0448\u0442\u0440\u0438\u0445\u0430 = \u0441\u043e\u0441\u0442\u0430\u0432\u043d\u043e\u0439 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0439.</p><p><strong>4. \u0420\u0430\u0437\u043c\u0435\u0440.</strong> \u041a\u0440\u043e\u0448\u0435\u0447\u043d\u043e\u0435 i = ich \u043f\u0440\u043e\u0442\u0438\u0432 \u043e\u0431\u044b\u0447\u043d\u043e\u0433\u043e i = in/ist; \u043c\u0430\u043b\u043e\u0435 s \u043d\u0430\u0434 \u0441\u0442\u0440\u043e\u043a\u043e\u0439 = des; \u0443\u0432\u0435\u043b\u0438\u0447\u0435\u043d\u043d\u043e\u0435 u = ur-.</p><p>\u0427\u0442\u0435\u043d\u0438\u0435 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438 \u2014 \u044d\u0442\u043e \u043f\u043e\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0439 \u043e\u043f\u0440\u043e\u0441 \u043e\u0441\u0435\u0439: <em>\u0433\u0434\u0435</em> \u0437\u043d\u0430\u043a \u0441\u0442\u043e\u0438\u0442, <em>\u0447\u0442\u043e</em> \u0432 \u043d\u0451\u043c \u0436\u0438\u0440\u043d\u043e, <em>\u043a\u0430\u043a</em> \u043e\u043d \u043f\u0440\u0438\u0447\u0430\u043b\u0435\u043d \u043a \u0441\u043e\u0441\u0435\u0434\u044f\u043c, <em>\u043a\u0430\u043a\u043e\u0433\u043e</em> \u043e\u043d \u0440\u0430\u0437\u043c\u0435\u0440\u0430. \u041d\u0438 \u043e\u0434\u043d\u0430 \u043e\u0441\u044c \u0432 \u0431\u0435\u0433\u043b\u043e\u043c \u043f\u0438\u0441\u044c\u043c\u0435 \u043d\u0435 \u0431\u044b\u0432\u0430\u0435\u0442 \u043d\u0430\u0434\u0451\u0436\u043d\u043e\u0439 \u043f\u043e\u043e\u0434\u0438\u043d\u043e\u0447\u043a\u0435 \u2014 \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u0438\u0445 \u0441\u0443\u043c\u043c\u0430 \u043f\u043b\u044e\u0441 \u044f\u0437\u044b\u043a.</p>"}, {"id": "abbreviation", "title": "\u0422\u0440\u0438 \u0443\u0440\u043e\u0432\u043d\u044f \u0441\u043e\u043a\u0440\u0430\u0449\u0435\u043d\u0438\u044f", "html": "<h3>4. \u0423\u0440\u043e\u0432\u043d\u0438 \u0441\u043e\u043a\u0440\u0430\u0449\u0435\u043d\u0438\u044f: \u0430\u0440\u0445\u0438\u0442\u0435\u043a\u0442\u0443\u0440\u0430 \u0441\u0438\u0441\u0442\u0435\u043c\u044b</h3><p>\u0422\u0435\u0440\u043c\u0438\u043d\u044b \u00abVerkehrsschrift/Debattenschrift\u00bb \u2014 \u043f\u043e\u0437\u0434\u043d\u0435\u0439\u0448\u0430\u044f \u0448\u043a\u043e\u043b\u044c\u043d\u0430\u044f \u043d\u043e\u043c\u0435\u043d\u043a\u043b\u0430\u0442\u0443\u0440\u0430 (\u043f\u043e\u0441\u043b\u0435 \u0440\u0435\u0444\u043e\u0440\u043c 1857/1895); \u0432 G1850 \u0442\u0430 \u0436\u0435 \u043b\u0435\u0441\u0442\u043d\u0438\u0446\u0430 \u043e\u043f\u0438\u0441\u0430\u043d\u0430 \u0442\u0440\u0451\u0445\u0447\u0430\u0441\u0442\u043d\u043e\u0439 \u0430\u0440\u0445\u0438\u0442\u0435\u043a\u0442\u0443\u0440\u043e\u0439 \u043a\u043d\u0438\u0433\u0438:</p><div class=\"table-scroll\"><table><tr><th>\u0420\u0430\u0437\u0434\u0435\u043b G1850</th><th>\u0423\u0440\u043e\u0432\u0435\u043d\u044c \u0441\u0436\u0430\u0442\u0438\u044f</th><th>\u0413\u0434\u0435</th></tr><tr><td><strong>I. Schriftk\u00fcrzung</strong></td><td><em>\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u043e\u0435</em> \u0441\u0436\u0430\u0442\u0438\u0435: \u0430\u043b\u0444\u0430\u0432\u0438\u0442, \u0448\u0435\u0441\u0442\u044c \u043f\u0440\u0430\u0432\u0438\u043b \u0432\u043e\u043a\u0430\u043b\u0438\u0437\u0430\u0446\u0438\u0438, \u0441\u043b\u0438\u044f\u043d\u0438\u044f, \u0437\u0438\u0433\u043b\u044b</td><td>\u043a\u043d. \u0441\u0442\u0440. 1\u201382; \u043f\u0440\u043e\u0439\u0434\u0435\u043d \u043f\u043e\u043b\u043d\u043e\u0441\u0442\u044c\u044e (\u0440\u0430\u0437\u0434\u0435\u043b\u044b 2\u20133 \u0437\u0430\u043f\u0438\u0441\u043a\u0438)</td></tr><tr><td><strong>II. Etymologische Schreibk\u00fcrzung</strong></td><td><em>\u043c\u043e\u0440\u0444\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0435</em> \u0441\u0436\u0430\u0442\u0438\u0435: \u043f\u0440\u0438\u0441\u0442\u0430\u0432\u043a\u0438 (Vorsylben), \u0441\u0443\u0444\u0444\u0438\u043a\u0441\u044b (Nachsylben: -lich, -bar, -sam, -isch, -haft\u2026), \u0441\u043a\u043b\u043e\u043d\u0435\u043d\u0438\u0435, \u0441\u043f\u0440\u044f\u0436\u0435\u043d\u0438\u0435 \u2014 \u043e\u043f\u0443\u0441\u043a\u0430\u043d\u0438\u0435/\u0441\u0432\u0451\u0440\u0442\u044b\u0432\u0430\u043d\u0438\u0435 \u043c\u043e\u0440\u0444\u0435\u043c</td><td>\u0441 PDF 112 (\u043a\u043d. \u0441\u0442\u0440. 83); \u0441\u0442\u0435\u043d\u043e-\u0442\u0430\u0431\u043b\u0438\u0446\u044b ~\u0441\u0442\u0440. 40\u201352 (MDZ ~216\u2013230)</td></tr><tr><td><strong>III. Syntaktische Schreibk\u00fcrzung</strong></td><td><em>\u0441\u0438\u043d\u0442\u0430\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u043e\u0435</em> \u0441\u0436\u0430\u0442\u0438\u0435: \u043e\u043f\u0443\u0441\u043a\u0430\u043d\u0438\u0435 \u0432\u0441\u0435\u0433\u043e, \u0447\u0442\u043e \u0432\u043e\u0441\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u043c\u043e \u0438\u0437 \u0441\u0442\u0440\u043e\u044f \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u044f</td><td>\u0441 PDF 132 (\u043a\u043d. \u0441\u0442\u0440. 103); \u044d\u043f\u0438\u0433\u0440\u0430\u0444 \u0440\u0430\u0437\u0434\u0435\u043b\u0430 \u2014 \u00abAccidentia cernis, substantia manet invisibilis\u2026\u00bb</td></tr></table></div><p>\u0421\u043e\u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0438\u0435 \u043f\u043e\u0437\u0434\u043d\u0438\u043c \u0442\u0435\u0440\u043c\u0438\u043d\u0430\u043c: <strong>Verkehrsschrift</strong> \u2248 \u0443\u0440\u043e\u0432\u043d\u0438 I\u2013II (\u043f\u043e\u043b\u043d\u0430\u044f \u00ab\u043f\u0435\u0440\u0435\u043f\u0438\u0441\u043e\u0447\u043d\u0430\u044f\u00bb \u0437\u0430\u043f\u0438\u0441\u044c), <strong>Debattenschrift</strong> \u2248 \u0430\u0433\u0440\u0435\u0441\u0441\u0438\u0432\u043d\u043e \u043f\u0440\u0438\u043c\u0435\u043d\u0451\u043d\u043d\u044b\u0439 \u0443\u0440\u043e\u0432\u0435\u043d\u044c III. <strong>\u0413\u0443\u0441\u0441\u0435\u0440\u043b\u044c \u043f\u0438\u0448\u0435\u0442 \u043d\u0430 \u0443\u0440\u043e\u0432\u043d\u0435 III</strong> \u0441 \u043b\u0438\u0447\u043d\u044b\u043c\u0438 \u0437\u0438\u0433\u043b\u0430\u043c\u0438 \u043f\u043e\u0432\u0435\u0440\u0445: \u043e\u043f\u0443\u0449\u0435\u043d\u043d\u044b\u0435 \u043e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u044f, \u0441\u0432\u0451\u0440\u043d\u0443\u0442\u044b\u0435 \u043c\u043e\u0440\u0444\u0435\u043c\u044b, \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442\u043d\u044b\u0435 \u0441\u043e\u043a\u0440\u0430\u0449\u0435\u043d\u0438\u044f. \u0421\u0442\u0440\u0430\u0442\u0435\u0433\u0438\u044f \u0424\u0430\u0437\u044b 2: \u0440\u0430\u0437\u0434\u0435\u043b\u044b II\u2013III \u043d\u0435 \u043a\u043e\u043d\u0441\u043f\u0435\u043a\u0442\u0438\u0440\u0443\u044e\u0442\u0441\u044f \u0446\u0435\u043b\u0438\u043a\u043e\u043c \u2014 \u0438\u0437 \u043d\u0438\u0445 \u0431\u0435\u0440\u0443\u0442\u0441\u044f \u0442\u043e\u0447\u0435\u0447\u043d\u044b\u0435 \u0441\u043f\u0440\u0430\u0432\u043a\u0438 \u043f\u043e \u043c\u0435\u0440\u0435 \u0432\u0441\u0442\u0440\u0435\u0447\u0438 \u0432 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u044f\u0445 (\u043f\u0435\u0440\u0432\u043e\u043e\u0447\u0435\u0440\u0451\u0434\u043d\u043e: \u0442\u0430\u0431\u043b\u0438\u0446\u044b Vor-/Nachsylben).</p><p>\u0414\u0438\u0430\u0433\u043d\u043e\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0440\u0430\u043c\u043a\u0430 \u0434\u043b\u044f \u043b\u0438\u0441\u0442\u0430 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438: <em>\u043a\u0430\u043a\u043e\u0439 \u0443\u0440\u043e\u0432\u0435\u043d\u044c \u0441\u0436\u0430\u0442\u0438\u044f \u043f\u0435\u0440\u0435\u0434\u043e \u043c\u043d\u043e\u0439?</em> \u041f\u043e\u043b\u043d\u044b\u0435 \u0440\u0430\u043c\u044b \u0441 \u0432\u043e\u043a\u0430\u043b\u0438\u0437\u0430\u0446\u0438\u0435\u0439 (I) \u2192 \u0441\u0432\u0451\u0440\u043d\u0443\u0442\u044b\u0435 \u043c\u043e\u0440\u0444\u0435\u043c\u044b (II) \u2192 \u0441\u043a\u0435\u043b\u0435\u0442\u044b \u0444\u0440\u0430\u0437 (III
