<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Зиглы Гуссерля · A V 21</title>
<style>
:root{
  --bg:#faf9f7; --panel:#f3f1ec; --card:#fff; --fg:#1c2228; --mut:#6d7783; --faint:#96a0ab;
  --line:#e3e0da; --line2:#d3cfc7; --acc:#31465c; --acc-soft:#e8edf3; --hi:#ffeaa0;
  --shadow:0 1px 2px rgba(28,34,40,.05);
  --r:9px; --sidew:250px; --topw:58px;
}
:root[data-t="dark"]{
  --bg:#14171b; --panel:#1b1f25; --card:#1c2127; --fg:#e7e7e5; --mut:#98a2ad; --faint:#6e7883;
  --line:#2a3037; --line2:#39414a; --acc:#a8c0d8; --acc-soft:#232c37; --hi:#63521a;
  --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit}
button,select,input{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;height:var(--topw);display:flex;align-items:center;gap:14px;
  padding:0 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:640;letter-spacing:.005em;white-space:nowrap}
.brand span{color:var(--faint);font-weight:400;margin-left:8px;font-size:12.5px}
.tabs{display:flex;gap:2px;background:var(--panel);padding:3px;border-radius:8px}
.tabs button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:13.5px;
  color:var(--mut);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow);font-weight:560}
.grow{flex:1}
.srch{position:relative;flex:0 1 380px;min-width:150px}
.srch input{width:100%;padding:7px 30px 7px 32px;border:1px solid var(--line2);border-radius:8px;
  background:var(--card);font-size:14px}
.srch input:focus{outline:2px solid var(--acc-soft);border-color:var(--acc)}
.srch .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px}
.srch kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--faint);
  font:11px/1 ui-monospace,monospace;border:1px solid var(--line2);border-radius:4px;padding:2px 4px}
.iconbtn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:6px 10px;
  cursor:pointer;font-size:13px;color:var(--mut)}
.iconbtn:hover{color:var(--fg);border-color:var(--acc)}
.iconbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-t="dark"] .iconbtn.on{color:#12171c}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--sidew) minmax(0,1fr);gap:0;align-items:start}
.side{position:sticky;top:var(--topw);height:calc(100vh - var(--topw));overflow-y:auto;
  border-right:1px solid var(--line);padding:16px 14px 40px;background:var(--bg)}
.side h4{margin:18px 0 7px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:620}
.side h4:first-child{margin-top:0}
.side select{width:100%;padding:6px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--card);font-size:13px}
.abc{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.abc a{display:block;text-align:center;padding:4px 0;border-radius:5px;font-size:12.5px;
  text-decoration:none;color:var(--acc);border:1px solid transparent}
.abc a:hover{background:var(--panel)}
.abc a.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-t="dark"] .abc a.on{color:#12171c}
.abc a.off{color:var(--faint);opacity:.4;pointer-events:none}
.bls{display:flex;flex-wrap:wrap;gap:4px}
.bls a{font-size:12.5px;text-decoration:none;padding:3px 8px;border:1px solid var(--line);
  border-radius:20px;color:var(--mut);background:var(--card);white-space:nowrap}
.bls a:hover{border-color:var(--acc);color:var(--fg)}
.bls a.on{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-t="dark"] .bls a.on{color:#12171c}
.bls a i{font-style:normal;color:var(--faint);font-size:11px;margin-left:4px}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.sizes button{border:1px solid var(--line2);background:var(--card);border-radius:7px;padding:5px 0;
  font-size:12px;color:var(--mut);cursor:pointer}
.sizes button.on{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-t="dark"] .sizes button.on{color:#12171c}
.side .note{font-size:12px;color:var(--faint);line-height:1.5;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
main{padding:20px 26px 120px;max-width:1080px}

/* ---------- groups & cards ---------- */
.gh{position:sticky;top:var(--topw);z-index:10;margin:26px 0 10px;padding:7px 0 6px;
  background:linear-gradient(var(--bg) 70%,transparent);display:flex;align-items:baseline;gap:12px}
.gh:first-child{margin-top:0}
.gh b{font-size:19px;font-weight:640;letter-spacing:.01em}
.gh .meta{font-size:12.5px;color:var(--mut)}
.gh .meta em{font-style:normal;color:var(--faint)}
.card{display:grid;grid-template-columns:var(--cutcol,152px) minmax(0,1fr);gap:16px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-bottom:8px;
  box-shadow:var(--shadow);scroll-margin-top:110px}
.card.act{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.card.flash{animation:fl 1.4s ease}
@keyframes fl{0%,40%{background:var(--hi)}100%{background:var(--card)}}
.cuts{display:flex;flex-direction:column;gap:5px;min-width:0}
.cuts img{display:block;max-height:var(--cut,58px);width:auto;max-width:100%;object-fit:contain;
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px;cursor:zoom-in}
.nocut{width:48px;height:30px;border:1px dashed var(--line2);border-radius:6px}
.hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.w{font-size:17px;font-weight:640;letter-spacing:.005em}
.chip{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:1px 7px;white-space:nowrap}
.chip.b{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.lit{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);margin-top:4px}
.lit b{color:var(--faint);font-weight:400}
.k{margin-top:5px}
.c{margin-top:5px;color:var(--mut);font-size:13.5px;font-style:italic}
.xr{color:var(--acc);text-decoration:none;border-bottom:1px dotted var(--acc);cursor:pointer}
.xr:hover{background:var(--acc-soft)}
mark{background:var(--hi);color:inherit;padding:0 1px;border-radius:2px}
body.compact .c,body.compact .lit{display:none}
body.compact .card{padding:7px 12px;margin-bottom:5px}
.more{text-align:center;color:var(--faint);padding:26px 0;font-size:13px}
.empty{color:var(--mut);text-align:center;padding:70px 0}

/* ---------- tables (parts II–III) ---------- */
.doc{max-width:900px}
.doc h2{font-size:20px;margin:34px 0 4px;font-weight:640}
.doc h2:first-child{margin-top:0}
.doc p{color:var(--mut);margin:6px 0 14px;max-width:70ch}
table{border-collapse:collapse;width:100%;margin:8px 0 22px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top;font-size:13.5px}
th{background:var(--panel);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
tr:last-child td{border-bottom:0}
td b{font-weight:620}
td .cuts{flex-direction:row;margin-top:6px}
.rule td:first-child{color:var(--faint);font-size:12px;white-space:nowrap}

/* ---------- lightbox & preview ---------- */
#zoom{position:fixed;inset:0;background:rgba(14,16,19,.9);display:none;z-index:100;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:28px}
#zoom.on{display:flex}
#zoom img{max-width:min(96vw,1400px);max-height:74vh;background:#fff;padding:10px;border-radius:8px}
#zoom .cap{color:#e9e7e3;font-size:14px;text-align:center;max-width:70ch}
#zoom .cap b{font-size:18px;display:block;margin-bottom:3px}
#zoom .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.1);
  color:#fff;font-size:26px;width:46px;height:64px;border-radius:8px;cursor:pointer}
#zoom .nav.p{left:16px} #zoom .nav.n{right:16px}
#zoom .x{position:absolute;top:16px;right:18px;border:0;background:transparent;color:#c9c6c1;font-size:26px;cursor:pointer}
#pv{position:fixed;z-index:90;display:none;background:var(--card);border:1px solid var(--line2);
  border-radius:8px;padding:8px 10px;box-shadow:0 8px 26px rgba(0,0,0,.18);max-width:340px;pointer-events:none}
#pv.on{display:block}
#pv b{display:block;font-size:14px;margin-bottom:4px}
#pv img{display:block;height:56px;width:auto;max-width:310px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:2px;margin-bottom:4px}
#pv small{color:var(--mut);font:12px/1.4 ui-monospace,monospace}

.burger{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:var(--topw);left:0;width:280px;z-index:25;transform:translateX(-101%);
    transition:transform .18s ease;box-shadow:0 10px 40px rgba(0,0,0,.15)}
  body.nav .side{transform:none}
  .burger{display:block}
  main{padding:16px 14px 100px}
  .brand span{display:none}
  .tabs button{padding:5px 8px;font-size:12.5px}
}
@media print{.top,.side,#zoom,#pv{display:none}.shell{display:block}}
</style></head>
<body>
<div class="top">
  <button class="iconbtn burger" id="burger">☰</button>
  <div class="brand">Зиглы Гуссерля<span>A V 21 · Husserl-Archiv Leuven</span></div>
  <div class="tabs" id="tabs">
    <button data-m="abc" class="on">Алфавит</button>
    <button data-m="bl">По листам</button>
    <button data-m="parts">Пары и правила</button>
    <button data-m="about">О словаре</button>
  </div>
  <div class="grow"></div>
  <div class="srch"><span class="ic">⌕</span><input id="q" type="search" placeholder="слово, каркас, комментарий…"><kbd>/</kbd></div>
  <button class="iconbtn" id="dense" title="компактный вид">≡</button>
  <button class="iconbtn" id="theme" title="тема">◐</button>
</div>

<div class="shell">
  <aside class="side" id="side">
    <h4>Слой</h4>
    <select id="layer"><option value="">оба слоя</option><option>Служебный слой</option><option>Идиолект</option></select>
    <h4>Тип знака</h4>
    <select id="type"><option value="">все типы</option></select>
    <h4>Буква</h4>
    <div class="abc" id="abc"></div>
    <h4>Лист конволюта</h4>
    <div class="bls" id="bls"></div>
    <h4>Вид</h4>
    <button class="iconbtn" id="only" style="width:100%">только с вырезкой</button>
    <div class="sizes" id="sizes"><button data-s="s">S</button><button data-s="m" class="on">M</button><button data-s="l">L</button><button data-s="xl">XL</button></div>
    <div class="note" id="stat"></div>
  </aside>
  <main>
    <div id="list"></div>
    <div id="doc" class="doc" hidden></div>
  </main>
</div>

<div id="zoom"><button class="x">✕</button><button class="nav p">‹</button>
  <img><div class="cap"></div><button class="nav n">›</button></div>
<div id="pv"></div>
<script>

043e\u0439 \u0440\u0430\u043c\u043a\u0435 \u2014 \u0433\u043b\u0430\u0433\u043e\u043b.", []], ["\u0412\u044b\u0441\u043e\u043a\u0438\u0439 \u0448\u0442\u0440\u0438\u0445 \u0441 \u043d\u0438\u0436\u043d\u0435\u0439 \u043f\u0435\u0442\u043b\u0451\u0439", "zwischen \u2248 zwar \u2248 sp- (\ue000sp\u00e4teren\ue001)", "\u0412\u0441\u0435 \u0442\u0440\u0438 \u043d\u0430 21a: \ue000zwischen\ue001, \ue000sp\u00e4teren\ue001, \ue000zwar\ue001 (\u0441\u0442\u043a. 20) \u2014 \u0437\u0438\u0433\u043b z- \u0438 \u0441\u043b\u0438\u044f\u043d\u0438\u0435 sp \u0434\u0430\u044e\u0442 \u043f\u043e\u0447\u0442\u0438 \u043e\u0434\u043d\u0443 \u0444\u0438\u0433\u0443\u0440\u0443: \u0432\u044b\u0441\u043e\u043a\u0438\u0439 \u0432\u043e\u0441\u0445\u043e\u0434\u044f\u0449\u0438\u0439 \u0448\u0442\u0440\u0438\u0445 \u0441 \u043f\u0435\u0442\u043b\u0451\u0439 \u0443 \u0441\u0442\u0440\u043e\u043a\u0438. \u0420\u0430\u0437\u043b\u0438\u0447\u0430\u0435\u0442 \u0443\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435: \ue000zwischen\ue001 \u2014 \u043f\u0440\u0435\u0434\u043b\u043e\u0433 \u043f\u0435\u0440\u0435\u0434 \u0430\u0440\u0442\u0438\u043a\u043b\u0435\u043c, \ue000zwar\ue001 \u2014 \u0432 \u043f\u0430\u0440\u0435 \u0441 \u043f\u043e\u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u043c \ue000aber doch\ue001, sp- \u2014 \u043d\u0430\u0447\u0430\u043b\u043e \u043a\u043e\u0440\u043d\u044f \u043f\u043e\u0441\u043b\u0435 \u0430\u0440\u0442\u0438\u043a\u043b\u044f \u0432 \u0440\u043e\u0434\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u043c. \u26a0 \u041e\u0442\u043a\u0440\u044b\u0442\u044b\u0439 \u0432\u043e\u043f\u0440\u043e\u0441: \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e, \u043f\u0435\u0442\u043b\u044f \u0443 z- \u0437\u0430\u043c\u043a\u043d\u0443\u0442\u0430, \u0430 \u0443 sp- \u043e\u0442\u043a\u0440\u044b\u0442\u0430 \u2014 \u043f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c \u043d\u0430 \u043d\u043e\u0432\u044b\u0445 \u043b\u0438\u0441\u0442\u0430\u0445.", []], ["Teleol \u0443\u0449\u0438\u0439) / Mittel / Glied"]]}, "p3": [["A. \u041a\u0430\u043a \u0443\u0441\u0442\u0440\u043e\u0435\u043d\u043e \u0441\u043b\u043e\u0432\u043e", "\u0420\u0430\u043c\u043a\u0430", "\u0423 \u0447\u0430\u0441\u0442\u043e\u0442\u043d\u043e\u0433\u043e \u0442\u0435\u0440\u043c\u0438\u043d\u0430 \u043f\u0438\u0448\u0443\u0442\u0441\u044f \u043d\u0430\u0447\u0430\u043b\u043e \u0438 \u043a\u043e\u043d\u0435\u0446, \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0430 \u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442\u0441\u044f: Erkenntnis = er+ns, Vernunft = nn+f, Wahrheit = warh. \u0420\u0430\u043c\u043a\u0438 \u0441\u0442\u0430\u0431\u0438\u043b\u044c\u043d\u044b \u043c\u0435\u0436\u0434\u0443 \u043b\u0438\u0441\u0442\u0430\u043c\u0438 \u0438 \u0447\u0435\u0440\u0435\u0437 \u0433\u043e\u0434\u044b: individuell = ndwdll \u043d\u0430 3a \u0438 \u043d\u0430 10a; denkbar = dnk+bar \u043d\u0430 10a \u0438 \u043d\u0430 49b. \u0412\u043e\u0441\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u0435 \u2014 \u0438\u0437 \u0444\u0438\u043b\u043e\u0441\u043e\u0444\u0441\u043a\u043e\u0433\u043e \u043b\u0435\u043a\u0441\u0438\u043a\u043e\u043d\u0430, \u0430 \u043d\u0435 \u0438\u0437 \u0433\u0440\u0430\u0444\u0438\u043a\u0438."], ["A. \u041a\u0430\u043a \u0443\u0441\u0442\u0440\u043e\u0435\u043d\u043e \u0441\u043b\u043e\u0432\u043e", "\u041a\u0430\u0440\u043a\u0430\u0441 \u0441\u043e\u0433\u043b\u0430\u0441\u043d\u044b\u0445", "\u0428\u043a\u043e\u043b\u044c\u043d\u0430\u044f \u0441\u0438\u043c\u0432\u043e\u043b\u0438\u0437\u0430\u0446\u0438\u044f \u0433\u043b\u0430\u0441\u043d\u044b\u0445 (\u043d\u0430\u0436\u0438\u043c, \u0432\u044b\u0441\u043e\u0442\u0430) \u0443 \u0413\u0443\u0441\u0441\u0435\u0440\u043b\u044f \u0447\u0430\u0449\u0435 \u0437\u0430\u043c\u0435\u043d\u0435\u043d\u0430 \u043f\u0440\u043e\u0441\u0442\u044b\u043c \u043f\u0440\u043e\u043f\u0443\u0441\u043a\u043e\u043c; r \u0432\u044b\u043f\u0430\u0434\u0430\u0435\u0442 \u0440\u0435\u0433\u0443\u043b\u044f\u0440\u043d\u043e (griechisch = giechsch, nat\u00fcrlichen = nat\u00fclchn) \u2014 \u043b\u0438\u0431\u043e r-Lage, \u043b\u0438\u0431\u043e \u043e\u0442\u0431\u0440\u043e\u0441."], ["A. \u041a\u0430\u043a \u0443\u0441\u0442\u0440\u043e\u0435\u043d\u043e \u0441\u043b\u043e\u0432\u043e", "\u0421\u0440\u0435\u0437\u0430\u043d\u043d\u044b\u0439 \u0430\u043d\u043b\u0430\u0443\u0442", "\u041d\u0430\u0447\u0430\u043b\u043e \u0441\u043b\u043e\u0432\u0430 \u043e\u0442\u043f\u0430\u0434\u0430\u0435\u0442 \u0432\u0441\u044e\u0434\u0443, \u0433\u0434\u0435 \u043a\u043e\u0440\u0435\u043d\u044c \u043e\u043f\u043e\u0437\u043d\u0430\u0451\u0442\u0441\u044f: muss = ss, m\u00fcssen = ssn, M\u00f6glichkeiten = \u00f6ltn, individuell = ndwdll, unterscheiden = ntrschdn, enth\u00fcllen = nhlln, elterliche = ltrl, andere = ndr, Anlass = nlss. \u041f\u0440\u0430\u0432\u0438\u043b\u043e \u0447\u0442\u0435\u043d\u0438\u044f: \u0435\u0441\u043b\u0438 \u0440\u0430\u043c\u043a\u0430 \u043d\u0430\u0447\u0438\u043d\u0430\u0435\u0442\u0441\u044f \u00ab\u043d\u0435 \u0441 \u0442\u043e\u0439\u00bb \u0431\u0443\u043a\u0432\u044b \u2014 \u043f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c, \u043d\u0435 \u0441\u0440\u0435\u0437\u0430\u043d \u043b\u0438 \u0430\u043d\u043b\u0430\u0443\u0442."], ["A. \u041a\u0430\u043a \u0443\u0441\u0442\u0440\u043e\u0435\u043d\u043e \u0441\u043b\u043e\u0432\u043e", "\u0410\u0444\u0444\u0438\u043a\u0441 \u2014 \u0441\u0430\u043c\u043e\u0441\u0442\u043e\u044f\u0442\u0435\u043b\u044c\u043d\u044b\u0439 \u0437\u043d\u0430\u043a, \u0432\u043f\u043b\u043e\u0442\u044c \u0434\u043e \u0437\u0430\u043c\u0435\u043d\u044b \u0441\u043b\u043e\u0432\u0430 \u0446\u0435\u043b\u0438\u043a\u043e\u043c", "\u0420\u0430\u0431\u043e\u0442\u0430\u044e\u0442 \u0448\u043a\u043e\u043b\u044c\u043d\u044b\u0435 Nachsylben (-ung, -ion, -bar, -lich, \u00a7\u00a736\u201337); bedarf = \u043e\u0434\u0438\u043d \u0437\u0438\u0433\u043b be-, zulassen = zu + lassen. \u041c\u043e\u0440\u0444\u043e\u043b\u043e\u0433\u0438\u044f \u0432\u0438\u0434\u043d\u0430 \u0432 \u043f\u0438\u0441\u044c\u043c\u0435 \u0442\u043e\u0447\u043d\u0435\u0435, \u0447\u0435\u043c \u0432 \u043f\u0435\u0447\u0430\u0442\u0438: ankn\u00fcpft = an+kn\u00fcpft (2 \u0437\u043d\u0430\u043a\u0430) \u043f\u0440\u043e\u0442\u0438\u0432 angekn\u00fcpft = an+ge+kn\u00fcpft (3 \u0437\u043d\u0430\u043a\u0430). \u0413\u0443\u0441\u0441\u0435\u0440\u043b\u044c \u043f\u0438\u0448\u0435\u0442 \u043d\u0435 \u0441\u043b\u043e\u0432\u0430, \u0430 \u043c\u043e\u0440\u0444\u0435\u043c\u043d\u044b\u0435 \u0441\u0431\u043e\u0440\u043a\u0438."], ["A. \u041a\u0430\u043a \u0443\u0441\u0442\u0440\u043e\u0435\u043d\u043e \u0441\u043b\u043e\u0432\u043e", "\u041a\u043e\u043c\u043f\u043e\u0437\u0438\u0442\u044b \u0438 \u0433\u043b\u0430\u0433\u043e\u043b\u044c\u043d\u044b\u0435 \u043f\u0440\u0438\u0441\u0442\u0430\u0432\u043a\u0438 \u0440\u0430\u0437\u044a\u044f\u0442\u044b", "Bewusstseins|entwicklung, Ab|l\u00f6sung, Dahin|lebendes; preis-zu-gebender (zu-\u0438\u043d\u0444\u0438\u043a\u0441 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u043c \u0437\u043d\u0430\u043a\u043e\u043c), an-ge-messen. \u0413\u0440\u0430\u043d\u0438\u0446\u044b \u0441\u043b\u043e\u0432 \u043d\u0435 \u0441\u043e\u0432\u043f\u0430\u0434\u0430\u044e\u0442 \u0441 \u0433\u0440\u0430\u043d\u0438\u0446\u0430\u043c\u0438 \u0437\u043d\u0430\u043a\u043e\u0432 \u0432 \u043e\u0431\u0435 \u0441\u0442\u043e\u0440\u043e\u043d\u044b."], ["A. \u041a\u0430\u043a \u0443\u0441\u0442\u0440\u043e\u0435\u043d\u043e \u0441\u043b\u043e\u0432\u043e", "\u041f\u0440\u0435\u0434\u043b\u043e\u0433 \u0441\u0440\u0430\u0441\u0442\u0430\u0435\u0442\u0441\u044f \u0441 \u0430\u0440\u0442\u0438\u043a\u043b\u0435\u043c", "in der (3a \u00d73, 49b), nach der (49b/10) \u2014 \u043e\u0434\u0438\u043d \u0437\u043d\u0430\u043a (\u0448\u043a\u043e\u043b\u044c\u043d\u044b\u0435 Satzk\u00fcrzungen \u00a739, \u043f\u0435\u0440\u0435\u043d\u0435\u0441\u0451\u043d\u043d\u044b\u0435 \u043d\u0430 \u043f\u0438\u0441\u044c\u043c\u043e \u0434\u043b\u044f \u0441\u0435\u0431\u044f)."], ["B. \u0421\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0439 \u0441\u043b\u043e\u0439", "\u0421\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0439 \u0441\u043b\u043e\u0439 = \u0442\u0430\u0431\u043b\u0438\u0446\u0430 \u0437\u0438\u0433\u043b\u043e\u0432 G1850 \u0431\u0443\u043a\u0432\u0430 \u0432 \u0431\u0443\u043a\u0432\u0443", "\u0422\u043e\u043b\u044c\u043a\u043e \u0441\u0436\u0430\u0442\u0430\u044f \u0434\u043e \u043f\u0440\u0435\u0434\u0435\u043b\u0430 \u0438 \u043f\u043e\u0447\u0442\u0438 \u0431\u0435\u0437 \u043d\u0430\u0436\u0438\u043c\u0430. \u041e\u043f\u043e\u0437\u043d\u0430\u043d\u044b \u0431\u0435\u0437 \u0438\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0439: nun, be-, es, des, eine, er, nicht = t, und, ur, -ion, Quelle = qu, zu, lassen = l, an. \u041d\u0435\u043e\u043f\u043e\u0437\u043d\u0430\u043d\u043d\u044b\u0439 \u043c\u0435\u043b\u043a\u0438\u0439 \u0437\u043d\u0430\u043a \u0441\u043f\u0435\u0440\u0432\u0430 \u0438\u0441\u043a\u0430\u0442\u044c \u0432 \u0448\u043a\u043e\u043b\u044c\u043d\u043e\u0439 \u0442\u0430\u0431\u043b\u0438\u0446\u0435 (\u0441\u0442\u0435\u043d\u043e-\u0441\u0442\u0440. 3 = MDZ 00179), \u0438 \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u043e\u0442\u043e\u043c \u0433\u0430\u0434\u0430\u0442\u044c \u043f\u043e \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442\u0443. \u041b\u0438\u0447\u043d\u043e\u0435 \u0443 \u0413\u0443\u0441\u0441\u0435\u0440\u043b\u044f \u2014 \u043d\u0435 \u0441\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0435 \u0441\u043b\u043e\u0432\u0430, \u0430 \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0435 \u0440\u0430\u043c\u043a\u0438."], ["B. \u0421\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0439 \u0441\u043b\u043e\u0439", "\u0421\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0439 \u0441\u043b\u043e\u0439 \u043d\u0435 \u0437\u0430\u0432\u0438\u0441\u0438\u0442 \u043e\u0442 \u044d\u043f\u043e\u0445\u0438 \u043f\u043e\u0447\u0435\u0440\u043a\u0430", "\u041d\u0430 49a/49b (~1915) von, und, des, eine, zu, sich, das, die, aber, es, an, durch \u043d\u0430\u0447\u0435\u0440\u0442\u0430\u043d\u044b \u043a\u0430\u043a \u043d\u0430 \u043b\u0438\u0441\u0442\u0430\u0445 1924 \u0433.; \u0440\u0430\u043d\u043d\u0438\u0439 \u043f\u043e\u0447\u0435\u0440\u043a \u043a\u0440\u0443\u043f\u043d\u0435\u0435 \u0438 \u043f\u0440\u043e\u0441\u0442\u043e\u0440\u043d\u0435\u0435 \u2014 \u044d\u0442\u043e \u043c\u0435\u0442\u0440\u0438\u043a\u0430, \u043d\u0435 \u0441\u0438\u0441\u0442\u0435\u043c\u0430."], ["B. \u0421\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0439 \u0441\u043b\u043e\u0439", "\u0413\u0440\u043e\u0437\u0434\u044c \u043e\u0434\u0438\u043d\u0430\u043a\u043e\u0432\u044b\u0445 \u0441\u0443\u0444\u0444\u0438\u043a\u0441\u043e\u0432 \u0434\u0435\u0440\u0436\u0438\u0442 \u0441\u0442\u0440\u043e\u043a\u0443", "\u0422\u0440\u0438 -ung \u043f\u043e\u0434\u0440\u044f\u0434 (Abl\u00f6sung, Verschmelzung, \u00dcbertragung) \u043d\u0430\u0447\u0435\u0440\u0442\u0430\u043d\u044b \u043e\u0434\u0438\u043d\u0430\u043a\u043e\u0432\u043e: \u0434\u0430\u0436\u0435 \u043f\u0440\u0438 \u043d\u0435\u0447\u0438\u0442\u0430\u0435\u043c\u043e\u043c \u043a\u043e\u0440\u043d\u0435 \u043f\u043e\u0432\u0442\u043e\u0440\u044f\u044e\u0449\u0430\u044f\u0441\u044f \u043f\u0435\u0442\u043b\u044f \u0434\u0430\u0451\u0442 \u0432\u0435\u0440\u043d\u0443\u044e \u0441\u0435\u0433\u043c\u0435\u043d\u0442\u0430\u0446\u0438\u044e \u0438 \u043f\u043e\u0434\u0441\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u0447\u0430\u0441\u0442\u044c \u0440\u0435\u0447\u0438."], ["B. \u0421\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0439 \u0441\u043b\u043e\u0439", "\u0422\u0435\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u044f\u043a\u043e\u0440\u044c \u0438\u0449\u0435\u0442\u0441\u044f \u043d\u0430 \u0430\u0431\u0437\u0430\u0446\u0435, \u0430 \u043d\u0435 \u043d\u0430 \u043b\u0438\u0441\u0442\u0435", "\u041d\u0430 49b \u0441\u0442\u043a. 1\u20135 \u0441\u0430\u043c\u044b\u0439 \u0447\u0430\u0441\u0442\u044b\u0439 \u0443\u0437\u0435\u043b \u2014 bwstn(s) (5\u00d7), \u0432 \u0441\u0442\u043a. 6\u20138 \u0435\u0433\u043e \u0441\u043c\u0435\u043d\u044f\u0435\u0442 ~ll = Leiber (5\u00d7). \u0410\u0431\u0437\u0430\u0446 \u043c\u0435\u043d\u044f\u0435\u0442 \u043f\u0440\u0435\u0434\u043c\u0435\u0442 \u2014 \u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0438 \u044f\u043a\u043e\u0440\u044c; \u043e\u043f\u043e\u0437\u043d\u0430\u0432\u0430\u0442\u044c \u0435\u0433\u043e \u043f\u0435\u0440\u0432\u044b\u043c."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u0421\u0442\u0435\u043d\u043e / \u043a\u0443\u0440\u0440\u0435\u043d\u0442 / \u043b\u0430\u0442\u0438\u043d\u0438\u0446\u0430; \u043a\u043e\u0434 \u0432\u044b\u0431\u0438\u0440\u0430\u0435\u0442\u0441\u044f \u043f\u043e \u0444\u0443\u043d\u043a\u0446\u0438\u0438 \u0441\u043b\u043e\u0432\u0430 \u0432\u043e \u0444\u0440\u0430\u0437\u0435, \u043d\u0435 \u043f\u043e \u044f\u0437\u044b\u043a\u0443", "Theologie \u0432 \u043f\u043e\u0442\u043e\u043a\u0435 \u2014 \u0441\u0442\u0435\u043d\u043e\u0433\u0440\u0430\u043c\u043c\u0430, \u043f\u043e\u0434 \u0440\u0430\u0437\u0440\u044f\u0434\u043a\u043e\u0439 \u2014 \u043a\u0443\u0440\u0440\u0435\u043d\u0442; \u043d\u0430 49b/14 au\u00dferkommunikativ \u043d\u0430\u043f\u0438\u0441\u0430\u043d\u043e \u043b\u0430\u0442\u0438\u043d\u0438\u0446\u0435\u0439 \u0438 \u043f\u043e\u0434\u0447\u0451\u0440\u043a\u043d\u0443\u0442\u043e, \u0430 Kommunikation \u0442\u0440\u0435\u043c\u044f \u0437\u043d\u0430\u043a\u0430\u043c\u0438 \u043f\u0440\u0430\u0432\u0435\u0435 \u2014 \u0441\u0442\u0435\u043d\u043e\u0433\u0440\u0430\u0444\u0438\u0435\u0439. \u041b\u0430\u0442\u0438\u043d\u0438\u0446\u0430 \u043f\u0440\u043e\u043d\u0438\u043a\u0430\u0435\u0442 \u0432\u043d\u0443\u0442\u0440\u044c \u043d\u0435\u043c\u0435\u0446\u043a\u043e\u0433\u043e \u0441\u043b\u043e\u0432\u0430: a-rationaler = \u00aba rat.\u00bb. \u0412\u0435\u0441\u044c \u0438\u043d\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043c\u0430\u0442\u0435\u0440\u0438\u0430\u043b \u0441\u043e\u0431\u0440\u0430\u043d \u043d\u0430 \u043b\u0438\u0441\u0442\u0435 \u00ab\u0418\u0434\u0438\u043e\u043b\u0435\u043a\u0442\u00bb \u043f\u043e\u0434 \u0442\u0438\u043f\u043e\u043c \u00ab\u0438\u043d\u043e\u0439 \u043a\u043e\u0434\u00bb."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u041b\u0430\u0442\u0438\u043d\u0441\u043a\u0438\u0435 \u0430\u0431\u0431\u0440\u0435\u0432\u0438\u0430\u0442\u0443\u0440\u044b \u043f\u0438\u0448\u0443\u0442\u0441\u044f \u0441 \u0442\u043e\u0447\u043a\u0430\u043c\u0438", "\u041a\u0430\u043a \u0432 \u043e\u0431\u044b\u0447\u043d\u043e\u043c \u043f\u0438\u0441\u044c\u043c\u0435: d.h., ev., apr., etc., d. i., a priori, eo ipso. \u041e\u0434\u0438\u043d \u0438 \u0442\u043e\u0442 \u0436\u0435 \u043e\u0431\u043e\u0440\u043e\u0442 \u0431\u044b\u0432\u0430\u0435\u0442 \u0437\u0430\u043f\u0438\u0441\u0430\u043d \u0434\u0432\u0443\u043c\u044f \u0441\u043f\u043e\u0441\u043e\u0431\u0430\u043c\u0438 \u043d\u0430 \u0441\u043e\u0441\u0435\u0434\u043d\u0438\u0445 \u043b\u0438\u0441\u0442\u0430\u0445 (apr. \u043d\u0430 49a \u2194 a priori \u043d\u0430 49b)."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u041a\u0440\u0443\u0433\u043b\u0430\u044f \u0441\u043a\u043e\u0431\u043a\u0430 = \u0432\u0441\u0442\u0430\u0432\u043d\u0430\u044f \u0440\u0435\u043f\u043b\u0438\u043a\u0430", "\u0418\u043d\u043e\u0433\u0434\u0430 \u044d\u0442\u043e \u043f\u0435\u0440\u0435\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435 \u0432 \u0447\u0443\u0436\u043e\u0439 \u044f\u0437\u044b\u043a ((faith) \u0430\u043d\u0433\u043b., (blo\u00df doxa) \u0433\u0440\u0435\u0447. \u2014 \u043b\u0430\u0442\u0438\u043d\u0438\u0446\u0435\u0439), \u043d\u043e \u043d\u0435 \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u043e: (Animalien) \u043d\u0430 49b \u2014 \u0442\u0435\u0440\u043c\u0438\u043d\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0435 \u0443\u0442\u043e\u0447\u043d\u0435\u043d\u0438\u0435 \u043f\u043e-\u043d\u0435\u043c\u0435\u0446\u043a\u0438."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u041a\u0430\u0432\u044b\u0447\u043a\u0438 \u201e\u2026\u201c = \u0442\u0435\u0440\u043c-\u0446\u0438\u0442\u0430\u0442\u0430, \u0434\u0438\u0441\u0442\u0430\u043d\u0446\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435", "\u201eSeligkeit\u201c, \u201etheoretisch\u201c, \u201eLeib\u201c. \u041e\u0442\u043b\u0438\u0447\u0430\u0442\u044c \u043e\u0442 \u0441\u043a\u043e\u0431\u043a\u0438-\u0433\u043b\u043e\u0441\u0441\u044b: \u043a\u0430\u0432\u044b\u0447\u043a\u0438 \u2014 \u0441\u0432\u043e\u0439 \u0442\u0435\u0440\u043c\u0438\u043d \u043f\u043e\u0434 \u0432\u043e\u043f\u0440\u043e\u0441\u043e\u043c, \u0441\u043a\u043e\u0431\u043a\u0430 \u2014 \u0432\u0441\u0442\u0430\u0432\u043a\u0430."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u041f\u043e\u0434\u0447\u0451\u0440\u043a\u0438\u0432\u0430\u043d\u0438\u0435 MS \u2283 \u0440\u0430\u0437\u0440\u044f\u0434\u043a\u0430 Hua", "\u0412\u0441\u044f\u043a\u0430\u044f \u0440\u0430\u0437\u0440\u044f\u0434\u043a\u0430 \u0438\u0437\u0434\u0430\u043d\u0438\u044f \u0441\u0442\u043e\u0438\u0442 \u043d\u0430 \u043f\u043e\u0434\u0447\u0451\u0440\u043a\u0438\u0432\u0430\u043d\u0438\u0438 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438, \u043d\u043e \u043d\u0435 \u043d\u0430\u043e\u0431\u043e\u0440\u043e\u0442: denkbar (49b) \u043f\u043e\u0434\u0447\u0451\u0440\u043a\u043d\u0443\u0442\u043e \u0434\u0432\u043e\u0439\u043d\u043e\u0439 \u0447\u0435\u0440\u0442\u043e\u0439, \u0432 Hua \u0440\u0430\u0437\u0440\u044f\u0434\u043a\u0438 \u043d\u0435\u0442."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u041a\u0443\u0440\u0440\u0435\u043d\u0442 \u2014 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u0439 \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a \u043e\u0448\u0438\u0431\u043e\u043a", "todten Leib (\u0441\u0442\u0430\u0440\u0430\u044f \u043e\u0440\u0444\u043e\u0433\u0440\u0430\u0444\u0438\u044f -dt-, Hua \u043d\u043e\u0440\u043c\u0430\u043b\u0438\u0437\u0443\u0435\u0442). \u0420\u0430\u043d\u043d\u0438\u0439 \u043f\u043e\u0447\u0435\u0440\u043a \u043f\u0435\u0440\u0435\u0443\u0447\u0438\u0432\u0430\u043d\u0438\u044f \u043d\u0435 \u0442\u0440\u0435\u0431\u0443\u0435\u0442, \u043d\u043e \u0434\u043e\u043b\u044f \u043b\u043e\u043d\u0433\u0445\u0435\u043d\u0434-\u0432\u0441\u0442\u0430\u0432\u043e\u043a \u0441\u0430\u043c\u0430 \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u043a\u0430\u043a \u0434\u0430\u0442\u0438\u0440\u0443\u044e\u0449\u0438\u0439 \u043f\u0440\u0438\u0437\u043d\u0430\u043a."], ["C. \u0422\u0440\u0438 \u043a\u043e\u0434\u0430 \u043f\u0438\u0441\u044c\u043c\u0430", "\u041f\u0443\u043d\u043a\u0442\u0443\u0430\u0446\u0438\u0438 \u043f\u043e\u0447\u0442\u0438 \u043d\u0435\u0442; \u0435\u0451 \u0437\u0430\u043c\u0435\u043d\u044f\u044e\u0442 \u0434\u0432\u0430 \u0430\u0432\u0442\u043e\u0440\u0441\u043a\u0438\u0445 \u0437\u043d\u0430\u043a\u0430", "Fragezeichen (\u043d\u0430\u0434\u0441\u0442\u0440\u043e\u0447\u043d\u044b\u0439 2-\u0437\u0430\u0432\u0438\u0442\u043e\u043a + \u0442\u043e\u0447\u043a\u0430) \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0438\u0440\u0443\u0435\u0442 \u043f\u0435\u0440\u0438\u043e\u0434 \u043b\u0443\u0447\u0448\u0435 \u0442\u043e\u0447\u0435\u043a. Absatzzeichen (\u0434\u043b\u0438\u043d\u043d\u044b\u0439 \u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u044c\u043d\u044b\u0439 \u0440\u043e\u0441\u0447\u0435\u0440\u043a-\u043f\u0435\u0442\u043b\u044f \u0432 \u043a\u043e\u043d\u0446\u0435 \u0441\u0442\u0440\u043e\u043a\u0438) \u0432 \u043f\u0435\u0447\u0430\u0442\u0438 \u043f\u0440\u0435\u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044f \u0432 \u0430\u0431\u0437\u0430\u0446\u043d\u044b\u0439 \u043e\u0442\u0441\u0442\u0443\u043f. \u041a\u0440\u043e\u043c\u0435 \u043d\u0438\u0445 \u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u043f\u0440\u0438\u0437\u043d\u0430\u043a\u043e\u0432 \u0433\u0440\u0430\u043d\u0438\u0446\u044b \u043c\u044b\u0441\u043b\u0438 \u043d\u0435\u0442."], ["D. \u0421\u043b\u043e\u0438 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438", "\u0422\u0438\u043f\u043e\u043b\u043e\u0433\u0438\u044f \u0441\u043b\u043e\u0451\u0432 \u0437\u0430\u043a\u0440\u044b\u0442\u0430 \u2014 \u0447\u0435\u0442\u044b\u0440\u0435 \u0442\u0438\u043f\u0430", "\u0417\u0430\u043c\u0435\u043d\u0430 V., \u0432\u0441\u0442\u0430\u0432\u043a\u0430 \u043d\u0430\u0434 \u0441\u0442\u0440\u043e\u043a\u043e\u0439 Einf. (\u0447\u0435\u0440\u043d\u0438\u043b\u0430\u043c\u0438 \u0438\u043b\u0438 \u043a\u0430\u0440\u0430\u043d\u0434\u0430\u0448\u043e\u043c), \u0432\u044b\u0447\u0435\u0440\u043a gestr., Randmarkierung mit Bleist. \u041f\u043b\u044e\u0441 \u0430\u0432\u0442\u043e\u0440\u0441\u043a\u0438\u0439 Absatzzeichen. \u041e\u0441\u0442\u0430\u0451\u0442\u0441\u044f \u043d\u0435 \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u0442\u044c \u043d\u043e\u0432\u044b\u0435 \u0442\u0438\u043f\u044b, \u0430 \u0441\u0438\u0441\u0442\u0435\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0438\u0441\u043a\u0430\u0442\u044c \u0438\u0437\u0432\u0435\u0441\u0442\u043d\u044b\u0435: \u0447\u0438\u0442\u0430\u0442\u044c \u043b\u0438\u0441\u0442 = \u0447\u0438\u0442\u0430\u0442\u044c \u0435\u0433\u043e \u0441\u043b\u043e\u0438."], ["D. \u0421\u043b\u043e\u0438 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438", "\u0413\u0440\u0430\u0444\u0438\u043a\u0430 \u0432\u044b\u0447\u0435\u0440\u043a\u0430 \u0434\u0432\u043e\u044f\u043a\u0430\u044f", "\u0427\u0430\u0441\u0442\u0430\u044f \u043a\u043e\u0441\u0430\u044f \u0448\u0442\u0440\u0438\u0445\u043e\u0432\u043a\u0430 \u00ab\u0440\u0435\u0448\u0451\u0442\u043a\u043e\u0439\u00bb (\u0437\u043d\u0430\u043a \u043f\u043e\u0434 \u043d\u0435\u0439 \u043d\u0435\u0447\u0438\u0442\u0430\u0435\u043c \u043f\u0440\u0438\u043d\u0446\u0438\u043f\u0438\u0430\u043b\u044c\u043d\u043e \u2014 \u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u27e6gestr.\u27e7) \u0438 \u043e\u0434\u0438\u043d\u043e\u0447\u043d\u044b\u0439 \u043f\u0435\u0440\u0435\u0447\u0451\u0440\u043a (3a)."], ["D. \u0421\u043b\u043e\u0438 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438", "\u0427\u0435\u0440\u043d\u0438\u043b\u0430 \u0438 \u043a\u0430\u0440\u0430\u043d\u0434\u0430\u0448 \u0440\u0430\u0437\u043b\u0438\u0447\u0430\u044e\u0442\u0441\u044f \u0438\u0437\u043c\u0435\u0440\u0438\u043c\u043e", "\u041f\u043b\u043e\u0442\u043d\u043e\u0441\u0442\u044c \u043f\u043e \u0441\u043a\u0430\u043d\u0443: \u0447\u0435\u0440\u043d\u0438\u043b\u0430 ~1\u201334, \u043a\u0430\u0440\u0430\u043d\u0434\u0430\u0448 ~86\u2013200, \u0431\u0443\u043c\u0430\u0433\u0430 ~250; \u0433\u0440\u0430\u043d\u0438\u0446\u0430 \u0440\u0435\u0437\u043a\u0430\u044f. \u041a\u0430\u0440\u0430\u043d\u0434\u0430\u0448 = \u0431\u043e\u043b\u0435\u0435 \u043f\u043e\u0437\u0434\u043d\u0438\u0439 \u0441\u043b\u043e\u0439. \u041d\u0430 \u044d\u0442\u043e\u043c \u0436\u0435 \u0440\u0430\u0437\u043b\u0438\u0447\u0438\u0438 \u0441\u0442\u043e\u0438\u0442 \u0438\u0437\u0434\u0430\u0442\u0435\u043b\u044c\u0441\u043a\u043e\u0435 \u00abEinf.\u00bb / \u00abEinf. mit Bleist.\u00bb."], ["D. \u0421\u043b\u043e\u0438 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438", "\u041a\u0430\u0440\u0430\u043d\u0434\u0430\u0448 \u0431\u044b\u0432\u0430\u0435\u0442 \u043d\u0435 \u043f\u0440\u0430\u0432\u043a\u043e\u0439, \u0430 \u0447\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u0441\u043a\u043e\u0439 \u043f\u043e\u043c\u0435\u0442\u043e\u0439", "\u0412\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u0439 \u0448\u0442\u0440\u0438\u0445 \u043d\u0430 \u043f\u043e\u043b\u044f\u0445 (49b, \u0441\u0442\u043a. 6\u20138, \u043f\u043b\u043e\u0442\u043d\u043e\u0441\u0442\u044c 142 \u043f\u0440\u043e\u0442\u0438\u0432 1\u20137 \u0443 \u0447\u0435\u0440\u043d\u0438\u043b \u0442\u043e\u0439 \u0436\u0435 \u0441\u0442\u0440\u043e\u043a\u0438) = \u043e\u0442\u0447\u0451\u0440\u043a\u043d\u0443\u0442\u043e\u0435 \u043f\u0440\u0438 \u043f\u0435\u0440\u0435\u0447\u0438\u0442\u044b\u0432\u0430\u043d\u0438\u0438. \u041a\u0430\u0440\u0430\u043d\u0434\u0430\u0448\u043d\u044b\u0439 \u0441\u043b\u043e\u0439 \u0434\u0435\u043b\u0438\u0442\u044c \u043d\u0430 \u0432\u043f\u0438\u0441\u0430\u043d\u043d\u043e\u0435 (\u0431\u043e\u043b\u0435\u0435 \u043f\u043e\u0437\u0434\u043d\u044f\u044f \u043c\u044b\u0441\u043b\u044c) \u0438 \u043e\u0442\u0447\u0451\u0440\u043a\u043d\u0443\u0442\u043e\u0435 (\u0431\u043e\u043b\u0435\u0435 \u043f\u043e\u0437\u0434\u043d\u0435\u0435 \u0447\u0442\u0435\u043d\u0438\u0435): \u043c\u0435\u0440\u044f\u044e\u0442\u0441\u044f \u043e\u0434\u0438\u043d\u0430\u043a\u043e\u0432\u043e, \u0437\u043d\u0430\u0447\u0430\u0442 \u0440\u0430\u0437\u043d\u043e\u0435."], ["E. \u0420\u0443\u043a\u043e\u043f\u0438\u0441\u044c \u043f\u0440\u043e\u0442\u0438\u0432 \u043f\u0435\u0447\u0430\u0442\u0438", "Hua \u2014 \u0432\u0442\u043e\u0440\u043e\u0439 \u0441\u0432\u0438\u0434\u0435\u0442\u0435\u043b\u044c, \u0430 \u043d\u0435 \u044d\u0442\u0430\u043b\u043e\u043d", "\u0412\u0441\u0435 \u043d\u0430\u043a\u043e\u043f\u043b\u0435\u043d\u043d\u044b\u0435 \u0440\u0430\u0441\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u044f \u2014 \u0432 \u043f\u043e\u043b\u044c\u0437\u0443 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438: mindest \u2260 mindestens (4b); \u0442\u0438\u0440\u0435 \u0432\u043c\u0435\u0441\u0442\u043e \u043a\u0440\u0443\u0433\u043b\u044b\u0445 \u0441\u043a\u043e\u0431\u043e\u043a (49a); \u043e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u044f -es \u0432\u043c\u0435\u0441\u0442\u043e -en (49a); Fragezeichen \u0432\u043c\u0435\u0441\u0442\u043e \u0442\u043e\u0447\u043a\u0438 (49b/8); \u0434\u0438\u0442\u0442\u043e\u0433\u0440\u0430\u0444\u0438\u044f das \u27e6sie gestr.\u27e7 das \u043f\u0440\u0438 \u043e\u0434\u043d\u043e\u043c \u043f\u0435\u0447\u0430\u0442\u043d\u043e\u043c das (26a/8); \u0442\u0440\u0438 \u0441\u043b\u0443\u0447\u0430\u044f \u043d\u043e\u0440\u043c\u0430\u043b\u0438\u0437\u0430\u0446\u0438\u0438 \u043f\u0443\u043d\u043a\u0442\u0443\u0430\u0446\u0438\u0438 (26a, \u0441\u0442\u043a. 10\u201312); Seiendes \u0432\u043c\u0435\u0441\u0442\u043e Seiende (26a/7); es \u0432\u043c\u0435\u0441\u0442\u043e er (26b/2); in dem \u0432\u043c\u0435\u0441\u0442\u043e in der (26b/18); \u043b\u0438\u0448\u043d\u0435\u0435 und \u043f\u043e\u0441\u043b\u0435 Weise (26b/20\u201321)."], ["E. \u0420\u0443\u043a\u043e\u043f\u0438\u0441\u044c \u043f\u0440\u043e\u0442\u0438\u0432 \u043f\u0435\u0447\u0430\u0442\u0438", "\u0424\u043e\u0440\u043c\u0443\u043b\u0430 \u043a\u043e\u043d\u044a\u0435\u043a\u0442\u0443\u0440", "\u27e8X\u27e9 \u0431\u0435\u0437 \u0430\u043f\u043f\u0430\u0440\u0430\u0442\u043d\u043e\u0439 \u043f\u043e\u043c\u0435\u0442\u044b = \u0434\u043e\u0431\u0430\u0432\u043a\u0430 \u0438\u0437\u0434\u0430\u0442\u0435\u043b\u0435\u0439, \u0432 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438 \u0435\u0451 \u043d\u0435\u0442 \u2014 \u043d\u0435 \u0438\u0441\u043a\u0430\u0442\u044c. \u00abX Einf.\u00bb = \u0440\u0443\u043a\u0430 \u0413\u0443\u0441\u0441\u0435\u0440\u043b\u044f \u043d\u0430\u0434 \u0441\u0442\u0440\u043e\u043a\u043e\u0439 \u2014 \u0438\u0441\u043a\u0430\u0442\u044c. \u041f\u0440\u043e\u0432\u0435\u0440\u0435\u043d\u043e \u043d\u0430 \u0441\u0435\u043c\u0438 \u0441\u043b\u0443\u0447\u0430\u044f\u0445 (\u27e8wahren\u27e9, \u27e8wahre\u27e9, \u27e8werden\u27e9, \u27e8gibt\u27e9, \u27e8dazu\u27e9, \u27e8eine\u27e9, \u27e8den\u27e9). \u0417\u0430\u0433\u043e\u043b\u043e\u0432\u043a\u0438 \u00a7\u00a7 \u0432 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438 \u043e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0443\u044e\u0442 \u2014 \u043e\u043d\u0438 \u0441\u043a\u043e\u043d\u0441\u0442\u0440\u0443\u0438\u0440\u043e\u0432\u0430\u043d\u044b \u0438\u0437\u0434\u0430\u0442\u0435\u043b\u044f\u043c\u0438."], ["E. \u0420\u0443\u043a\u043e\u043f\u0438\u0441\u044c \u043f\u0440\u043e\u0442\u0438\u0432 \u043f\u0435\u0447\u0430\u0442\u0438", "\u041e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u044f \u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u0431\u0443\u043a\u0432\u0430\u043b\u044c\u043d\u043e, \u043d\u0435 \u00ab\u043f\u043e\u043f\u0440\u0430\u0432\u043b\u044f\u044f\u00bb \u043f\u043e\u0434 \u0433\u0440\u0430\u043c\u043c\u0430\u0442\u0438\u043a\u0443 \u0438\u0437\u0434\u0430\u043d\u0438\u044f", "\u00abschlafendes \u2026 Dahinlebendes\u00bb \u043f\u0440\u043e\u0442\u0438\u0432 \u043f\u0435\u0447\u0430\u0442\u043d\u044b\u0445 -en. \u0418\u043c\u0435\u043d\u043d\u043e \u043e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u044f \u0434\u0430\u044e\u0442 \u0440\u0430\u0437\u043d\u043e\u0447\u0442\u0435\u043d\u0438\u044f."], ["E. \u0420\u0443\u043a\u043e\u043f\u0438\u0441\u044c \u043f\u0440\u043e\u0442\u0438\u0432 \u043f\u0435\u0447\u0430\u0442\u0438", "\u041f\u0443\u043d\u043a\u0442\u0443\u0430\u0446\u0438\u044f \u2014 \u0441\u0430\u043c\u044b\u0439 \u0443\u044f\u0437\u0432\u0438\u043c\u044b\u0439 \u0441\u043b\u043e\u0439 \u0438\u0437\u0434\u0430\u043d\u0438\u044f: \u0430\u043f\u043f\u0430\u0440\u0430\u0442 \u0435\u0451 \u043d\u0435 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0438\u0440\u0443\u0435\u0442", "\u041d\u043e\u0440\u043c\u0430\u043b\u0438\u0437\u0430\u0446\u0438\u044f \u0438\u0434\u0451\u0442 \u0432 \u043e\u0431\u0435 \u0441\u0442\u043e\u0440\u043e\u043d\u044b (26a): MS \u0437\u0430\u043f\u044f\u0442\u0430\u044f \u2192 \u043f\u0435\u0447\u0430\u0442\u043d\u043e\u0435 \u00ab?\u00bb, MS \u0442\u043e\u0447\u043a\u0430 \u2192 \u00ab?\u00bb, MS \u0442\u0438\u0440\u0435 \u2192 \u00ab,\u00bb; \u0438 \u043d\u0430\u043e\u0431\u043e\u0440\u043e\u0442 \u2014 MS Fragezeichen \u2192 \u043f\u0435\u0447\u0430\u0442\u043d\u0430\u044f \u0442\u043e\u0447\u043a\u0430 (49b/8). \u041f\u0435\u0447\u0430\u0442\u043d\u0430\u044f \u043f\u0443\u043d\u043a\u0442\u0443\u0430\u0446\u0438\u044f \u043d\u0435 \u0441\u0432\u0438\u0434\u0435\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0443\u0435\u0442 \u043e \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438 \u043d\u0438 \u0432 \u043e\u0434\u043d\u0443 \u0441\u0442\u043e\u0440\u043e\u043d\u0443; \u043f\u0440\u0438\u0437\u043d\u0430\u043a \u0432\u043e\u043f\u0440\u043e\u0441\u0430 \u0432 MS \u2014 \u0442\u043e\u043b\u044c\u043a\u043e \u043d\u0430\u0434\u0441\u0442\u0440\u043e\u0447\u043d\u044b\u0439 2-\u0437\u0430\u0432\u0438\u0442\u043e\u043a \u0441 \u0442\u043e\u0447\u043a\u043e\u0439."], ["E. \u0420\u0443\u043a\u043e\u043f\u0438\u0441\u044c \u043f\u0440\u043e\u0442\u0438\u0432 \u043f\u0435\u0447\u0430\u0442\u0438", "\u0412\u044b\u0434\u0435\u043b\u0435\u043d\u0438\u0435 \u0432 \u0438\u0437\u0434\u0430\u043d\u0438\u0438 \u0438 \u043f\u043e\u0434\u0447\u0451\u0440\u043a\u0438\u0432\u0430\u043d\u0438\u0435 \u0432 \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438 \u2014 \u043d\u0435 \u043e\u0434\u043d\u043e \u0438 \u0442\u043e \u0436\u0435", "\u0418\u0437\u0434\u0430\u043d\u0438\u0435 \u043e\u0442\u0440\u0430\u0436\u0430\u0435\u0442 \u043f\u043e\u0434\u0447\u0451\u0440\u043a\u0438\u0432\u0430\u043d\u0438\u0435 \u0432\u044b\u0431\u043e\u0440\u043e\u0447\u043d\u043e \u0438 \u0441\u0436\u0438\u043c\u0430\u0435\u0442 \u0435\u0433\u043e \u0433\u0440\u0430\u043d\u0438\u0446\u044b: \u043f\u043e\u0434\u0447\u0451\u0440\u043a\u043d\u0443\u0442 \u043f\u0435\u0440\u0438\u043e\u0434 \u2014 \u043d\u0430\u0431\u0440\u0430\u043d\u043e \u0440\u0430\u0437\u0440\u044f\u0434\u043a\u043e\u0439 \u043f\u043e\u043d\u044f\u0442\u0438\u0435 (26b/16\u201318 \u043f\u0440\u043e\u0442\u0438\u0432 \u0440\u0430\u0437\u0440\u044f\u0434\u043a\u0438 205,22). \u0420\u0430\u0437\u0440\u044f\u0434\u043a\u0438 \u0431\u0435\u0437 \u043f\u043e\u0434\u0447\u0451\u0440\u043a\u0438\u0432\u0430\u043d\u0438\u044f \u043d\u0435 \u0432\u0441\u0442\u0440\u0435\u0447\u0430\u043b\u043e\u0441\u044c. \u041f\u0440\u0430\u043a\u0442\u0438\u0447\u0435\u0441\u043a\u0438: \u043e\u0442\u043c\u0435\u0447\u0430\u0442\u044c \u0432\u0441\u044f\u043a\u043e\u0435 \u043f\u043e\u0434\u0447\u0451\u0440\u043a\u0438\u0432\u0430\u043d\u0438\u0435 \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e \u043e\u0442 \u043e\u0440\u0443\u0434\u0438\u044f (\u0447\u0435\u0440\u043d\u0438\u043b\u0430, \u043f\u0440\u043e\u0441\u0442\u043e\u0439 \u0438\u043b\u0438 \u0446\u0432\u0435\u0442\u043d\u043e\u0439 \u043a\u0430\u0440\u0430\u043d\u0434\u0430\u0448); \u043f\u0435\u0447\u0430\u0442\u043d\u0443\u044e \u0440\u0430\u0437\u0440\u044f\u0434\u043a\u0443 \u043a\u0430\u043a \u0441\u0432\u0438\u0434\u0435\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e \u043e \u0440\u0443\u043a\u043e\u043f\u0438\u0441\u0438 \u043d\u0435 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u044c."], ["F. \u041c\u0435\u0442\u043e\u0434 \u0447\u0442\u0435\u043d\u0438\u044f", "\u0421\u043d\u0430\u0447\u0430\u043b\u0430 \u043a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0446\u0438\u044f \u0438 \u0444\u043e\u0440\u043c\u0430, \u043f\u043e\u0442\u043e\u043c \u043a\u043e\u0440\u0435\u043d\u044c", "\u041e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u0435, \u0441\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0435 \u0434\u0438\u043f\u043b\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438, \u0441\u0430\u043c\u043e \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u0442 \u0433\u0440\u0430\u043c\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0443\u044e \u043f\u043e\u0434\u0441\u043a\u0430\u0437\u043a\u0443: \u043a\u043e\u043d\u0435\u0447\u043d\u043e\u0435 -s \u0443 frdns = \u0433\u0435\u043d\u0438\u0442\u0438\u0432 \u2192 \u043f\u043e\u0441\u043b\u0435 des + \u043f\u0440\u0438\u043b\u0430\u0433. \u043d\u0430 -en \u2192 Friedens. \u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u044c \u0442\u0438\u043f \u043a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0446\u0438\u0438 (\u0432\u0435\u0440\u0448\u0438\u043d\u0430 / \u0430\u0442\u0440\u0438\u0431\u0443\u0442 / \u043f\u0430\u0434\u0435\u0436) \u0438 \u0442\u0440\u0435\u0431\u0443\u0435\u043c\u0443\u044e \u0447\u0430\u0441\u0442\u044c \u0440\u0435\u0447\u0438 \u043f\u043e \u0441\u043b\u0443\u0436\u0435\u0431\u043d\u043e\u043c\u0443 \u043e\u043a\u0440\u0443\u0436\u0435\u043d\u0438\u044e \u2014 \u0438 \u043b\u0438\u0448\u044c \u0437\u0430\u0442\u0435\u043c \u0438\u0441\u043a\u0430\u0442\u044c \u0441\u043b\u043e\u0432\u043e. \u041e\u0431\u0440\u0430\u0442\u043d\u044b\u0439 \u0445\u043e\u0434 \u043b\u043e\u0432\u0438\u0442 \u043e\u0448\u0438\u0431\u043a\u0443 \u0437\u043d\u0430\u043a\u0430: \u0435\u0441\u043b\u0438 \u0440\u0430\u0437\u0431\u043e\u0440 \u0434\u0430\u0451\u0442 \u043f\u0440\u0438\u043b\u0430\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u0442\u0430\u043c, \u0433\u0434\u0435 \u0441\u0438\u043d\u0442\u0430\u043a\u0441\u0438\u0441 \u0442\u0440\u0435\u0431\u0443\u0435\u0442 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e, \u043e\u0448\u0438\u0431\u043a\u0430 \u0432 \u0440\u0430\u0437\u0431\u043e\u0440\u0435."], ["F. \u041c\u0435\u0442\u043e\u0434 \u0447\u0442\u0435\u043d\u0438\u044f", "\u0422\u043e\u0447\u043d\u043e\u0441\u0442\u044c \u0440\u0430\u0441\u0449\u0435\u043f\u043b\u044f\u0435\u0442\u0441\u044f \u043d\u0430 \u0434\u0432\u0430 \u0441\u043b\u043e\u044f, \u0438 \u043e\u043d\u0438 \u0440\u0430\u0441\u0445\u043e\u0434\u044f\u0442\u0441\u044f", "\u0414\u0438\u043f\u043b\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u0441\u043b\u043e\u0439 (\u043a\u0430\u0440\u043a\u0430\u0441) \u0438\u0434\u0451\u0442 \u0432\u043f\u0435\u0440\u0435\u0434\u0438 \u043b\u0435\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u043e\u0433\u043e (\u0441\u043b\u043e\u0432\u043e). \u0422\u0440\u0443\u0434\u043d\u043e\u0441\u0442\u0438 \u0441\u0430\u0434\u044f\u0442\u0441\u044f \u043d\u0430 \u0437\u043d\u0430\u043c\u0435\u043d\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0435 \u0441\u043b\u043e\u0432\u0430 \u0441\u043e \u0441\u0440\u0435\u0437\u0430\u043d\u043d\u044b\u043c \u0430\u043d\u043b\u0430\u0443\u0442\u043e\u043c, \u0441\u043b\u0443\u0436\u0435\u0431\u043d\u044b\u0439 \u0441\u043b\u043e\u0439 \u0434\u0435\u0440\u0436\u0438\u0442\u0441\u044f. \u0422\u0440\u0435\u043d\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u043d\u0430\u0434\u043e \u0432\u043e\u0441\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u0435 \u043a\u043e\u0440\u043d\u0435\u0439, \u0430 \u043d\u0435 \u0447\u0442\u0435\u043d\u0438\u0435 \u0437\u0438\u0433\u043b\u043e\u0432."], ["F. \u041c\u0435\u0442\u043e\u0434 \u0447\u0442\u0435\u043d\u0438\u044f", "\u041e\u0434\u0438\u043d\u043e\u0447\u043d\u043e\u0435 \u0432\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u0435 \u0442\u0440\u0443\u0434\u043d\u0435\u0435 \u043f\u043e\u0432\u0442\u043e\u0440\u0451\u043d\u043d\u043e\u0433\u043e", "\u0412\u0441\u0451, \u0447\u0442\u043e \u043f\u043e\u0432\u0442\u043e\u0440\u0438\u043b\u043e\u0441\u044c \u043d\u0430 \u043b\u0438\u0441\u0442\u0435 \u0445\u043e\u0442\u044f \u0431\u044b \u0434\u0432\u0430\u0436\u0434\u044b, \u043e\u043f\u043e\u0437\u043d\u0430\u0451\u0442\u0441\u044f \u043d\u0430\u0434\u0451\u0436\u043d\u043e. \u041f\u043e\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0435\u0442 \u043d\u0435 \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u043e\u0432\u0442\u043e\u0440 \u0441\u043b\u043e\u0432\u0430, \u043d\u043e \u0438 \u0441\u043e\u0441\u0435\u0434\u0441\u0442\u0432\u043e \u043e\u0434\u043d\u043e\u0442\u0438\u043f\u043d\u044b\u0445 \u0437\u043d\u0430\u043a\u043e\u0432."], ["F. \u041c\u0435\u0442\u043e\u0434 \u0447\u0442\u0435\u043d\u0438\u044f", "\u0412\u0442\u043e\u0440\u043e\u0439 \u043f\u0440\u043e\u0445\u043e\u0434 \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u0435\u043d", "\u041d\u0435 \u0437\u0430\u043a\u0440\u044b\u0432\u0430\u0442\u044c \u00ab?\u00bb \u043d\u0430 \u043f\u0435\u0440\u0432\u043e\u043c \u0437\u0430\u0445\u043e\u0434\u0435: konstituiert \u0438 kommunikativ \u043d\u0435 \u0434\u0430\u044e\u0442\u0441\u044f \u0432 \u0441\u0442\u043a. 3 \u0438 \u0434\u0430\u044e\u0442\u0441\u044f \u0432 \u0441\u0442\u043a. 9\u201310. \u0411\u043e\u043d\u0443\u0441 \u0434\u0430\u0451\u0442 \u043f\u043e\u0432\u0442\u043e\u0440 \u043a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0446\u0438\u0438, \u0430 \u043d\u0435 \u0441\u043b\u043e\u0432\u0430."], ["F. \u041c\u0435\u0442\u043e\u0434 \u0447\u0442\u0435\u043d\u0438\u044f", "\u0421\u0447\u0438\u0442\u0430\u0442\u044c \u0434\u043b\u0438\u043d\u0443 \u043a\u0430\u0440\u043a\u0430\u0441\u0430", "neuen (n + \u043f\u043e\u0434\u044a\u0451\u043c + n) \u043d\u0435 \u0432\u043c\u0435\u0449\u0430\u0435\u0442 nat\u00fcrlichen, \u043a\u043e\u0442\u043e\u0440\u043e\u0435 \u043f\u043e\u0442\u0440\u0435\u0431\u043e\u0432\u0430\u043b\u043e \u0431\u044b \u0432\u0434\u0432\u043e\u0435 \u0431\u043e\u043b\u044c\u0448\u0435 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u043e\u0432. \u041f\u0440\u0435\u0436\u0434\u0435 \u0447\u0435\u043c \u043f\u0440\u0438\u043d\u044f\u0442\u044c \u0434\u043b\u0438\u043d\u043d\u043e\u0435 \u0441\u043b\u043e\u0432\u043e \u2014 \u043f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c, \u043f\u043e\u043c\u0435\u0449\u0430\u0435\u0442\u0441\u044f \u043b\u0438 \u043e\u043d\u043e \u0432 \u0437\u043d\u0430\u043a."], ["F. \u041c\u0435\u0442\u043e\u0434 \u0447\u0442\u0435\u043d\u0438\u044f", "\u041e\u0442\u0432\u0435\u0442 \u0447\u0430\u0441\u0442\u043e \u0443\u0436\u0435 \u0432 \u0443\u043a\u0430\u0437\u0430\u0442\u0435\u043b\u0435 \u2014 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u0442\u044c, \u0430 \u043d\u0435 \u0432\u044b\u0432\u043e\u0434\u0438\u0442\u044c \u0437\u0430\u043d\u043e\u0432\u043e", "\u0422\u0435\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u0441\u043b\u043e\u0439 \u043e\u043f\u043e\u0437\u043d\u0430\u0451\u0442\u0441\u044f \u0441\u0440\u0430\u0437\u0443: \u043d\u043e\u0432\u0438\u0437\u043d\u0430 \u043d\u0435\u0437\u043d\u0430\u043a\u043e\u043c\u043e\u0433\u043e \u043f\u0430\u0440\u0430\u0433\u0440\u0430\u0444\u0430 \u0442\u043e\u043b\u044c\u043a\u043e \u0432 \u043a\u043e\u0440\u043d\u044f\u0445, \u043c\u0435\u0445\u0430\u043d\u0438\u043a\u0438 \u043f\u0435\u0440\u0435\u043d\u043e\u0441\u044f\u0442\u0441\u044f. \u041d\u0438\u0436\u043d\u044f\u044f \u0442\u0440\u0435\u0442\u044c \u043b\u0438\u0441\u0442\u0430 \u2014 \u0441\u0430\u043c\u0430\u044f \u00ab\u0434\u0435\u0431\u0430\u0442\u043d\u0430\u044f\u00bb, \u0442\u0430\u043c \u0413\u0443\u0441\u0441\u0435\u0440\u043b\u044c \u043f\u0438\u0448\u0435\u0442 \u043d\u0430 \u043f\u0440\u0435\u0434\u0435\u043b\u0435 \u0441\u0436\u0430\u0442\u0438\u044f."]]};
</script>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const UM = {'ä':'a','ö':'o','ü':'u','ß':'s','é':'e','è':'e','à':'a','ô':'o','ç':'c','œ':'oe'};
const fold = s => (s || '').toLowerCase().replace(/[äöüßéèàôçœ]/g, c => UM[c] || c);
const keyOf = s => fold(s).replace(/[^a-zа-яё0-9]+/g, '');
const web = f => 'img_web/' + f.slice(4, -4) + '.webp';
const esc = s => (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const M0 = '\ue000', M1 = '\ue001';
const strip = s => (s || '').split(M0).join('').split(M1).join('');
const blNum = b => parseInt(b) * 2 + (b.slice(-1) === 'b' ? 1 : 0);

/* ---------- indexes ---------- */
const SHEET = {}; DB.sheets.forEach(s => SHEET[s.bl] = s);
const XREF = new Map();
DB.items.forEach((it, i) => {
  it.hay = fold(strip([it.w, it.b, it.k, it.c, it.p, it.s, it.t, it.l].join(' ')));
  it.key = keyOf(it.w.split(/\s*\/\s*/)[0]);
  it.w.split(/\s*\/\s*/).forEach(part => {
    const k = keyOf(part);
    if (k.length > 2 && !XREF.has(k)) XREF.set(k, i);
  });
});
const BLC = {};
DB.items.forEach(it => it.occ.forEach(([b]) => BLC[b] = (BLC[b] || 0) + 1));
const BLS = Object.keys(BLC).sort((a, b) => blNum(a) - blNum(b));
const LETTERS = ['#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];

/* ---------- state ---------- */
const S = {mode:'abc', q:'', layer:'', type:'', letter:'', bl:'', cuts:false, act:-1};
let RESULT = [], shown = 0, LB = [], lbi = 0;

/* ---------- search ---------- */
function parseQ(q) {
  const terms = [], f = {};
  q.trim().split(/\s+/).filter(Boolean).forEach(t => {
    const m = t.match(/^(bl|лист|тип|typ):(.+)$/i);
    if (m) { const k = /bl|лист/i.test(m[1]) ? 'bl' : 'type'; f[k] = fold(m[2]); }
    else terms.push(fold(t));
  });
  return {terms, f};
}
function filtered() {
  const {terms, f} = parseQ(S.q);
  return DB.items.filter(it =>
    (!S.layer || it.l === S.layer) && (!S.type || it.t === S.type) &&
    (!f.type || fold(it.t).includes(f.type)) &&
    (!S.letter || it.a === S.letter) &&
    (!S.bl || it.occ.some(o => o[0] === S.bl)) &&
    (!f.bl || it.occ.some(o => fold(o[0]) === f.bl)) &&
    (!S.cuts || it.f.length) &&
    terms.every(t => it.hay.includes(t)));
}

/* ---------- html of one card ---------- */
function hilite(html, terms) {
  if (!terms.length) return html;
  return html.split(/(<[^>]*>)/).map(part => {
    if (part.startsWith('<')) return part;
    terms.forEach(t => {
      if (t.length < 2) return;
      const rx = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      part = part.replace(rx, '\u0001$1\u0002');
    });
    return part;
  }).join('').split('\u0001').join('<mark>').split('\u0002').join('</mark>');
}
function rich(t, terms) {
  let h = esc(t || '');
  h = h.replace(/\ue000([^\ue001]*)\ue001/g, (m, w) => {
    const i = XREF.get(keyOf(w));
    return i != null ? '<a class="xr" data-i="' + i + '">' + w + '</a>' : '<em>' + w + '</em>';
  });
  return hilite(h, terms);
}
function cardHTML(it, i, badge, terms, blOnly) {
  let ff = it.f;
  if (blOnly) { const s = ff.filter(f => f.indexOf('/bl' + blOnly + '_') > -1); if (s.length) ff = s; }
  const cuts = ff.length
    ? '<div class="cuts">' + ff.slice(0, 3).map(f =>
        '<img loading="lazy" decoding="async" src="' + web(f) + '" alt="' + esc(it.w) + '" data-i="' + i + '" data-n="' + it.f.indexOf(f) + '">').join('') + '</div>'
    : '<div class="cuts"><div class="nocut"></div></div>';
  const chips = [
    '<span class="chip">' + it.t + '</span>',
    badge ? '<span class="chip b">' + badge + '</span>' : (it.p ? '<span class="chip">Bl. ' + esc(it.p) + '</span>' : ''),
    it.s ? '<span class="chip">G1850 ' + esc(it.s) + '</span>' : ''
  ].filter(Boolean).join('');
  return '<div class="card" id="c' + i + '" data-i="' + i + '">' + cuts +
    '<div><div class="hd"><span class="w">' + hilite(esc(it.w), terms) + '</span>' + chips + '</div>' +
    (it.b ? '<div class="lit"><b>букв.</b> ' + rich(it.b, terms) + '</div>' : '') +
    (it.k ? '<div class="k">' + rich(it.k, terms) + '</div>' : '') +
    (it.c ? '<div class="c">' + rich(it.c, terms) + '</div>' : '') +
    '</div></div>';
}

/* ---------- render ---------- */
function build() {
  const rows = filtered();
  if (S.mode === 'bl') {
    RESULT = [];
    rows.forEach((it, n) => {
      const idx = DB.items.indexOf(it);
      if (!it.occ.length) { RESULT.push({it, i: idx, g: '—', line: 9999}); return; }
      const byBl = {};
      it.occ.forEach(([b, l]) => { if (!(b in byBl) || (l != null && l < byBl[b])) byBl[b] = l; });
      Object.entries(byBl).forEach(([b, l]) => RESULT.push({it, i: idx, g: b, line: l == null ? 9998 : l}));
    });
    RESULT.sort((a, b) => (a.g === '—') - (b.g === '—') || blNum(a.g) - blNum(b.g) ||
      a.line - b.line || a.it.w.localeCompare(b.it.w));
  } else {
    RESULT = rows.map(it => ({it, i: DB.items.indexOf(it), g: it.a, line: 0}));
  }
  shown = 0; S.act = -1;
  LB = [];
  RESULT.forEach(r => r.it.f.forEach((f, n) => LB.push({src: f, it: r.it, n})));
  $('#list').innerHTML = '';
  paint();
  sidebar(rows);
}
function groupHead(g) {
  if (S.mode === 'bl') {
    if (g === '—') return '<div class="gh"><b>Без адреса листа</b><span class="meta">знаки слоя правки</span></div>';
    const s = SHEET[g] || {};
    return '<div class="gh"><b>Bl. ' + g + '</b><span class="meta">' +
      (s.hua ? esc(s.hua) : 'нет эталона') + (s.scan ? ' <em>· ' + esc(s.scan) + '</em>' : '') +
      ' <em>· ' + (BLC[g] || 0) + ' карт.</em></span></div>';
  }
  return '<div class="gh"><b>' + (g === '#' ? 'Прочее' : g) + '</b></div>';
}
function paint() {
  const {terms} = parseQ(S.q);
  const list = $('#list');
  if (!RESULT.length) { list.innerHTML = '<div class="empty">Ничего не найдено</div>'; return; }
  const slice = RESULT.slice(shown, shown + 70);
  let h = '';
  slice.forEach((r, n) => {
    const prev = shown + n > 0 ? RESULT[shown + n - 1].g : null;
    if (r.g !== prev) h += groupHead(r.g);
    h += cardHTML(r.it, r.i, S.mode === 'bl' && r.line < 9998 ? 'стк. ' + r.line : '', terms, S.mode === 'bl' && r.g !== '—' ? r.g : '');
  });
  const old = list.querySelector('.more'); if (old) old.remove();
  list.insertAdjacentHTML('beforeend', h);
  shown += slice.length;
  if (shown < RESULT.length) {
    list.insertAdjacentHTML('beforeend', '<div class="more">…ещё ' + (RESULT.length - shown) + '</div>');
    IO.observe(list.querySelector('.more'));
  }
}
const IO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { IO.unobserve(e.target); paint(); } }),
  {rootMargin: '600px'});

/* ---------- sidebar ---------- */
function sidebar(rows) {
  const seenL = new Set(rows.map(r => r.a));
  $('#abc').innerHTML = LETTERS.map(a =>
    '<a href="#" data-a="' + a + '" class="' + (S.letter === a ? 'on' : (seenL.has(a) ? '' : 'off')) + '">' + a + '</a>').join('');
  const seenB = new Set(); rows.forEach(r => r.occ.forEach(o => seenB.add(o[0])));
  $('#bls').innerHTML = BLS.map(b =>
    '<a href="#" data-b="' + b + '" class="' + (S.bl === b ? 'on' : (seenB.has(b) ? '' : 'off')) + '">' +
    b + '<i>' + BLC[b] + '</i></a>').join('');
  $('#stat').innerHTML = 'Показано <b>' + rows.length + '</b> из ' + DB.items.length + ' карточек' +
    '<br>Всего листов: ' + BLS.length + ' · вырезок: ' + DB.items.reduce((s, i) => s + i.f.length, 0) +
    '<br><br>Ausschnitte: Husserl-Archiv, KU Leuven · CC BY-SA';
}

/* ---------- modes ---------- */
function setMode(m) {
  S.mode = m;
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  const doc = ['parts', 'about'].includes(m);
  $('#doc').hidden = !doc; $('#list').hidden = doc;
  if (doc) { $('#doc').innerHTML = m === 'parts' ? PARTS() : ABOUT(); window.scrollTo(0, 0); }
  else build();
  location.hash = m === 'abc' ? '' : '#' + m;
}
function autolink(html) {
  if (html.indexOf('<a') > -1) return html;
  return html.split(/(<[^>]*>)/).map(p => p.startsWith('<') ? p :
    p.replace(/[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß-]{2,}/g, w => {
      const i = XREF.get(keyOf(w));
      return i != null ? '<a class="xr" data-i="' + i + '">' + w + '</a>' : w;
    })).join('');
}
function PARTS() {
  const cuts = a => a && a.length ? '<div class="cuts">' + a.map(f => '<img loading="lazy" src="' + f + '">').join('') + '</div>' : '';
  return '<h2>II.1. Омографы каркаса</h2><p>Один и тот же знак — разные слова; различает только грамматическое окружение. Это не дефект чтения, а устройство системы.</p>' +
   '<table><tr><th>Семья</th><th>Члены</th><th>Чем различаются</th></tr>' +
   DB.p2.II1.map(r => '<tr><td><b>' + rich(r[0], []) + '</b></td><td>' + autolink(rich(r[1], [])) + '</td><td>' + rich(r[2], []) + cuts(r[3]) + '</td></tr>').join('') + '</table>' +
   '<h2>II.2. Смешиваемые зиглы</h2><p>Пары, которые легко спутать, и признак различения.</p>' +
   '<table><tr><th>Пара</th><th>Как различать</th></tr>' +
   DB.p2.II2.map(r => '<tr><td><b>' + autolink(rich(r[0], [])) + '</b></td><td>' + rich(r[1], []) + '</td></tr>').join('') + '</table>' +
   '<h2>II.3. Открытые чтения</h2><p>Знаки, прочитанные графически, но не собранные в слово. Не закрывать угадыванием: ответ приходит со второго вхождения.</p>' +
   '<table><tr><th>Место</th><th>Что видно</th><th>Ограничения</th><th>Кандидаты</th></tr>' +
   DB.p2.II5.map(r => '<tr><td>' + rich(r[0], []) + cuts(r[1]) + '</td><td>' + rich(r[2], []) + '</td><td>' + rich(r[3], []) + '</td><td>' + rich(r[4], []) + '</td></tr>').join('') + '</table>' +
   '<h2>III. Принципы идиолекта</h2><p>Свод правил в шести группах: как устроено слово, служебный слой, три кода письма, слои рукописи, рукопись против печати, метод чтения.</p>' +
   '<table><tr><th>Группа</th><th>№</th><th>Правило</th><th>Содержание</th></tr>' +
   DB.p3.map((r, n) => '<tr class="rule"><td>' + esc(r[0]) + '</td><td>' + (n + 1) + '</td><td><b>' + esc(r[1]) + '</b></td><td>' + esc(r[2]) + '</td></tr>').join('') + '</table>';
}
function ABOUT() {
  return `<h2>Указатель гуссерлевских зиглов и сокращений</h2>
<p>Рабочий указатель сокращений, которыми Эдмунд Гуссерль пользовался в габельсбергеровской стенографии.
Материал — конволют <b>A V 21</b> «Ethisches Leben. Theologie — Wissenschaft» (1924–1927) из Husserl-Archiv, KU Leuven.
Каждая карточка — вырезка из скана в полном разрешении, буквальное чтение знака, адрес листа и строки
и, где лист издан, немецкий контекст с адресом по Hua XLII.</p>
<h2>Как устроена карточка</h2>
<table><tr><th>Поле</th><th>Что означает</th></tr>
<tr><td><b>Слово</b></td><td>Полное восстановленное слово. Алфавит — по нему; умляуты приравнены к базовой гласной, ß = s.</td></tr>
<tr><td><b>букв.</b></td><td>Буквальное чтение: только реально видимые элементы знака. Символизация — в скобках, <code>+</code> — раздельно написанные части, <code>~</code> — волнообразный минимальный штрих.</td></tr>
<tr><td><b>Bl. / стк.</b></td><td>Лист конволюта и строка. Нумерация архивная (Blatt, не страница).</td></tr>
<tr><td><b>G1850</b></td><td>Параграф школьной таблицы зиглов по изданию Gabelsberger 1850 — там, где знак совпадает с ней буква в букву.</td></tr>
<tr><td><b>Комментарий</b></td><td>Чем знак отличается от соседей по семье; ссылки на пары и правила.</td></tr>
<tr><td><b>Контекст</b></td><td>Немецкая фраза и адрес в Hua XLII (страница, строка).</td></tr></table>
<h2>Условные знаки</h2>
<table><tr><th>Знак</th><th>Значение</th></tr>
<tr><td><code>⟨X⟩</code></td><td>Конъектура издателей: в рукописи слова нет</td></tr>
<tr><td><code>⟦gestr.⟧</code></td><td>Вычерк в рукописи</td></tr>
<tr><td><code>Einf.</code></td><td>Вставка над строкой рукой Гуссерля</td></tr>
<tr><td><code>V. für</code></td><td>Замена: слово написано вместо другого</td></tr>
<tr><td><code>„…“</code></td><td>Терм-цитата, дистанцирование — авторские кавычки</td></tr>
<tr><td><code>⚠</code></td><td>Ловушка чтения</td></tr></table>
<h2>Источники и права</h2>
<p>Сканы и вырезки: <b>Husserl-Archiv, KU Leuven</b>, конволют A V 21, IIIF-манифест
<a href="https://lib.is/IE12988110/manifest" target="_blank" rel="noopener">lib.is/IE12988110</a>, лицензия <b>CC BY-SA</b>.
При использовании вырезок сохраняйте атрибуцию архива.<br>
Печатный эталон: <i>Husserliana XLII. Grenzprobleme der Phänomenologie</i>, hrsg. R. Sowa / T. Vongehr, Springer 2014.<br>
Система письма: F. X. Gabelsberger, <i>Anleitung zur deutschen Redezeichenkunst</i>, изд. 1834 и 1850.<br>
О стенографии Гуссерля: <a href="https://hiw.kuleuven.be/digitalhusserl/gabelsberger" target="_blank" rel="noopener">digitalHusserl · Gabelsberger Stenography</a>.</p>
<h2>Клавиши</h2>
<table><tr><th>Клавиша</th><th>Действие</th></tr>
<tr><td><code>/</code></td><td>Поиск</td></tr><tr><td><code>↑ ↓</code></td><td>Переход по карточкам</td></tr>
<tr><td><code>Enter</code></td><td>Открыть вырезку</td></tr><tr><td><code>← →</code></td><td>Соседняя вырезка в просмотре</td></tr>
<tr><td><code>Esc</code></td><td>Закрыть / сбросить поиск</td></tr></table>
<p>В поиске работают уточнения: <code>bl:26b</code> — только этот лист, <code>тип:аффикс</code> — только этот тип знака.</p>`;
}
</script>
<script>
/* ---------- events ---------- */
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
$('#q').addEventListener('input', debounce(e => { S.q = e.target.value; if (S.mode === 'abc' || S.mode === 'bl') build(); else setMode('abc'); }, 130));
$('#layer').onchange = e => { S.layer = e.target.value; build(); };
$('#type').onchange = e => { S.type = e.target.value; build(); };
$('#only').onclick = e => { S.cuts = !S.cuts; e.target.classList.toggle('on', S.cuts); build(); };
$('#dense').onclick = e => { document.body.classList.toggle('compact'); e.target.classList.toggle('on'); };
$('#burger').onclick = () => document.body.classList.toggle('nav');
const SZ = {s: [110, 40], m: [152, 58], l: [214, 86], xl: [300, 130]};
function setSize(k) {
  const [c, h] = SZ[k] || SZ.m;
  document.documentElement.style.setProperty('--cutcol', c + 'px');
  document.documentElement.style.setProperty('--cut', h + 'px');
  $$('#sizes button').forEach(b => b.classList.toggle('on', b.dataset.s === k));
  try { localStorage.gbSize = k; } catch (e) {}
}
$('#sizes').onclick = e => { const b = e.target.closest('button'); if (b) setSize(b.dataset.s); };
try { setSize(localStorage.gbSize || 'm'); } catch (e) { setSize('m'); }
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); };
$('#abc').onclick = e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault();
  S.letter = S.letter === a.dataset.a ? '' : a.dataset.a; if (S.mode !== 'abc') setMode('abc'); else build(); scrollTop(); };
$('#bls').onclick = e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault();
  S.bl = S.bl === a.dataset.b ? '' : a.dataset.b; if (S.mode !== 'bl') setMode('bl'); else build(); scrollTop(); };
const scrollTop = () => window.scrollTo({top: 0, behavior: 'instant'});

/* theme */
const setTheme = t => { document.documentElement.dataset.t = t; try { localStorage.gbTheme = t; } catch (e) {} };
$('#theme').onclick = () => setTheme(document.documentElement.dataset.t === 'dark' ? 'light' : 'dark');
try { if (localStorage.gbTheme) setTheme(localStorage.gbTheme);
      else if (matchMedia('(prefers-color-scheme:dark)').matches) setTheme('dark'); } catch (e) {}

/* ---------- card interactions ---------- */
$('#list').addEventListener('click', e => {
  const img = e.target.closest('.cuts img');
  if (img) { const it = DB.items[+img.dataset.i]; openLB(LB.findIndex(x => x.it === it && x.n === +img.dataset.n)); return; }
  const xr = e.target.closest('.xr');
  if (xr) { e.preventDefault(); goto(+xr.dataset.i); return; }
  const card = e.target.closest('.card');
  if (card) setAct(RESULT.findIndex(r => r.i === +card.dataset.i));
});
$('#doc').addEventListener('click', e => {
  const img = e.target.closest('.cuts img');
  if (img) { const src = img.getAttribute('src');
    openLB(LB.findIndex(x => x.src === src), [{src, it: {w: '', b: '', p: ''}, n: 0}]); return; }
  const xr = e.target.closest('.xr'); if (xr) { e.preventDefault(); goto(+xr.dataset.i); }
});

/* hover preview for cross-references */
const pv = $('#pv');
document.addEventListener('mouseover', e => {
  const xr = e.target.closest('.xr'); if (!xr) return;
  const it = DB.items[+xr.dataset.i];
  pv.innerHTML = '<b>' + esc(it.w) + '</b>' +
    (it.f.length ? '<img src="' + it.f[0] + '">' : '') +
    '<small>' + esc(it.b || it.t) + (it.p ? ' · Bl. ' + esc(it.p) : '') + '</small>';
  const r = xr.getBoundingClientRect();
  pv.classList.add('on');
  const h = pv.offsetHeight, w = pv.offsetWidth;
  pv.style.top = (r.top > h + 16 ? r.top - h - 8 : r.bottom + 8) + 'px';
  pv.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + 'px';
});
document.addEventListener('mouseout', e => { if (e.target.closest('.xr')) pv.classList.remove('on'); });

function goto(i) {
  S.q = ''; $('#q').value = ''; S.letter = ''; S.bl = ''; S.layer = ''; S.type = '';
  $('#layer').value = ''; $('#type').value = '';
  if (S.mode !== 'abc' && S.mode !== 'bl') setMode('abc'); else build();
  const pos = RESULT.findIndex(r => r.i === i);
  if (pos < 0) return;
  while (shown <= pos) paint();
  const el = document.getElementById('c' + i);
  if (el) { el.scrollIntoView({block: 'center', behavior: 'smooth'});
    el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1500); setAct(pos); }
  location.hash = 'w=' + DB.items[i].key;
}
function setAct(pos) {
  $$('.card.act').forEach(c => c.classList.remove('act'));
  S.act = pos;
  const r = RESULT[pos]; if (!r) return;
  const el = document.getElementById('c' + r.i);
  if (el) el.classList.add('act');
}
function move(d) {
  let p = S.act + d;
  if (p < 0) p = 0;
  if (p >= RESULT.length) p = RESULT.length - 1;
  while (shown <= p) paint();
  setAct(p);
  const el = document.getElementById('c' + RESULT[p].i);
  if (el) el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
}

/* ---------- lightbox ---------- */
const zoom = $('#zoom');
function openLB(i, custom) { if (custom) LB = custom; if (i < 0 || !LB.length) return; lbi = i; showLB(); zoom.classList.add('on'); }
function showLB() {
  const x = LB[lbi]; if (!x) return;
  zoom.querySelector('img').src = x.src;
  zoom.querySelector('.cap').innerHTML = '<b>' + esc(x.it.w || '') + '</b>' +
    esc(x.it.b || '') + (x.it.p ? ' · Bl. ' + esc(x.it.p) : '') +
    ' <span style="opacity:.6">· ' + (lbi + 1) + ' / ' + LB.length + '</span>';
}
zoom.onclick = e => { if (e.target === zoom || e.target.classList.contains('x')) zoom.classList.remove('on'); };
zoom.querySelector('.p').onclick = e => { e.stopPropagation(); lbi = (lbi - 1 + LB.length) % LB.length; showLB(); };
zoom.querySelector('.n').onclick = e => { e.stopPropagation(); lbi = (lbi + 1) % LB.length; showLB(); };

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  const inField = /input|textarea/i.test(e.target.tagName);
  if (zoom.classList.contains('on')) {
    if (e.key === 'Escape') zoom.classList.remove('on');
    if (e.key === 'ArrowLeft') { lbi = (lbi - 1 + LB.length) % LB.length; showLB(); }
    if (e.key === 'ArrowRight') { lbi = (lbi + 1) % LB.length; showLB(); }
    return;
  }
  if (e.key === '/' && !inField) { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (e.key === 'Escape') { if (inField) { $('#q').value = ''; S.q = ''; build(); $('#q').blur(); } return; }
  if (inField) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
  if (e.key === 'Enter' && S.act >= 0) {
    const r = RESULT[S.act];
    if (r && r.it.f.length) openLB(LB.findIndex(x => x.it === r.it));
  }
});

/* ---------- init ---------- */
[...new Set(DB.items.map(i => i.t))].sort().forEach(t => $('#type').add(new Option(t, t)));
function fromHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (!h) return false;
  if (['bl', 'parts', 'about', 'abc'].includes(h)) { setMode(h); return true; }
  const mw = h.match(/^w=(.+)$/); if (mw) { const i = XREF.get(keyOf(mw[1])); if (i != null) { build(); goto(i); return true; } }
  const mb = h.match(/^bl=(.+)$/); if (mb && BLC[mb[1]]) { S.bl = mb[1]; setMode('bl'); return true; }
  return false;
}
if (!fromHash()) build();
addEventListener('hashchange', () => { if (!location.hash) return; fromHash(); });
</script></body></html>
